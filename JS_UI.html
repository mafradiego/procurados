  window.alternarPinoPiscandoRapido = function (id, btnEl) {
    if (!window.listaLeisCompleta) return;
    const lei = window.listaLeisCompleta.find(l => String(l.id) === String(id));
    if (!lei) return;

    const iconEl = btnEl ? btnEl.querySelector('.material-symbols-outlined') : null;
    if (btnEl) {
      btnEl.style.pointerEvents = 'none';
      btnEl.style.opacity = '0.6';
    }
    if (iconEl) {
      iconEl.classList.add('icon-spin-fast');
    }

    const novoEstado = !lei.pinoPiscando;
    lei.pinoPiscando = novoEstado;

    if (window.showToast) {
      window.showToast(novoEstado ? "⚡ Salvando: Pino Piscando ATIVADO..." : "Salvando: Pino Piscando desativado...", novoEstado ? "warning" : "info");
    }

    const dados = {
      id: lei.id,
      categoria: lei.categoria || '',
      pinoTexto: lei.pinoTexto || '',
      cor: lei.cor || '#6b7280',
      ativo: lei.ativo !== false,
      leiNome: lei.leiNome || '',
      numeroLei: lei.numeroLei || '',
      artigo: lei.artigo || '',
      paragrafo: lei.paragrafo || '',
      inciso: lei.inciso || '',
      palavrasChave: lei.palavrasChave || '',
      tipificacaoCompleta: lei.tipificacaoCompleta || '',
      pinoPiscando: novoEstado
    };

    google.script.run
      .withSuccessHandler(function (res) {
        if (res && res.sucesso) {
          google.script.run
            .withSuccessHandler(function (leis) {
              window._tabelaLeis = leis || [];
              window.listaLeisCompleta = leis || [];
              if (typeof window.limparCacheClassificacao === 'function') window.limparCacheClassificacao();
              if (typeof window.filtrarLeisGrouped === 'function') window.filtrarLeisGrouped();
              if (typeof window.filtrarNoMapa === 'function') window.filtrarNoMapa();
              if (window.showToast) {
                window.showToast(novoEstado ? "⚡ Pino Piscando ATIVADO!" : "Pino Piscando desativado.", novoEstado ? "success" : "info");
              }
            })
            .obterLeis();
        } else {
          if (btnEl) { btnEl.style.pointerEvents = 'auto'; btnEl.style.opacity = '1'; }
          if (iconEl) iconEl.classList.remove('icon-spin-fast');
          if (typeof chamarAlertaTatico === 'function') chamarAlertaTatico("ERRO", (res && res.mensagem) || "Erro ao salvar.", "OK");
        }
      })
      .withFailureHandler(function (err) {
        if (btnEl) { btnEl.style.pointerEvents = 'auto'; btnEl.style.opacity = '1'; }
        if (iconEl) iconEl.classList.remove('icon-spin-fast');
        console.error("Erro ao salvar pino piscando:", err);
      })
      .salvarLei(dados);

  function setFormLoadingState(isLoading) {
    const form = document.getElementById('formLeiMaster');
    if (!form) return;

    const elements = form.querySelectorAll('input, select, textarea, button');
    elements.forEach(el => {
      el.disabled = isLoading;
    });

    const submitBtn = form.querySelector('button[type="submit"]');
    if (submitBtn) {
      if (isLoading) {
        submitBtn.innerHTML = `<span class="spinner-border" style="width: 14px; height: 14px; border: 2px solid white; border-top-color: transparent; border-radius: 50%; display: inline-block; animation: spin 0.8s linear infinite; margin-right: 6px;"></span> SALVANDO...`;
      } else {
        submitBtn.innerHTML = `<span class="material-symbols-outlined" style="font-size:16px;">save</span> SALVAR`;
      }
    }
  }

  if (!document.getElementById('spinner-keyframes')) {
    const style = document.createElement('style');
    style.id = 'spinner-keyframes';
    style.innerHTML = `
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    `;
    document.head.appendChild(style);
  }

  window.formatarPrecisaoGeocodificacao = function(precisao) {
    if (!precisao) return '';
    var p = String(precisao).trim().toUpperCase();
    switch (p) {
      case 'ROOFTOP':
        return 'Número Exato';
      case 'RANGE_INTERPOLATED':
      case 'INTERPOLATED':
        return 'Número Aproximado (Na Rua)';
      case 'GEOMETRIC_CENTER':
        return 'Centro da Rua / Bairro';
      case 'APPROXIMATE':
        return 'Região / Município';
      default:
        return precisao;
    }
  };
  var formatarPrecisaoGeocodificacao = window.formatarPrecisaoGeocodificacao;

  window.dadosInconsistenciasCache = [];
  window.mapaInconsistenciaInstancia = null;
  window.pinoInconsistenciaInstancia = null;

  window.incColunaOrdenacao = 'nome';
  window.incDirecaoOrdenacao = 'asc';

  window.carregarInconsistenciasUI = function () {
    if (window.showToast) window.showToast("Carregando inconsistências...", "info");
    var tbody = document.getElementById('tbody-inconsistencias');
    if (tbody) tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:20px;">Carregando...</td></tr>';

    google.script.run
      .withSuccessHandler(function (res) {
        if (res.sucesso) {
          window.dadosInconsistenciasCache = res.dados || [];
          window.filtrarEOrdenarInconsistenciasUI();
        } else {
          if (window.showToast) window.showToast("Erro: " + res.mensagem, "error");
        }
      })
      .withFailureHandler(function (err) {
        if (window.showToast) window.showToast("Falha de conexão: " + err.message, "error");
      })
      .buscarInconsistencias();
  };

  window.ordenarInconsistenciasPor = function (coluna) {
    if (window.incColunaOrdenacao === coluna) {
      window.incDirecaoOrdenacao = window.incDirecaoOrdenacao === 'asc' ? 'desc' : 'asc';
    } else {
      window.incColunaOrdenacao = coluna;
      window.incDirecaoOrdenacao = 'asc';
    }
    window.filtrarEOrdenarInconsistenciasUI();
  };

  window.filtrarEOrdenarInconsistenciasUI = function () {
    if (!window.dadosInconsistenciasCache) return;

    var inputBusca = document.getElementById('inputBuscaInconsistencias');
    var termo = inputBusca ? inputBusca.value.toLowerCase().trim() : '';

    var dadosFiltrados = window.dadosInconsistenciasCache.filter(function (item) {
      if (!termo) return true;
      var mandado = String(item.mandado || '').toLowerCase();
      var nome = String(item.nome || '').toLowerCase();
      var tipo = String(item.tipoEndereco || '').toLowerCase();
      var end = String(item.enderecoExtendido || item.endereco || '').toLowerCase();
      var status = String(item.statusErro || '').toLowerCase();

      return mandado.includes(termo) || nome.includes(termo) || tipo.includes(termo) || end.includes(termo) || status.includes(termo);
    });

    var col = window.incColunaOrdenacao || 'nome';
    var dir = window.incDirecaoOrdenacao || 'asc';

    dadosFiltrados.sort(function (a, b) {
      var valA = String(a[col] || '').toLowerCase();
      var valB = String(b[col] || '').toLowerCase();

      var comp = valA.localeCompare(valB, 'pt-BR', { numeric: true, sensitivity: 'base' });
      return dir === 'asc' ? comp : -comp;
    });

    // Atualizar ícones de cabeçalho estilo planilha
    ['mandado', 'nome', 'tipoEndereco', 'enderecoExtendido', 'statusErro'].forEach(function (c) {
      var icon = document.getElementById('sort-icon-' + c);
      if (icon) {
        if (c === col) {
          icon.textContent = dir === 'asc' ? 'arrow_upward' : 'arrow_downward';
          icon.style.opacity = '1';
          icon.style.color = '#ef4444';
        } else {
          icon.textContent = 'unfold_more';
          icon.style.opacity = '0.4';
          icon.style.color = 'var(--text-muted)';
        }
      }
    });

    renderizarInconsistenciasTabela(dadosFiltrados);
  };

  function renderizarInconsistenciasTabela(dadosExibicao) {
    var tbody = document.getElementById('tbody-inconsistencias');
    if (!tbody) return;

    var todosDados = window.dadosInconsistenciasCache || dadosExibicao || [];

    // Atualizar métricas (Cards)
    var countSemCidade = 0;
    var countZero = 0;
    var countAprox = 0;
    var total = todosDados.length;

    todosDados.forEach(function (d) {
      var err = (d.statusErro || "").toLowerCase();
      if (err.includes("cidade") || err.includes("uf") || err.includes("trava")) countSemCidade++;
      else if (err.includes("zero") || err.includes("não localizado") || err.includes("not found")) countZero++;
      else if (err.includes("aprox") || err.includes("centro") || err.includes("geometric")) countAprox++;
      else countSemCidade++;
    });

    var pctSem = total > 0 ? Math.round((countSemCidade / total) * 100) : 0;
    var pctZero = total > 0 ? Math.round((countZero / total) * 100) : 0;
    var pctAprox = total > 0 ? Math.round((countAprox / total) * 100) : 0;

    if (document.getElementById('inc-card-sem-cidade')) {
      document.getElementById('inc-card-sem-cidade').innerHTML = countSemCidade + ` <span style="font-size:14px;font-weight:600;opacity:0.7;">(${pctSem}%)</span>`;
    }
    if (document.getElementById('inc-card-zero-results')) {
      document.getElementById('inc-card-zero-results').innerHTML = countZero + ` <span style="font-size:14px;font-weight:600;opacity:0.7;">(${pctZero}%)</span>`;
    }
    if (document.getElementById('inc-card-aprox-extrema')) {
      document.getElementById('inc-card-aprox-extrema').innerHTML = countAprox + ` <span style="font-size:14px;font-weight:600;opacity:0.7;">(${pctAprox}%)</span>`;

    if (!dadosExibicao || dadosExibicao.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:40px;color:var(--text-muted);">Nenhuma inconsistência encontrada para os filtros aplicados.</td></tr>';
      return;

    var html = '';

      var badgeTipo = (d.tipoEndereco === 'Secundário')
        ? `<span style="background:rgba(245,158,11,0.15);color:#fbbf24;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:800;border:1px solid rgba(245,158,11,0.3);">SECUNDÁRIO</span>`
        : `<span style="background:rgba(59,130,246,0.15);color:#60a5fa;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:800;border:1px solid rgba(59,130,246,0.3);">PRINCIPAL</span>`;

      var corBadgeBg = 'rgba(239,68,68,0.1)';
      var corBadgeTxt = '#ef4444';
      var corBadgeBorder = 'rgba(239,68,68,0.2)';
      if (err.includes("cidade") || err.includes("uf") || err.includes("trava")) {
        corBadgeBg = 'rgba(59,130,246,0.1)'; corBadgeTxt = '#3b82f6'; corBadgeBorder = 'rgba(59,130,246,0.2)';
      } else if (err.includes("zero") || err.includes("não localizado") || err.includes("not found")) {
        corBadgeBg = 'rgba(245,158,11,0.1)'; corBadgeTxt = '#f59e0b'; corBadgeBorder = 'rgba(245,158,11,0.2)';
      }

      html += `<tr style="border-bottom:1px solid rgba(255,255,255,0.05);cursor:pointer;transition:background 0.2s;" onmouseover="this.style.background='rgba(255,255,255,0.05)'" onmouseout="this.style.background='transparent'" onclick="abrirSidebarInconsistencias(${realIndex})">
        <td style="padding:12px 16px;font-weight:700;color:var(--text-main);white-space:nowrap;">

              <span class="material-symbols-outlined" style="font-size:13px;">content_copy</span>

        <td style="padding:12px 16px;"><span style="background:${corBadgeBg};color:${corBadgeTxt};padding:4px 8px;border-radius:4px;font-size:10px;font-weight:700;border:1px solid ${corBadgeBorder};">${d.statusErro}</span>${badgeSugestao}</td>

  window.abrirSidebarInconsistencias = function (index) {
    var d = window.dadosInconsistenciasCache[index];
    if (!d) return;

    if (document.getElementById('incons-mandado')) document.getElementById('incons-mandado').value = d.mandado;
    if (document.getElementById('incons-txt-mandado')) document.getElementById('incons-txt-mandado').innerText = d.mandado || "—";
    if (document.getElementById('incons-txt-nome')) document.getElementById('incons-txt-nome').innerText = d.nome || "—";
    if (document.getElementById('incons-endereco-sujo')) document.getElementById('incons-endereco-sujo').innerText = d.enderecoExtendido;

    var logradouro = '';
    var numero = '';
    var bairro = '';
    var cidade = '';
    var uf = '';

    if (d.enderecoExtendido) {
      var endStr = d.enderecoExtendido.trim();
      var matchUf = endStr.match(/\s*-\s*([A-Z]{2})\s*$/i);
      if (matchUf) {
        uf = matchUf[1].toUpperCase();
        endStr = endStr.substring(0, endStr.length - matchUf[0].length).trim();
      }

      var partes = endStr.split(',').map(function (s) { return s.trim(); }).filter(function (s) { return s.length > 0; });

      if (partes.length >= 1) {
        var matchNumNoLog = partes[0].match(/^(.+?)\s+(\d+[A-Za-z]?(?:\s*[\/\-]\s*\d+)?)\s*$/);
        if (matchNumNoLog) {
          logradouro = matchNumNoLog[1].trim();
          numero = matchNumNoLog[2].trim();
        } else {
          logradouro = partes[0];
        }
      }

      if (partes.length >= 2) {
        var p1 = partes[1];
        if (/^\d+|^S\/N|^SN/i.test(p1) && !numero) {
          numero = p1;
          if (partes.length >= 3) {
            var p2Parts = partes[2].split(/\s*-\s*/);
            if (p2Parts.length >= 2) {
              bairro = p2Parts[0].trim();
              cidade = p2Parts.slice(1).join(' - ').trim();
            } else {
              bairro = partes[2];
            }
          }
          if (partes.length >= 4 && !cidade) {
            var cidParts = partes.slice(3).join(', ').split(/\s*-\s*/);
            cidade = cidParts[0].trim();
            if (cidParts.length > 1 && !uf) uf = cidParts[cidParts.length - 1].trim();
          }
        } else {
          if (!numero) {
            var p1Parts = p1.split(/\s*-\s*/);
            if (p1Parts.length >= 2) {
              bairro = p1Parts[0].trim();
              cidade = p1Parts.slice(1).join(' - ').trim();
            } else {
              bairro = p1;
            }
          }
          if (partes.length >= 3 && !cidade) {
            var cidParts = partes.slice(2).join(', ').split(/\s*-\s*/);
            cidade = cidParts[0].trim();
            if (cidParts.length > 1 && !uf) uf = cidParts[cidParts.length - 1].trim();
          }
        }
      }

      if (cidade && uf) {
        var ufRegex = new RegExp('\\s*[-]?\\s*' + uf + '$');
        if (ufRegex.test(cidade)) {
          cidade = cidade.replace(ufRegex, '').trim();
        }
      }
      if (uf && uf.length > 2) uf = uf.substring(0, 2);

      if (!cidade && d.enderecoExtendido.includes(' - ')) {
        var dashParts = d.enderecoExtendido.split(' - ');
        if (dashParts.length >= 2) {
          if (!uf && /^[A-Z]{2}$/i.test(dashParts[dashParts.length - 1].trim())) {
            uf = dashParts[dashParts.length - 1].trim().toUpperCase();
            cidade = dashParts[dashParts.length - 2].split(',').pop().trim();
          } else {
            cidade = dashParts[dashParts.length - 1].split(',')[0].trim();
          }
        }
      }
    }

    if (document.getElementById('incons-logradouro')) document.getElementById('incons-logradouro').value = logradouro;
    if (document.getElementById('incons-numero')) document.getElementById('incons-numero').value = numero;
    if (document.getElementById('incons-bairro')) document.getElementById('incons-bairro').value = bairro;
    if (document.getElementById('incons-cidade')) document.getElementById('incons-cidade').value = cidade;
    if (document.getElementById('incons-uf')) document.getElementById('incons-uf').value = uf;

    if (document.getElementById('incons-lat')) document.getElementById('incons-lat').value = '';
    if (document.getElementById('incons-lng')) document.getElementById('incons-lng').value = '';

    if (document.getElementById('incons-fonte-geo')) document.getElementById('incons-fonte-geo').style.display = 'none';
    if (document.getElementById('box-sugestao-maps')) document.getElementById('box-sugestao-maps').style.display = 'none';

    if (window.mapaInconsistenciaInstancia && window.pinoInconsistenciaInstancia) {
      window.pinoInconsistenciaInstancia.setMap(null);
      window.mapaInconsistenciaInstancia.setCenter({ lat: -23.5505, lng: -46.6333 });
      window.mapaInconsistenciaInstancia.setZoom(5);
    }

    if (document.getElementById('incons-map-placeholder')) {
      document.getElementById('incons-map-placeholder').style.display = 'flex';
    }

    var sidebar = document.getElementById('sidebar-inconsistencias');
    if (sidebar) {
      sidebar.style.display = 'flex';
      setTimeout(() => { sidebar.style.transform = 'translateX(0)'; }, 10);
    }

    var inputLogradouro = document.getElementById('incons-logradouro');
    if (inputLogradouro && !inputLogradouro.hasAttribute('data-autocomplete-init') && typeof google !== 'undefined' && google.maps && google.maps.places) {
      var autocompleteInc = new google.maps.places.Autocomplete(inputLogradouro, {
        componentRestrictions: { country: "br" }
      });
      autocompleteInc.addListener('place_changed', function () {
        var place = autocompleteInc.getPlace();
        if (!place.address_components) return;

        var comp = place.address_components;
        var r = "", n = "", b = "", c = "", u = "";
        for (var i = 0; i < comp.length; i++) {
          var type = comp[i].types[0];
          if (type === 'route') r = comp[i].long_name;
          if (type === 'street_number') n = comp[i].long_name;
          if (type === 'sublocality_level_1' || type === 'sublocality') b = comp[i].long_name;
          if (type === 'administrative_area_level_2') c = comp[i].long_name;
          if (type === 'administrative_area_level_1') u = comp[i].short_name;
        }
        if (r) document.getElementById('incons-logradouro').value = r;
        if (n) document.getElementById('incons-numero').value = n;
        if (b) document.getElementById('incons-bairro').value = b;
        if (c) document.getElementById('incons-cidade').value = c;
        if (u) document.getElementById('incons-uf').value = u;
      });
      inputLogradouro.setAttribute('data-autocomplete-init', 'true');
    }
  };

  window.fecharSidebarInconsistencias = function () {
    document.getElementById('sidebar-inconsistencias').style.transform = 'translateX(100%)';
    setTimeout(() => { document.getElementById('sidebar-inconsistencias').style.display = 'none'; }, 300);

  function inicializarMapaInconsistencia(lat, lng, zoomLevel) {
    var mapDiv = document.getElementById('mapa-inconsistencia');
    var placeholder = document.getElementById('incons-map-placeholder');
    if (placeholder) placeholder.style.display = 'none';

    if (!window.mapaInconsistenciaInstancia) {
      window.mapaInconsistenciaInstancia = new google.maps.Map(mapDiv, {
        center: { lat: lat, lng: lng },
        zoom: zoomLevel || 16,
        mapTypeId: 'roadmap',
        disableDefaultUI: true,
        gestureHandling: 'greedy',
        styles: (typeof MAP_STYLE_DARK !== 'undefined') ? MAP_STYLE_DARK : []
      });
    } else {
      window.mapaInconsistenciaInstancia.setCenter({ lat: lat, lng: lng });
      window.mapaInconsistenciaInstancia.setZoom(zoomLevel || 16);
    }

    if (window.pinoInconsistenciaInstancia) window.pinoInconsistenciaInstancia.setMap(null);

    window.pinoInconsistenciaInstancia = new google.maps.Marker({
      position: { lat: lat, lng: lng },
      map: window.mapaInconsistenciaInstancia,
      draggable: true,
      title: "Arraste para ajustar o local exato"
    });

    window.pinoInconsistenciaInstancia.addListener('dragend', function (evt) {
      var nLat = evt.latLng.lat().toFixed(6);
      var nLng = evt.latLng.lng().toFixed(6);
      document.getElementById('incons-lat').value = nLat;
      document.getElementById('incons-lng').value = nLng;
      if (window.showToast) window.showToast("Pino reposicionado (" + nLat + ", " + nLng + ")", "info");
    });
  }

  window.buscarCoordenadasInconsistencia = function (method) {
    var rua = document.getElementById('incons-logradouro').value.trim();
    var num = document.getElementById('incons-numero').value.trim();
    var bai = document.getElementById('incons-bairro').value.trim();
    var cid = document.getElementById('incons-cidade').value.trim();
    var uf = document.getElementById('incons-uf').value.trim();

    if (!rua || !cid) {
      if (window.showToast) window.showToast("Preencha ao menos Logradouro e Cidade para buscar.", "warning");
      return;
    }

    var enderecoStr = rua;
    if (num) enderecoStr += ", " + num;
    if (bai) enderecoStr += ", " + bai;
    enderecoStr += " - " + cid;
    if (uf) enderecoStr += " - " + uf;

    var forceGoogle = (method === true || method === "Google");
    var providerName = forceGoogle ? "Google Maps" : "Mapbox";

    var btnActive = document.getElementById(forceGoogle ? 'btn-buscar-google' : 'btn-buscar-osm');
    var btnOther = document.getElementById(forceGoogle ? 'btn-buscar-osm' : 'btn-buscar-google');

    var origHtmlActive = btnActive ? btnActive.innerHTML : '';
    if (btnActive) {
      btnActive.disabled = true;
      btnActive.innerHTML = `<span class="material-symbols-outlined" style="font-size:14px;animation:spin 1s linear infinite;">sync</span> Buscando...`;
    }
    if (btnOther) btnOther.disabled = true;

    var boxSugestao = document.getElementById('box-sugestao-maps');
    var tituloSugestao = document.getElementById('incons-titulo-sugestao');
    var badgePrecisao = document.getElementById('incons-badge-precisao');
    var textoSugerido = document.getElementById('incons-endereco-sugerido');
    var btnAceitar = document.getElementById('btn-aceitar-sugestao');

    if (boxSugestao) boxSugestao.style.display = 'none';

    if (window.showToast) window.showToast("Buscando no " + providerName + "...", "info");

    var backendMethod = forceGoogle ? "Google" : (method === "Mapbox" ? "Mapbox" : false);
    var mandadoNum = document.getElementById('incons-mandado') ? document.getElementById('incons-mandado').value : '';

    google.script.run
      .withSuccessHandler(function (res) {
        if (btnActive) { btnActive.disabled = false; btnActive.innerHTML = origHtmlActive; }
        if (btnOther) btnOther.disabled = false;

        if (res && res.lat && res.lng) {
          document.getElementById('incons-lat').value = res.lat;
          document.getElementById('incons-lng').value = res.lng;

          var fonteEl = document.getElementById('incons-fonte-geo');
          if (fonteEl) {
            fonteEl.innerText = "Fonte: " + res.fonte;
            fonteEl.style.color = res.fonte === "Google" ? "#4285F4" : "#10b981";
            fonteEl.style.display = "block";
          }

          if (res.precisao && badgePrecisao) {
            badgePrecisao.style.display = 'inline-block';
            badgePrecisao.innerText = window.formatarPrecisaoGeocodificacao(res.precisao);
            if (res.precisao === "ROOFTOP") {
              badgePrecisao.style.background = "rgba(16,185,129,0.1)"; badgePrecisao.style.color = "#10b981";
            } else if (res.precisao === "RANGE_INTERPOLATED" || res.precisao === "INTERPOLATED") {
              badgePrecisao.style.background = "rgba(245,158,11,0.1)"; badgePrecisao.style.color = "#f59e0b";
            } else {
              badgePrecisao.style.background = "rgba(239,68,68,0.1)"; badgePrecisao.style.color = "#ef4444";
            }
          }

          if (res.enderecoFormatado && textoSugerido && boxSugestao) {
            if (tituloSugestao) {
              tituloSugestao.innerText = "SUGESTÃO DE ENDEREÇO (" + res.fonte + ")";
              tituloSugestao.style.color = "#10b981";
            }
            textoSugerido.innerText = res.enderecoFormatado;
            textoSugerido.style.color = "var(--text-main)";
            boxSugestao.style.background = "rgba(16,185,129,0.05)";
            boxSugestao.style.border = "1px solid rgba(16,185,129,0.2)";
            if (btnAceitar) btnAceitar.style.display = "block";
            boxSugestao.style.display = "block";
          }

          if (window.showToast) window.showToast("Encontrado via " + res.fonte, "success");
          inicializarMapaInconsistencia(res.lat, res.lng, 17);
        } else {
          if (boxSugestao && textoSugerido) {
            if (tituloSugestao) {
              tituloSugestao.innerText = "⚠️ ENDEREÇO NÃO LOCALIZADO (" + providerName.toUpperCase() + ")";
              tituloSugestao.style.color = "#ef4444";
            }
            if (badgePrecisao) badgePrecisao.style.display = 'none';
            textoSugerido.innerText = "Nenhum resultado encontrado no " + providerName + " para este endereço. Verifique a grafia dos campos ou tente o outro provedor de busca.";
            textoSugerido.style.color = "#ef4444";
            boxSugestao.style.background = "rgba(239,68,68,0.1)";
            boxSugestao.style.border = "1px solid rgba(239,68,68,0.3)";
            if (btnAceitar) btnAceitar.style.display = "none";
            boxSugestao.style.display = "block";
          }
          if (window.showToast) window.showToast("Endereço não localizado via " + providerName, "error");
        }
      })
      .withFailureHandler(function (err) {
        if (btnActive) { btnActive.disabled = false; btnActive.innerHTML = origHtmlActive; }
        if (btnOther) btnOther.disabled = false;

        if (boxSugestao && textoSugerido) {
          if (tituloSugestao) {
            tituloSugestao.innerText = "⚠️ ERRO NA BUSCA (" + providerName.toUpperCase() + ")";
            tituloSugestao.style.color = "#ef4444";
          }
          if (badgePrecisao) badgePrecisao.style.display = 'none';
          textoSugerido.innerText = "Falha na busca: " + (err.message || "Erro de conexão com o provedor");
          textoSugerido.style.color = "#ef4444";
          boxSugestao.style.background = "rgba(239,68,68,0.1)";
          boxSugestao.style.border = "1px solid rgba(239,68,68,0.3)";
          if (btnAceitar) btnAceitar.style.display = "none";
          boxSugestao.style.display = "block";
        }
        if (window.showToast) window.showToast("Erro na geocodificação: " + err.message, "error");
      })
      .geocodificarHibrido(enderecoStr, backendMethod, mandadoNum);
  };

  window.aceitarSugestaoMaps = function () {
    var sugo = document.getElementById('incons-endereco-sugerido').innerText;
    if (!sugo) return;

    var logradouro = '';
    var numero = '';
    var bairro = '';
    var cidade = '';
    var uf = '';

    var endStr = sugo.trim();

    var matchUf = endStr.match(/\s*[-,]\s*([A-Z]{2})\s*$/i);
    if (matchUf) {
      uf = matchUf[1].toUpperCase();
      endStr = endStr.substring(0, endStr.length - matchUf[0].length).trim();
    }

    endStr = endStr.replace(/\s*[-,]\s*\d{5}-?\d{3}\s*$/g, '').trim();
    endStr = endStr.replace(/\s*[-,]\s*Brasil\s*$/i, '').trim();

    var partes = endStr.split(',').map(function (s) { return s.trim(); }).filter(function (s) { return s.length > 0; });

    if (partes.length >= 1) {
      var matchNum = partes[0].match(/^(.+?)\s+(\d+[A-Za-z]?)\s*$/);
      if (matchNum) {
        logradouro = matchNum[1].trim();
        numero = matchNum[2].trim();
      } else {
        logradouro = partes[0];
      }
    }

    if (partes.length >= 2) {
      var p1 = partes[1];
      if (/^\d/.test(p1) && !numero) {
        var numBairro = p1.split(/\s*-\s*/);
        numero = numBairro[0].trim();
        if (numBairro.length >= 2) bairro = numBairro.slice(1).join(' - ').trim();
      } else {
        var bParts = p1.split(/\s*-\s*/);
        if (bParts.length >= 2 && !numero) {
          bairro = bParts[0].trim();
          cidade = bParts.slice(1).join(' - ').trim();
        } else {
          bairro = p1;
        }
      }
    }

    if (partes.length >= 3 && !cidade) {
      cidade = partes[2].split(/\s*-\s*/)[0].trim();
    }

    if (logradouro) document.getElementById('incons-logradouro').value = logradouro;
    if (numero) document.getElementById('incons-numero').value = numero;
    if (bairro) document.getElementById('incons-bairro').value = bairro;
    if (cidade) document.getElementById('incons-cidade').value = cidade;
    if (uf) document.getElementById('incons-uf').value = uf;

    if (window.showToast) window.showToast("Campos atualizados com o endereço sugerido!", "success");
  };

  window.salvarInconsistenciaAcao = function () {
    var mandado = document.getElementById('incons-mandado').value;
    var rua = document.getElementById('incons-logradouro').value.trim();
    var num = document.getElementById('incons-numero').value.trim();
    var bai = document.getElementById('incons-bairro').value.trim();
    var cid = document.getElementById('incons-cidade').value.trim();
    var uf = document.getElementById('incons-uf').value.trim();

    var lat = document.getElementById('incons-lat').value.trim();
    var lng = document.getElementById('incons-lng').value.trim();

    if (!mandado) {
      if (typeof chamarAlertaTatico === 'function') chamarAlertaTatico("Aviso", "Nenhum mandado selecionado.", "OK");
      return;
    }

    if (!rua || !cid) {
      if (typeof chamarAlertaTatico === 'function') chamarAlertaTatico("Campo Obrigatório", "Logradouro e Cidade são obrigatórios para salvar.", "OK");
      return;
    }

    var enderecoFinal = rua;
    if (num) enderecoFinal += ", " + num;
    if (bai) enderecoFinal += ", " + bai;
    enderecoFinal += " - " + cid;
    if (uf) enderecoFinal += " - " + uf;

    if (!lat || !lng) {
      if (window.showToast) window.showToast("Buscando coordenadas automáticas via Google para salvar...", "info");

      google.script.run
        .withSuccessHandler(function (res) {
          if (res && res.lat && res.lng) {
            document.getElementById('incons-lat').value = res.lat;
            document.getElementById('incons-lng').value = res.lng;
            salvarInconsistenciaAcao();
          } else {
            if (typeof chamarAlertaTatico === 'function') chamarAlertaTatico("Geocodificação Pendente", "Não foi possível obter coordenadas para este endereço. Ajuste manualmente o pino ou o texto antes de salvar.", "OK");
          }
        })
        .withFailureHandler(function (err) {
          if (typeof chamarAlertaTatico === 'function') chamarAlertaTatico("Erro", "Falha na busca automática: " + err.message, "OK");
        })
        .geocodificarHibrido(enderecoFinal, "Google", mandado);
      return;
    }

    var dIncons = window.dadosInconsistenciasCache ? window.dadosInconsistenciasCache.find(function (item) { return item.mandado === mandado; }) : null;

    var payload = {
      mandado: mandado,
      enderecoFormatado: enderecoFinal,
      cidade: cid,
      lat: lat ? parseFloat(lat) : "",
      lng: lng ? parseFloat(lng) : "",
      tipoEndereco: dIncons ? dIncons.tipoEndereco : 'Principal',
      secIndex: dIncons ? dIncons.secIndex : undefined
    };

    if (window.showToast) window.showToast("Salvando e processando áreas...", "info");

    google.script.run
      .withSuccessHandler(function (res) {
        if (res.sucesso) {
          if (window.showToast) window.showToast(res.mensagem, "success");
          fecharSidebarInconsistencias();
          carregarInconsistenciasUI();
          if (typeof atualizarCacheERenderizar === 'function') atualizarCacheERenderizar("Dados de mandados atualizados no painel principal.");
        } else {
          if (typeof chamarAlertaTatico === 'function') chamarAlertaTatico("Erro", res.mensagem, "OK");
        }
      })
      .salvarInconsistencia(payload);
  };

  window.excluirInconsistenciaAcao = function () {
    var mandado = document.getElementById('incons-mandado').value;
    if (!mandado) {
      if (window.showToast) window.showToast("Nenhum mandado selecionado.", "error");
      return;
    }

    var dIncons = window.dadosInconsistenciasCache ? window.dadosInconsistenciasCache.find(function (item) { return item.mandado === mandado; }) : null;

    var payload = {
      mandado: mandado,
      tipoEndereco: dIncons ? dIncons.tipoEndereco : 'Principal',
      secIndex: dIncons ? dIncons.secIndex : undefined
    };

    if (typeof chamarAlertaTatico === 'function') {
      chamarAlertaTatico("CONFIRMAR EXCLUSÃO", "Deseja EXCLUIR este endereço do banco de dados?\n\n(O mandado permanecerá no sistema, apenas o endereço incorreto será apagado).", "CONFIRMAR", function (confirma) {
        if (confirma) {
          if (window.showToast) window.showToast("Apagando endereço do banco de dados...", "info");

          // Remoção instantânea da tabela
          if (Array.isArray(window.dadosInconsistenciasCache)) {
            window.dadosInconsistenciasCache = window.dadosInconsistenciasCache.filter(function (item) {
              if (payload.tipoEndereco === 'Secundário' && payload.secIndex !== undefined) {
                return !(item.mandado === mandado && item.tipoEndereco === 'Secundário' && item.secIndex === payload.secIndex);
              }
              return !(item.mandado === mandado && item.tipoEndereco === 'Principal');
            });
            renderizarInconsistenciasTabela(window.dadosInconsistenciasCache);
          }

          google.script.run
            .withSuccessHandler(function (res) {
              if (res && res.sucesso) {
                if (window.showToast) window.showToast(res.mensagem || "Endereço excluído do banco.", "success");
                fecharSidebarInconsistencias();
                carregarInconsistenciasUI();
                if (typeof atualizarCacheERenderizar === 'function') atualizarCacheERenderizar("Endereço removido.");
              } else {
                if (typeof chamarAlertaTatico === 'function') chamarAlertaTatico("Erro ao Excluir", (res ? res.mensagem : "Falha ao excluir"), "OK");
              }
            })
            .withFailureHandler(function (err) {
              if (typeof chamarAlertaTatico === 'function') chamarAlertaTatico("Erro", "Falha de conexão: " + err.message, "OK");
            })
            .excluirInconsistencia(payload);
        }
      });
    }
  };

  window.descartarInconsistenciaAcao = function () {
    var mandado = document.getElementById('incons-mandado').value;
    if (typeof chamarAlertaTatico === 'function') {
      chamarAlertaTatico("CONFIRMAR DESCARTAR", "Deseja marcar este endereço como INVIÁVEL? Ele será removido da fila de correções e o pino não existirá.", "CONFIRMAR", function (confirma) {
        if (confirma) {
          if (window.showToast) window.showToast("Descartando...", "info");
          google.script.run
            .withSuccessHandler(function (res) {
              if (res.sucesso) {
                if (window.showToast) window.showToast("Marcado como Mapeamento Inviável.", "success");
                fecharSidebarInconsistencias();
                carregarInconsistenciasUI();
                if (typeof atualizarCacheERenderizar === 'function') atualizarCacheERenderizar("Mandado removido do mapa.");
              }
            })
            .descartarInconsistencia(mandado);
        }
      });
    }
  };

  /* ================================================================
     MÓDULO DE NAVEGAÇÃO: BOTÃO VOLTAR AO TOPO GLOBAL
     ================================================================ */
  (function initVoltarAoTopoGlobal() {
    function handleGlobalScroll(e) {
      var btn = document.getElementById('btnVoltarAoTopoGlobal');
      if (!btn) return;

      var el = e.target;
      var st = 0;

      if (el === document || el === window || !el) {
        st = window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
      } else if (typeof el.scrollTop === 'number') {
        st = el.scrollTop;
      }

      if (st > 180) {
        btn.style.display = 'flex';
        requestAnimationFrame(function() {
          btn.style.opacity = '1';
          btn.style.transform = 'translateY(0)';
        });
        btn._activeScrollTarget = el;
      } else if (btn._activeScrollTarget === el || st <= 50) {
        btn.style.opacity = '0';
        btn.style.transform = 'translateY(12px)';
        setTimeout(function() {
          if (btn.style.opacity === '0') btn.style.display = 'none';
        }, 300);
      }
    }

    document.addEventListener('scroll', handleGlobalScroll, true);

    window.voltarAoTopoGlobal = function() {
      var btn = document.getElementById('btnVoltarAoTopoGlobal');

      if (btn && btn._activeScrollTarget && typeof btn._activeScrollTarget.scrollTo === 'function') {
        try {
          btn._activeScrollTarget.scrollTo({ top: 0, behavior: 'smooth' });
        } catch (err) {
          btn._activeScrollTarget.scrollTop = 0;
        }
      }

      window.scrollTo({ top: 0, behavior: 'smooth' });

      var containersViews = document.querySelectorAll(
        '#view-lista, #view-leis, #view-relatorios, #view-ranking, #view-usuarios, ' +
        '#view-erros, #view-inconsistencias, #view-ajustes, #view-conferencia, #view-auditoria, ' +
        '#view-perfil, #containerLeisAgrupadas, .custom-scrollbar'
      );
      containersViews.forEach(function(c) {
        if (c && c.scrollTop > 0) {
          try { c.scrollTo({ top: 0, behavior: 'smooth' }); } catch(e) { c.scrollTop = 0; }
        }
      });
    };
  })();
</script>
