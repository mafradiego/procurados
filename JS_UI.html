<script>
  (function () {
    if (!window._cidadesValidasFront) {
      google.script.run.withSuccessHandler(function (cidades) {
        window._cidadesValidasFront = cidades || [];
        console.log('[Sentinela] Cache de cidades pré-carregado no UI:', window._cidadesValidasFront.length, 'municípios');
      }).withFailureHandler(function () {
        window._cidadesValidasFront = [];
      }).obterCidadesCacheFrontend();
    }
  })();

  function buildRelationalAreaMap() {
    const map = { cpiToBpm: {}, bpmToCia: {}, ciaToDp: {} };

    const normalize = s => (s || '').replace(/\s+/g, '').toUpperCase();

    // Prioridade absoluta: Poligonos territoriais exatos (base do estado)
    if (typeof window.poligonosInstancias !== 'undefined' && window.poligonosInstancias.length > 0) {
      window.poligonosInstancias.forEach(p => {
        const cpi = normalize(p.cpi);
        const bpm = normalize(p.batalhao);
        const cia = normalize(p.cia);
        const dp = normalize(p.delegacia || p.cidade);

        if (cpi && bpm) {
          if (!map.cpiToBpm[cpi]) map.cpiToBpm[cpi] = new Set();
          map.cpiToBpm[cpi].add((p.batalhao || '').trim());
        }
        if (bpm && cia) {
          if (!map.bpmToCia[bpm]) map.bpmToCia[bpm] = new Set();
          map.bpmToCia[bpm].add((p.cia || '').trim());
        }
        if (cia && dp) {
          if (!map.ciaToDp[cia]) map.ciaToDp[cia] = new Set();
          map.ciaToDp[cia].add((p.delegacia || p.cidade || '').trim());
        }
      });
    }

    return map;
  }

  window.verHistoricoObservacoes = function (mandado, btn) {
    if (typeof dadosMandados === "undefined") return;
    let alvo = dadosMandados.find(d => String(d.mandado) === String(mandado));
    if (!alvo) return;

    let histStr = alvo.historicoObservacoes || "[]";
    let hist = [];
    try { hist = JSON.parse(histStr); } catch (e) { }

    if (!Array.isArray(hist) || hist.length === 0) {
      if (window.showToast) window.showToast('Nenhum histórico encontrado', 'error');
      else alert('Nenhum histórico encontrado');
      return;
    }

    // Remove if already exists
    let existing = document.getElementById('historicoCustomModal');
    if (existing) existing.remove();

    let cardsHtml = hist.map(h => `
      <div style="background:var(--bg-surface);padding:14px;border-radius:12px;border:1px solid rgba(255,255,255,0.05);box-shadow:inset 2px 2px 5px rgba(255,255,255,0.02), inset -2px -2px 5px rgba(0,0,0,0.5);">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;border-bottom:1px solid rgba(255,255,255,0.05);padding-bottom:8px;">
          <div style="display:flex;align-items:center;gap:6px;color:var(--brand-blue);font-size:11px;font-weight:bold;">
            <span class="material-symbols-outlined" style="font-size:14px;">event</span> ${h.data || 'Data N/I'}
          </div>
          <div style="display:flex;align-items:center;gap:6px;color:var(--text-secondary);font-size:11px;font-weight:600;">
            <span class="material-symbols-outlined" style="font-size:14px;">person</span> ${h.usuario || 'Usuário N/I'}
          </div>
        </div>
        <div style="font-size:13px;color:white;white-space:pre-wrap;line-height:1.5;">${h.texto || ''}</div>
      </div>
    `).join('');

    let html = `
      <div id="historicoCustomModal" style="position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;background:rgba(15,15,25,0.9);backdrop-filter:blur(8px);z-index:9999999;display:flex;justify-content:center;align-items:center;padding:16px;opacity:0;transition:opacity 0.25s ease;">
        <div class="neu-card" style="width:100%;max-width:550px;max-height:85vh;display:flex;flex-direction:column;border-radius:16px;overflow:hidden;transform:scale(0.95);transition:transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);padding:0;background:var(--bg-panel);">
          
          <div style="padding:16px 24px;background:var(--bg-depressed);border-bottom:1px solid rgba(255,255,255,0.05);display:flex;justify-content:space-between;align-items:center;">
            <div style="display:flex;align-items:center;gap:10px;">
              <span class="material-symbols-outlined" style="color:var(--brand-blue);font-size:24px;">history</span>
              <h3 style="margin:0;font-size:16px;font-weight:900;color:white;letter-spacing:1px;">HISTÓRICO DE OBSERVAÇÕES</h3>
            </div>
            <button onclick="this.closest('#historicoCustomModal').remove()" class="modal-close-btn" style="background:transparent;border:none;color:var(--text-secondary);cursor:pointer;padding:4px;display:flex;align-items:center;justify-content:center;"><span class="material-symbols-outlined">close</span></button>
          </div>

          <div class="custom-scrollbar" style="flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:14px;background:var(--bg-panel);">
            ${cardsHtml}
          </div>

          <div style="padding:16px 24px;background:var(--bg-depressed);border-top:1px solid rgba(255,255,255,0.05);text-align:right;">
            <button onclick="this.closest('#historicoCustomModal').remove()" class="neu-btn" style="padding:12px 28px;font-weight:800;color:white;font-size:12px;background:var(--accent);border:none;letter-spacing:0.5px;">FECHAR HISTÓRICO</button>
          </div>

        </div>
      </div>
    `;

    document.body.insertAdjacentHTML('beforeend', html);
    setTimeout(() => {
      let m = document.getElementById('historicoCustomModal');
      if (m) {
        m.style.opacity = '1';
        m.children[0].style.transform = 'scale(1)';
      }
    }, 10);
  };

  window.copiarTexto = function (texto, btn) {
    if (!texto) return;
    navigator.clipboard.writeText(texto).then(() => {
      console.log('Copiado: ' + texto);
      if (btn) {
        let span = btn.querySelector('.material-symbols-outlined');
        if (span) {
          let oldIcon = span.innerText;
          let oldColor = span.style.color;
          span.innerText = 'check';
          span.style.color = '#22c55e'; // Tailwind green-500
          setTimeout(() => {
            span.innerText = oldIcon;
            span.style.color = oldColor;
          }, 2000);
        }
      }
    }).catch(err => {
      console.error('Erro ao copiar: ', err);
      prompt('Copie o texto abaixo:', texto);
    });
  };

  window.toggleRevisadoMandado = function (mandadoId, isChecked, inputEl) {
    let alvo = (window.dadosMandados || []).find(f => String(f.idLinha) === String(mandadoId) || String(f.mandado) === String(mandadoId));
    let nomeUser = (window.usuarioAtual ? (window.usuarioAtual.nome || window.usuarioAtual.email) : 'Admin');
    if (alvo) {
      let obj = {};
      try { obj = JSON.parse(alvo.dadosExtrasJSON || '{}'); } catch (e) { }
      obj.revisado = !!isChecked;
      obj.revisadoPor = nomeUser;
      obj.dataRevisado = new Date().toLocaleString('pt-BR');
      alvo.dadosExtrasJSON = JSON.stringify(obj);
      alvo.revisado = !!isChecked;
      alvo.revisadoPor = nomeUser;

      // Atualizar cache no localStorage
      try {
        let cacheStr = localStorage.getItem('sentinela_mandados_cache');
        if (cacheStr) {
          let cData = JSON.parse(cacheStr);
          if (cData && Array.isArray(cData.dados)) {
            let cAlvo = cData.dados.find(f => String(f.idLinha) === String(mandadoId) || String(f.mandado) === String(mandadoId));
            if (cAlvo) {
              cAlvo.dadosExtrasJSON = alvo.dadosExtrasJSON;
              cAlvo.revisado = !!isChecked;
              cAlvo.revisadoPor = nomeUser;
            }
            localStorage.setItem('sentinela_mandados_cache', JSON.stringify(cData));
          }
        }
      } catch (eCache) { }

      // Sincronia instantânea no Firebase Realtime Database
      if (window.firebaseState && window.firebaseState.db) {
        try {
          var numMand = alvo.mandado || mandadoId;
          var chaveFb = String(numMand).replace(/[.#$\[\]]/g, '_');
          if (chaveFb) {
            window.firebaseState.db.ref('mandados/' + chaveFb).update({
              dadosExtrasJSON: alvo.dadosExtrasJSON,
              revisado: !!isChecked,
              revisadoPor: nomeUser,
              dataRevisado: obj.dataRevisado
            });
            window.firebaseState.db.ref('metadata/lastUpdate').set(new Date().getTime());
          }
        } catch (eFbDirect) {
          console.warn('[Firebase Direct] Erro:', eFbDirect);
        }
      }
    }

    let card = inputEl ? inputEl.closest('.accordion-item') : null;
    let toggles = card ? card.querySelectorAll('.toggle-revisado-container') : document.querySelectorAll('.toggle-revisado-container');
    toggles.forEach(container => {
      let input = container.querySelector('input[type="checkbox"]');
      let textEl = container.querySelector('.toggle-revisado-text');
      if (input && input !== inputEl) input.checked = isChecked;
      if (isChecked) {
        container.classList.add('is-checked');
        container.title = 'Revisado por ' + nomeUser;
        if (textEl) textEl.textContent = 'REVISADO';
      } else {
        container.classList.remove('is-checked');
        container.title = 'Marcar como revisado';
        if (textEl) textEl.textContent = 'REVISAR';
      }
    });

    if (window.showToast) {
      window.showToast(isChecked ? 'Mandado marcado como REVISADO!' : 'Marcação de REVISADO removida.', isChecked ? 'success' : 'info');
    }

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function (res) {
          console.log('[REVISADO] Atualizado:', res);
        })
        .withFailureHandler(function (err) {
          console.error('[REVISADO] Falha no backend:', err);
        })
        .alternarRevisadoMandado(mandadoId, isChecked);
    }
  };

  // ---- SIDEBAR TOGGLE ----
  function toggleSidebar() {
    if (window.innerWidth >= 768) {
      document.body.classList.toggle('desktop-open');
      setTimeout(() => { if (mapaPrincipal) google.maps.event.trigger(mapaPrincipal, 'resize'); }, 350);
    } else {
      document.body.classList.toggle('mobile-open');
      const backdrop = document.getElementById('drawerBackdrop');
      if (document.body.classList.contains('mobile-open')) {
        backdrop.style.display = 'block';
        setTimeout(() => backdrop.style.opacity = '1', 10);
      } else {
        backdrop.style.opacity = '0';
        setTimeout(() => backdrop.style.display = 'none', 300);
      }
    }
  }

  // ---- BUSCA MOBILE ----
  function toggleMobileSearch() {
    const overlay = document.getElementById('mobileSearchOverlay');
    if (overlay.style.display === 'none' || !overlay.style.display) {
      overlay.style.display = 'flex';
      setTimeout(() => overlay.style.transform = 'translateY(0)', 10);
    } else {
      overlay.style.transform = 'translateY(-100%)';
      setTimeout(() => overlay.style.display = 'none', 300);
    }
  }

  function onInputBuscaMobile(inputEl) {
    const btnClear = document.getElementById('btnLimparBuscaMobile');
    if (btnClear) {
      btnClear.style.display = (inputEl && inputEl.value.trim().length > 0) ? 'flex' : 'none';
    }
    filtrarNoMapaMobile(350);
  }

  function limparBuscaMobile() {
    const inputEl = document.getElementById('filtroNomeMobile');
    const btnClear = document.getElementById('btnLimparBuscaMobile');
    if (inputEl) inputEl.value = '';
    if (btnClear) btnClear.style.display = 'none';
    const elFiltroNome = document.getElementById('filtroNome');
    if (elFiltroNome) elFiltroNome.value = '';
    filtrarNoMapaMobile(0);
  }

  // ---- MODAL DE FILTROS AVANÇADOS ----
  function abrirModalFiltrosMobile() {
    const modal = document.getElementById('modalFiltrosMobile');
    const panel = document.getElementById('modalFiltrosMobilePanel');
    if (!modal) return;
    // Esconder botão Importar PDF no mobile quando o modal abre
    const btnImportar = document.querySelector('.btn-importar-pdf-desktop');
    if (btnImportar && window.innerWidth < 768) btnImportar.style.display = 'none';
    // Popular selects dinâmicos ao abrir
    popularCPIsCPMsMobile();
    popularBatalhoesSelect();
    popularCrimesDosBancos();
    popularCIAsMobile();
    if (typeof popularTiposMandadoSelect === 'function') popularTiposMandadoSelect();
    modal.style.display = 'block';
    document.body.style.overflow = 'hidden';
    requestAnimationFrame(() => {
      if (panel) panel.style.transform = 'translateY(0)';
    });
  }

  function fecharModalFiltrosMobile() {
    const modal = document.getElementById('modalFiltrosMobile');
    const panel = document.getElementById('modalFiltrosMobilePanel');
    if (!modal) return;
    // Restaurar botão Importar PDF se necessário
    const btnImportar = document.querySelector('.btn-importar-pdf-desktop');
    if (btnImportar && window.innerWidth < 768) btnImportar.style.display = '';

    if (panel) panel.style.transform = 'translateY(100%)';
    setTimeout(() => {
      modal.style.display = 'none';
      document.body.style.overflow = '';
      if (panel) panel.style.transform = '';
    }, 320);
    // Fechar dropdown do batalhão se estiver aberto
    const dd = document.getElementById('dropdownBatalhao');
    if (dd) dd.style.display = 'none';
  }

  function fecharModalFiltrosMobileSeClicouFora(event) {
    if (event.target === document.getElementById('modalFiltrosMobile')) {
      fecharModalFiltrosMobile();
    }
  }

  // Mutual exclusion: ao selecionar um CPI específico, desabilita CPM
  function onChangeCPI() {
    const elCPI = document.getElementById('filtroCPIMobile');
    const elCPM = document.getElementById('filtroCPMMobile');
    if (!elCPI || !elCPM) return;
    if (elCPI.value !== 'TODOS') {
      elCPM.value = 'TODOS';
      elCPM.disabled = true;
      elCPM.style.opacity = '0.4';
    } else {
      elCPM.disabled = false;
      elCPM.style.opacity = '1';
    }
  }

  // Mutual exclusion: ao selecionar um CPM específico, desabilita CPI
  function onChangeCPM() {
    const elCPI = document.getElementById('filtroCPIMobile');
    const elCPM = document.getElementById('filtroCPMMobile');
    if (!elCPI || !elCPM) return;
    if (elCPM.value !== 'TODOS') {
      elCPI.value = 'TODOS';
      elCPI.disabled = true;
      elCPI.style.opacity = '0.4';
    } else {
      elCPI.disabled = false;
      elCPI.style.opacity = '1';
    }
  }

  // Popular CPI e CPM/CPAM em select íºnico com optgroups
  function popularCPIsCPMsMobile() {
    if (!window.dadosMandados) return;
    const selectCPI = document.getElementById('filtroCPIMobile');
    if (!selectCPI) return;

    const cpisSet = new Set();
    const cpmsSet = new Set();

    const fonte = (typeof poligonosInstancias !== 'undefined' && poligonosInstancias.length > 0)
      ? poligonosInstancias
      : dadosMandados;

    fonte.forEach(function (d) {
      let cpi = (d.cpi || d.cpiArea || '').trim();
      if (!cpi) return;
      cpi = cpi.replace(/^CPM-/i, '').replace(/CPM-CPA/gi, 'CPA');
      if (/CPA|CPAM|METROPOLITAN/i.test(cpi)) cpmsSet.add(cpi);
      else cpisSet.add(cpi);
    });

    const sortCpiLocal = (a, b) => {
      const isCpaA = /CPA/i.test(a);
      const isCpaB = /CPA/i.test(b);
      if (isCpaA !== isCpaB) return isCpaA ? 1 : -1;

    const valAtualMobile = selectMobile ? selectMobile.value : 'TODOS';

    const isMobile = (window.innerWidth < 768) || (document.getElementById('modalFiltrosMobile') && document.getElementById('modalFiltrosMobile').style.display !== 'none');

    const selectCPI = isMobile ? (document.getElementById('filtroCPIMobile') || document.getElementById('filtroCPI')) : (document.getElementById('filtroCPI') || document.getElementById('filtroCPIMobile'));
    const cpiSelecionado = selectCPI ? selectCPI.value : 'TODOS';
    const selectBatalhao = isMobile ? (document.getElementById('filtroBatalhaoMobile') || document.getElementById('filtroBatalhao')) : (document.getElementById('filtroBatalhao') || document.getElementById('filtroBatalhaoMobile'));

    const ciaSelecionada = selectCIA ? selectCIA.value : 'TODOS';
    const selectDP = isMobile ? (document.getElementById('filtroDPMobile') || document.getElementById('filtroDP')) : (document.getElementById('filtroDP') || document.getElementById('filtroDPMobile'));
    const dpSelecionada = selectDP ? selectDP.value : 'TODOS';

    const crimesSet = new Set();

    if (window.dadosMandados && typeof classificarCrime === 'function') {
      const normCPI = (typeof normalizarArea === 'function' && cpiSelecionado !== 'TODOS') ? normalizarArea(cpiSelecionado) : '';
      const normBTL = (typeof normalizarArea === 'function' && batSelecionado !== 'TODOS') ? normalizarArea(batSelecionado) : '';
      const normCIA = (typeof normalizarArea === 'function' && ciaSelecionada !== 'TODOS') ? normalizarArea(ciaSelecionada) : '';
      const normDP = (typeof normalizarArea === 'function' && dpSelecionada !== 'TODOS') ? normalizarArea(dpSelecionada) : '';

      const temFiltroArea = normCPI || normBTL || normCIA || normDP;

      dadosMandados.forEach(function (d) {
        if (d.status === 'Procurado' && !d.semEndereco) {
          if (temFiltroArea) {
            let emArea = false;

            // 1. Checar endereço principal
            let aCPI = normalizarArea(d.cpiArea || d.cpi || '');
            let aBTL = normalizarArea(d.bpmArea || d.batalhao || '');
            let aCIA = normalizarArea(d.ciaArea || d.cia || '');
            let aDP = normalizarArea(d.dpArea || d.delegacia || '');

            let matchP_CPI = (!normCPI || aCPI === normCPI || aCPI.indexOf(normCPI) !== -1 || normCPI.indexOf(aCPI) !== -1);
            let matchP_BTL = (!normBTL || aBTL === normBTL || aBTL.indexOf(normBTL) !== -1 || normBTL.indexOf(aBTL) !== -1);
            let matchP_CIA = (!normCIA || aCIA === normCIA || aCIA.indexOf(normCIA) !== -1 || normCIA.indexOf(aCIA) !== -1);
            let matchP_DP = (!normDP || aDP === normDP || aDP.indexOf(normDP) !== -1 || normDP.indexOf(aDP) !== -1);

            if (matchP_CPI && matchP_BTL && matchP_CIA && matchP_DP) {
              emArea = true;
            }

            // 2. Checar endereços secundários se o principal não casou
            if (!emArea) {
              try {
                let rawSecFiltro = d.geodataSecundarios || d.secundarios || [];
                let listaSec = Array.isArray(rawSecFiltro) ? rawSecFiltro : (typeof rawSecFiltro === 'string' ? (function() { try { return JSON.parse(rawSecFiltro); } catch(e) { return []; } })() : []);
                for (let i = 0; i < listaSec.length; i++) {
                  let sec = listaSec[i];
                  let sCPI = normalizarArea(sec.cpi || '');
                  let sBTL = normalizarArea(sec.batalhao || '');
                  let sCIA = normalizarArea(sec.cia || '');
                  let sDP = normalizarArea(sec.delegacia || sec.dpArea || '');

                  let matchS_CPI = (!normCPI || sCPI === normCPI || sCPI.indexOf(normCPI) !== -1 || normCPI.indexOf(sCPI) !== -1);
                  let matchS_BTL = (!normBTL || sBTL === normBTL || sBTL.indexOf(normBTL) !== -1 || normBTL.indexOf(sBTL) !== -1);
                  let matchS_CIA = (!normCIA || sCIA === normCIA || sCIA.indexOf(normCIA) !== -1 || normCIA.indexOf(sCIA) !== -1);
                  let matchS_DP = (!normDP || sDP === normDP || sDP.indexOf(normDP) !== -1 || normDP.indexOf(sDP) !== -1);

                  if (matchS_CPI && matchS_BTL && matchS_CIA && matchS_DP) {
                    emArea = true;
                    break;
                  }
                }
              } catch (eSec) { }
            }

            if (!emArea) return;
          }

          const crInfo = classificarCrime(d.infoProcessuais || '');
          if (crInfo) {
            if (crInfo.nome && crInfo.nome !== 'Outros') crimesSet.add(crInfo.nome);
            if (crInfo.todosCrimes) {
              crInfo.todosCrimes.forEach(c => {
                if (c.nome && c.nome !== 'Outros') crimesSet.add(c.nome);
              });
            }
          }
        }
      });
    }

    const ordenados = [...crimesSet].sort(function (a, b) { return a.localeCompare(b); });

    const popularSelect = (sel, valAtual) => {
      if (!sel) return;
      sel.innerHTML = '<option value="TODOS">Todos os crimes</option>';

      if ([...sel.options].some(o => o.value === valAtual)) sel.value = valAtual;

  function extrairInfo(infoProc, label) {
    if (!infoProc) return null;
    const regex = new RegExp(label + '\\s*([^|\\n]+)', 'i');
    const match = infoProc.match(regex);
    if (match) {
      const val = match[1].trim();
      if (!["", "-", "N/A", "NÃO INFORMADO"].includes(val.toUpperCase())) return val;
    }
    return null;
  }

      const termoBusca = (document.getElementById('filtroNomeMobile') || {}).value || '';

        if (elMobile && elDesktop) elDesktop.value = elMobile.value;
      };

      // Select unificado CPI/CPM: sincroniza diretamente para o filtroCPI do desktop
      const elCPIUnif = document.getElementById('filtroCPIMobile');
      const valUnif = elCPIUnif ? elCPIUnif.value : 'TODOS';
      const elDesktopCPI = document.getElementById('filtroCPI');

      syncFiltro('filtroCrimeMobile', 'filtroCrime');
      syncFiltro('filtroSexoMobile', 'filtroSexo');
      syncFiltro('filtroTipoMandadoMobile', 'filtroTipoMandado');

  function aplicarBounceNoMarcador(m) {
    if (!m) return;
    try {
      // Marcador clássico Google Maps API
      if (typeof m.setAnimation === 'function' && typeof google !== 'undefined' && google.maps && google.maps.Animation) {
        m.setAnimation(google.maps.Animation.BOUNCE);
        setTimeout(function () {
          try { m.setAnimation(null); } catch (e) { }
        }, 3200);
      }

      // AdvancedMarkerElement (DOM Content)
      let elContent = m.content || m.element || m._element;
      if (elContent) {
        let targets = [];
        if (elContent.classList) targets.push(elContent);
        if (elContent.querySelector) {
          let innerPin = elContent.querySelector('.pin-marker') || elContent.querySelector('svg');
          if (innerPin && innerPin.classList) targets.push(innerPin);
        }

        targets.forEach(t => {
          t.classList.add('pin-bounce-anim');
          t.style.setProperty('animation', 'pin-bounce-keyframe 0.8s ease infinite', 'important');
        });

        setTimeout(function () {
          targets.forEach(t => {
            try { 
              t.classList.remove('pin-bounce-anim'); 
              t.style.removeProperty('animation');
            } catch (e) { }
          });
        }, 3200);
      }
    } catch (e) {
      console.warn('Erro ao aplicar bounce no pino:', e);
    }
  }
  window.aplicarBounceNoMarcador = aplicarBounceNoMarcador;

  function focarNoMapa(mandadoRef, idLinhaRef) {
    if (!mandadoRef && !idLinhaRef) return;
    const mandadoStr = mandadoRef ? String(mandadoRef).trim() : '';
    const idLinhaStr = idLinhaRef ? String(idLinhaRef).trim() : '';

    // 1. Buscar o mandado no dataset global (dadosMandados)
    let alvo = null;
    if (typeof dadosMandados !== 'undefined' && Array.isArray(dadosMandados)) {
      alvo = dadosMandados.find(d => {
        if (!d) return false;
        if (mandadoStr && String(d.mandado).trim() === mandadoStr) return true;
        if (idLinhaStr && String(d.idLinha).trim() === idLinhaStr) return true;
        return false;
      });
    }

    // 2. Verificar se o mandado não tem coordenadas GPS
    let hasCoords = false;
    if (alvo && !alvo.semEndereco) {
      let latVal = Number(alvo.lat);
      let lngVal = Number(alvo.lng);
      if (!isNaN(latVal) && latVal !== 0 && !isNaN(lngVal) && lngVal !== 0) {
        hasCoords = true;
      }
    }

    if (!hasCoords) {
      if (typeof chamarAlertaTatico === 'function') {
        chamarAlertaTatico('MAPA', 'Mandado sem coordenadas GPS cadastradas.', 'OK');
      } else if (window.showToast) {
        window.showToast('Mandado sem coordenadas GPS cadastradas.', 'warning');
      }
      return;
    }

    // 3. Buscar se o pino está instanciado no mapa (listaMarcadores / filtros ativos)
    let marcador = null;
    if (typeof listaMarcadores !== 'undefined' && Array.isArray(listaMarcadores)) {
      marcador = listaMarcadores.find(m => {
        if (!m) return false;
        if (mandadoStr && m._mandadoRef && String(m._mandadoRef).trim() === mandadoStr) return true;
        if (idLinhaStr && m.idLinha && String(m.idLinha).trim() === idLinhaStr) return true;
        if (mandadoStr && m.idLinha && String(m.idLinha).trim() === mandadoStr) return true;
        if (m._alvoRef) {
          if (mandadoStr && m._alvoRef.mandado && String(m._alvoRef.mandado).trim() === mandadoStr) return true;
          if (idLinhaStr && m._alvoRef.idLinha && String(m._alvoRef.idLinha).trim() === idLinhaStr) return true;
        }
        return false;
      });
    }

    if (!marcador) {
      if (typeof chamarAlertaTatico === 'function') {
        chamarAlertaTatico('MAPA', 'Mandado fora dos filtros selecionados no mapa.', 'OK');
      } else if (window.showToast) {
        window.showToast('Mandado fora dos filtros selecionados no mapa.', 'warning');
      }
      return;
    }

    // 4. Somente se tiver coordenadas E o pino estiver ativo no mapa -> Muda para a visão do Mapa
    if (typeof alternarVisaoTatica === 'function') {
      alternarVisaoTatica('mapa');
    } else if (typeof alternarVisaoGlobal === 'function') {
      alternarVisaoGlobal('mapa');
    }

    if (marcador && marcador.position && typeof mapaPrincipal !== 'undefined' && mapaPrincipal) {
      mapaPrincipal.panTo(marcador.position);
      mapaPrincipal.setZoom(17);
      if (typeof aplicarBounceNoMarcador === 'function') aplicarBounceNoMarcador(marcador);
      setTimeout(function () {
        if (typeof google !== 'undefined' && google.maps && google.maps.event) {
          google.maps.event.trigger(marcador, 'click');
        }
      }, 200);
    }
  }

  function focarPinoPorCoordenadas(lat, lng, mandadoRef) {
    let latVal = Number(lat);
    let lngVal = Number(lng);
    if (isNaN(latVal) || latVal === 0 || isNaN(lngVal) || lngVal === 0) {
      if (typeof chamarAlertaTatico === 'function') chamarAlertaTatico('MAPA', 'Coordenadas inválidas para este endereço.', 'OK');
      return;
    }

    // 1. Fechar modals de card
    if (typeof fecharMobileCardModal === 'function') fecharMobileCardModal();
    if (typeof fecharCardModal === 'function') fecharCardModal();

    // 2. Alternar para a visão do Mapa
    if (typeof alternarVisaoTatica === 'function') {
      alternarVisaoTatica('mapa');
    } else if (typeof alternarVisaoGlobal === 'function') {
      alternarVisaoGlobal('mapa');
    }

    // 3. Centralizar o mapa nas coordenadas exatas e aplicar zoom aproximado
    if (typeof mapaPrincipal !== 'undefined' && mapaPrincipal) {
      mapaPrincipal.panTo({ lat: latVal, lng: lngVal });
      mapaPrincipal.setZoom(17);
    }

    // 4. Localizar o marcador (principal ou secundário) e aplicar a animação de bounce simples
    setTimeout(function () {
      let targetMarker = null;

      // Buscar na lista de marcadores principais
      if (typeof listaMarcadores !== 'undefined' && Array.isArray(listaMarcadores)) {
        targetMarker = listaMarcadores.find(m => {
          if (!m || !m.position) return false;
          let mLat = Number(typeof m.position.lat === 'function' ? m.position.lat() : m.position.lat);
          let mLng = Number(typeof m.position.lng === 'function' ? m.position.lng() : m.position.lng);
          return Math.abs(mLat - latVal) < 0.0001 && Math.abs(mLng - lngVal) < 0.0001;
        });
      }

      // Se não encontrou no principal, buscar na teia de marcadores secundários visíveis
      if (!targetMarker && typeof secundariosVisiveis !== 'undefined' && secundariosVisiveis) {
        for (let k in secundariosVisiveis) {
          let secGroup = secundariosVisiveis[k];
          if (secGroup && Array.isArray(secGroup.markers)) {
            let foundSec = secGroup.markers.find(m => {
              if (!m || !m.position) return false;
              let mLat = Number(typeof m.position.lat === 'function' ? m.position.lat() : m.position.lat);
              let mLng = Number(typeof m.position.lng === 'function' ? m.position.lng() : m.position.lng);
              return Math.abs(mLat - latVal) < 0.0001 && Math.abs(mLng - lngVal) < 0.0001;
            });
            if (foundSec) { targetMarker = foundSec; break; }
          }
        }
      }

      if (targetMarker && typeof aplicarBounceNoMarcador === 'function') {
        aplicarBounceNoMarcador(targetMarker);
      }
    }, 250);
  }

  function atualizarContadores(dadosBase) {
    var elTotal = document.getElementById('cntTotal');
    if (!elTotal) return;

    var base = (dadosBase || window.dadosMandados || []).filter(function (d) { return !d._isSecundarioClone; });

    let total = base.length;
    let procurados = 0;
    let capturados = 0;
    let semEndereco = 0;

    base.forEach(function (d) {
      let st = (d.status || 'Procurado').trim().toUpperCase();
      if (st === 'CAPTURADO') {
        capturados++;
      } else {
        procurados++;
      }

      // Verificação rigorosa de Sem Endereço
      let sEnd = d.semEndereco;
      if (sEnd === undefined || sEnd === null) {
        let latNum = Number(d.lat);
        let lngNum = Number(d.lng);
        sEnd = (isNaN(latNum) || latNum === 0 || isNaN(lngNum) || lngNum === 0 || !d.lat || !d.lng);
      }
      if (sEnd) {
        semEndereco++;
      }
    });

    document.getElementById('cntTotal').textContent = total;
    document.getElementById('cntProcurados').textContent = procurados;
    document.getElementById('cntCapturados').textContent = capturados;
    document.getElementById('cntSemEndereco').textContent = semEndereco;
  }
  window.atualizarContadores = atualizarContadores;

  // ========== FILTROS DA LISTA ==========
  function aplicarFiltrosLista() {
    var buscaRapida = document.getElementById('buscaRapidaLista');
    var termo = (buscaRapida ? buscaRapida.value : '').toLowerCase();
    var filtroStatus = document.getElementById('filtroStatusLista');
    var statusVal = filtroStatus ? filtroStatus.value : 'Procurado';
    var ordenacao = document.getElementById('ordenacaoLista');
    var ordemVal = ordenacao ? ordenacao.value : 'RECENTES';

    var valCPI = document.getElementById('filtroListaCPI') ? document.getElementById('filtroListaCPI').value : 'TODOS';
    var valBTL = document.getElementById('filtroListaBatalhao') ? document.getElementById('filtroListaBatalhao').value : 'TODOS';
    var valCIA = document.getElementById('filtroListaCIA') ? document.getElementById('filtroListaCIA').value : 'TODOS';
    var valCrime = document.getElementById('filtroListaCrime') ? document.getElementById('filtroListaCrime').value : 'TODOS';

    var statusValNorm = (statusVal || 'Procurado').trim().toUpperCase();

    // 1. Base filtrada por Região/Crime/Busca (sem filtrar por status para os contadores reais)
    var baseParaContadores = dadosMandados.filter(function (d) {
      if (d._isSecundarioClone) return false;

      if (valCPI !== 'TODOS') {
        let cpiMandado = d.cpiArea || d.cpi || '';
        if (cpiMandado !== valCPI) return false;
      }
      if (valBTL !== 'TODOS') {
        let btlMandado = d.batalhao || d.bpmArea || d.batalhaoArea || '';
        if (btlMandado !== valBTL) return false;
      }
      if (valCIA !== 'TODOS') {
        let ciaMandado = d.ciaArea || d.cia || '';
        if (ciaMandado !== valCIA) return false;
      }

      if (valCrime !== 'TODOS') {
        let crimes = typeof window.extrairListaCrimes === 'function' ? window.extrairListaCrimes(d) : [];
        if (!crimes.includes(valCrime)) return false;
      }

      if (!termo) return true;

      var nome = (d.nome || '').toLowerCase();
      var cpf = (d.cpf || '').toLowerCase();
      var alcunha = '';
      if (d.extras && d.extras.alcunha) alcunha = d.extras.alcunha.toLowerCase();
      else if (d.alcunha) alcunha = d.alcunha.toLowerCase();
      var mandado = (d.mandado || '').toLowerCase();
      var infoProc = (d.infoProcessuais || '').toLowerCase();

      let crimeMatchLista = false;
      if (typeof classificarCrime === 'function') {
        const crInfo = classificarCrime(d.infoProcessuais || '');
        if (crInfo) {
          if (crInfo.nome && crInfo.nome.toLowerCase().includes(termo)) crimeMatchLista = true;
          if (crInfo.artigo && String(crInfo.artigo).toLowerCase().includes(termo)) crimeMatchLista = true;
          if (crInfo.todosCrimes) {
            crInfo.todosCrimes.forEach(function(c) {
              if (c.nome && c.nome.toLowerCase().includes(termo)) crimeMatchLista = true;
              if (c.artigo && String(c.artigo).toLowerCase().includes(termo)) crimeMatchLista = true;
            });
          }
        }
      }

      return nome.includes(termo) || cpf.includes(termo) || alcunha.includes(termo) || mandado.includes(termo) || infoProc.includes(termo) || crimeMatchLista;
    });

    // Atualizar contadores no topo da página
    atualizarContadores(baseParaContadores);

    // 2. Agora filtrar por Status para exibição dos cards na lista
    var filtrados = baseParaContadores.filter(function (d) {
      if (statusValNorm !== 'TODOS') {
        var dStatusNorm = (d.status || 'Procurado').trim().toUpperCase();
        if (dStatusNorm !== statusValNorm) return false;
      }
      return true;
    });

    window.dadosMandadosFiltrados = filtrados;

    // Ordenação
    if (ordemVal === 'NOME') {
      filtrados.sort(function (a, b) {
        let capA = a.status === 'Capturado' ? 1 : 0;
        let capB = b.status === 'Capturado' ? 1 : 0;
        if (capA !== capB) return capA - capB;
        return (a.nome || '').localeCompare(b.nome || '');
      });
    } else if (ordemVal === 'RECENTES_BNMP') {
      // Ordenar pela Data de Emissão do BNMP (extras.emissao) — mais recente primeiro
      filtrados.sort(function (a, b) {
        let capA = a.status === 'Capturado' ? 1 : 0;
        let capB = b.status === 'Capturado' ? 1 : 0;
        if (capA !== capB) return capA - capB;

        // Extrair emissao do dadosExtrasJSON
        function getEmissao(d) {
          try {
            var extras = JSON.parse(d.dadosExtrasJSON || '{}');
            return extras.emissao || '';
          } catch (e) { return ''; }
        }

        // Parsear data (aceita dd/mm/yyyy, dd-mm-yyyy, e texto como "20 de julho de 2026")
        function parseDateBR(str) {
          if (!str || str === 'N/A' || str === '' || str === 'Não consta') return 0;
          str = String(str).trim();
          // dd/mm/yyyy ou dd-mm-yyyy
          var partes = str.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
          if (partes) {
            return new Date(partes[3], partes[2] - 1, partes[1]).getTime() || 0;
          }
          // Texto: "20 de julho de 2026"
          var meses = { janeiro: 0, fevereiro: 1, 'março': 2, marco: 2, abril: 3, maio: 4, junho: 5, julho: 6, agosto: 7, setembro: 8, outubro: 9, novembro: 10, dezembro: 11 };
          var matchText = str.match(/(\d{1,2})\s+de\s+([A-Za-zÀ-ÿ]+)\s+de\s+(\d{4})/i);
          if (matchText) {
            var mesNum = meses[matchText[2].toLowerCase()];
            if (mesNum !== undefined) return new Date(matchText[3], mesNum, matchText[1]).getTime() || 0;
          }
          var t = new Date(str).getTime();
          return isNaN(t) ? 0 : t;
        }

        var dateA = parseDateBR(getEmissao(a));
        var dateB = parseDateBR(getEmissao(b));
        if (dateA !== dateB) return dateB - dateA; // Mais recente primeiro
        return b.idLinha - a.idLinha;
      });
    } else if (ordemVal === 'DISTANCIA') {
      ordenarPorDistanciaERenderizar(filtrados);
      return;
    } else if (ordemVal === 'SEM_ENDERECO') {
      filtrados.sort(function (a, b) {
        let semA = a.semEndereco ? 1 : 0;
        let semB = b.semEndereco ? 1 : 0;
        if (semA !== semB) return semB - semA;
        return b.idLinha - a.idLinha;
      });
    } else if (ordemVal === 'COM_FOTO') {
      filtrados.sort(function (a, b) {
        let capA = a.status === 'Capturado' ? 1 : 0;
        let capB = b.status === 'Capturado' ? 1 : 0;
        if (capA !== capB) return capA - capB;
        
        let hasFotoA = (a.fotoUrl && a.fotoUrl !== "N/A" && a.fotoUrl.startsWith("http")) ? 1 : 0;
        let hasFotoB = (b.fotoUrl && b.fotoUrl !== "N/A" && b.fotoUrl.startsWith("http")) ? 1 : 0;
        
        if (hasFotoA !== hasFotoB) return hasFotoB - hasFotoA;
        return b.idLinha - a.idLinha; // Desempate por mais recentes no sistema
      });
    } else {
      // RECENTES (padrão) — ordenar pela Data de Lançamento no sistema (mais recente primeiro)
      filtrados.sort(function (a, b) {
        let capA = a.status === 'Capturado' ? 1 : 0;
        let capB = b.status === 'Capturado' ? 1 : 0;
        if (capA !== capB) return capA - capB;

        // Parsear data dd/mm/yyyy para timestamp
        function parseDateBR(str) {
          if (!str || str === 'N/A' || str === '' || str === 'Não consta') return 0;
          var partes = String(str).match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
          if (partes) {
            return new Date(partes[3], partes[2] - 1, partes[1]).getTime() || 0;
          }
          var t = new Date(str).getTime();
          return isNaN(t) ? 0 : t;
        }

        var dateA = parseDateBR(a.dataLancamento);
        var dateB = parseDateBR(b.dataLancamento);
        if (dateA !== dateB) return dateB - dateA; // Mais recente primeiro
        return b.idLinha - a.idLinha;
      });
    }

    renderizarTabelaMandados(filtrados);
  }

  // ========== ORDENAÇÃO POR DISTÂNCIA ==========
  function ordenarPorDistanciaERenderizar(dados) {
    if (!navigator.geolocation) {
      chamarAlertaTatico("ERRO GPS", "Seu navegador não suporta geolocalização.", "OK");
      renderizarTabelaMandados(dados);
      document.getElementById('ordenacaoLista').value = "RECENTES";
      return;
    }

    // Mostra loading rápido
    var trackEl = document.getElementById('accordionListTrack') || document.getElementById('tabelaMandados');
    if (trackEl) {
      trackEl.innerHTML = '<div style="padding:32px;text-align:center;color:var(--text-muted);"><span class="material-symbols-outlined" style="font-size:40px;animation:spin 1s linear infinite;">sync</span><p style="font-size:13px;margin-top:8px;">Obtendo localização para calcular rotas...</p></div>';
    }

    navigator.geolocation.getCurrentPosition(function (position) {
      var latAtual = position.coords.latitude;
      var lngAtual = position.coords.longitude;

      dados.forEach(function (d) {
        if (!d.semEndereco && d.lat && d.lng) {
          d._distanciaKm = calcularDistanciaHaversine(latAtual, lngAtual, d.lat, d.lng);
        } else {
          d._distanciaKm = 99999; // Sem endereço fica no fim
        }
      });

      dados.sort(function (a, b) {
        let capA = a.status === 'Capturado' ? 1 : 0;
        let capB = b.status === 'Capturado' ? 1 : 0;
        if (capA !== capB) return capA - capB;
        return a._distanciaKm - b._distanciaKm;
      });
      renderizarTabelaMandados(dados);

    }, function (error) {
      chamarAlertaTatico("ERRO GPS", "Não foi possível obter sua localização. Permita o acesso ao GPS.", "OK");
      renderizarTabelaMandados(dados);
      document.getElementById('ordenacaoLista').value = "RECENTES";
    });
  }

  function calcularDistanciaHaversine(lat1, lon1, lat2, lon2) {
    var R = 6371; // Raio da Terra em km
    var dLat = (lat2 - lat1) * Math.PI / 180;
    var dLon = (lon2 - lon1) * Math.PI / 180;
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
      Math.sin(dLon / 2) * Math.sin(dLon / 2);
    var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return R * c;
  }

  function sortCpi(a, b) {
    let isCpaA = a.includes('CPA');
    let isCpaB = b.includes('CPA');
    if (isCpaA !== isCpaB) return isCpaA ? 1 : -1;
    let numA = parseInt(a.replace(/\D/g, '')) || 0;
    let numB = parseInt(b.replace(/\D/g, '')) || 0;
    if (numA !== numB) return numA - numB;
    return a.localeCompare(b);
  }

  function sortBpm(a, b) {
    let isBpmiA = a.includes('BPM/I');
    let isBpmiB = b.includes('BPM/I');
    if (isBpmiA !== isBpmiB) return isBpmiA ? -1 : 1;
    let numA = parseInt(a.replace(/\D/g, '')) || 0;
    let numB = parseInt(b.replace(/\D/g, '')) || 0;
    if (numA !== numB) return numA - numB;
    return a.localeCompare(b);
  }

      let ciaMandado = d.ciaArea || d.cia || '';

      var matchCIA = ciaSelecionado === 'TODOS' || ciaMandado === ciaSelecionado;
      return matchCPI && matchBTL && matchCIA;

      // Limpar e popular míºltiplos endereços
      var containerEnds = document.getElementById('containerMultiEnderecos');

  async function confirmarImportacaoFila() {
    var checkboxes = document.querySelectorAll('.cb-importar-fila:checked');
    if (checkboxes.length === 0) {
      return chamarAlertaTatico("ATENÇÃO", "Selecione ao menos um mandado na lista para importar.", "OK");
    }

    var indicesParaImportar = Array.from(checkboxes).map(function (cb) { return parseInt(cb.getAttribute('data-index')); });
    var loteFiltrado = filaImportacao.filter(function (item, idx) { return indicesParaImportar.includes(idx); });

    const overlay = document.getElementById('loadingOverlayIA');
    const overlayTitulo = document.getElementById('overlayIATitulo');
    const overlaySub = document.getElementById('overlayIASub');
    const overlayBarra = document.getElementById('overlayIABarra');
    const overlayPercent = document.getElementById('overlayIAPercent');

    if (overlay) {
      overlayTitulo.innerText = "Importando Alvo(s)";
      overlaySub.innerHTML = "Geocodificando endereços...";
      overlayBarra.style.width = "0%";
      overlayPercent.innerText = "0%";
      overlay.style.display = 'flex';
    }

    var btn = document.getElementById('btnConfirmarFila');
    btn.innerText = 'SALVANDO ARQUIVOS...';
    btn.disabled = true;

    var geocoder = null;
    if (typeof google !== 'undefined' && google.maps && google.maps.Geocoder) {
      geocoder = new google.maps.Geocoder();
    }

    // ── FASE 1: GEOCODIFICAÇÃO DE TODOS OS ENDEREÇOS ──
    for (var i = 0; i < loteFiltrado.length; i++) {
      var item = loteFiltrado[i];

      // Atualizar progresso de geocodificação
      if (overlay) {
        var pctGeo = Math.round(((i + 1) / loteFiltrado.length) * 50); // Geocodificação = 0% a 50%
        overlaySub.innerHTML = "Geocodificando: <strong>" + (i + 1) + "</strong> de <strong>" + loteFiltrado.length + "</strong> endereços...";
        overlayBarra.style.width = pctGeo + "%";
        overlayPercent.innerText = pctGeo + "%";
      }

      // v4.9.85: Validação de cidade/UF antes de geocodificar
      var _cidadesCache = window._cidadesValidasFront || [];
      var endInvalidos = [];

      function _removerAcentosFront(t) {
        if (!t) return "";
        return t.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
      }

      function _validarEndCidade(end) {
        if (!end || end.length < 5) return false;
        if (/\b\d{5}-?\d{3}\b/.test(end) || /\bCEP\s*\d+\b/i.test(end)) return true;
        if (_cidadesCache.length === 0) return true;
        var endN = _removerAcentosFront(end);
        for (var ci = 0; ci < _cidadesCache.length; ci++) {
          var cidR = _cidadesCache[ci].municipio.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          if (new RegExp("\\b" + cidR + "\\b", "i").test(endN)) return true;
        }
        return false;
      }

      // Validar endereço principal
      var principalValido = true;
      if (item.enderecoPrincipal && item.enderecoPrincipal !== "Não informado" && item.enderecoPrincipal !== "N/A") {
        if (!_validarEndCidade(item.enderecoPrincipal)) {
          principalValido = false;
          endInvalidos.push("PRINCIPAL: " + item.enderecoPrincipal);
        }
      }

      // Validar endereços secundários
      var secTexts = [];
      if (item.secundariosText) {
        secTexts = item.secundariosText.split('||').map(function (s) { return s.trim(); }).filter(function (s) { return s.length > 3; });
        for (var sv = 0; sv < secTexts.length; sv++) {
          if (!_validarEndCidade(secTexts[sv])) {
            endInvalidos.push("SECUNDÁRIO: " + secTexts[sv]);
          }
        }
      }

      // Adicionar observação de inconsistência se algum endereço falhou
      if (endInvalidos.length > 0) {
        var obsInconsist = "INCONSISTÊNCIA CIDADE: " + endInvalidos.join(" | ");
        item.observacoesExtra = item.observacoesExtra ? item.observacoesExtra + " | " + obsInconsist : obsInconsist;
        console.warn("[VALIDAÇÃO CIDADES] Mandado " + (item.mandado || "?") + " tem inconsistências parciais: " + obsInconsist);
      }

      // Geocodificação do Endereço Principal (se for válido e houver geocoder)
      item.latPrincipal = null;
      item.lngPrincipal = null;
      item.ufPrincipal = "";

      if (principalValido && item.enderecoPrincipal && item.enderecoPrincipal !== "Não informado" && item.enderecoPrincipal !== "N/A") {
        try {
          var method = window.geoMethodSelecionado || 'Hibrido';
          var geoMain = null;
          var progressoStr = " " + (i + 1) + "/" + loteFiltrado.length;

          if (method === 'Google') {
            if (geocoder) geoMain = await geocodeEndereco(geocoder, item.enderecoPrincipal);
            if (!geoMain) {
              btn.innerText = 'GEO Google' + progressoStr;
              geoMain = await new Promise(function (resolve) {
                google.script.run.withSuccessHandler(resolve).withFailureHandler(function () { resolve(null); }).geocodificarHibrido(item.enderecoPrincipal, "Google", item.mandado);
              });
            }
          } else if (method === 'Mapbox') {
            btn.innerText = 'GEO Mapbox' + progressoStr;
            geoMain = await new Promise(function (resolve) {
              google.script.run.withSuccessHandler(function (res) {
                console.log("[MAPBOX ONLY] " + item.enderecoPrincipal + " ->", res);
                resolve(res);
              }).withFailureHandler(function () { resolve(null); }).geocodificarHibrido(item.enderecoPrincipal, "Mapbox", item.mandado);
            });
          } else {
            // Híbrido: Se Google falhar ou não estiver disponível, tenta Híbrido no backend
            if (geocoder) geoMain = await geocodeEndereco(geocoder, item.enderecoPrincipal);
            if (!geoMain) {
              btn.innerText = 'GEO Híbrido' + progressoStr;
              geoMain = await new Promise(function (resolve) {
                google.script.run.withSuccessHandler(function (res) {
                  console.log("[HÍBRIDO BACKEND] " + item.enderecoPrincipal + " ->", res);
                  resolve(res);
                }).withFailureHandler(function () { resolve(null); }).geocodificarHibrido(item.enderecoPrincipal, "Hibrido", item.mandado);
              });
            }
          }

          if (geoMain) {
            item.latPrincipal = geoMain.lat;
            item.lngPrincipal = geoMain.lng;
            item.ufPrincipal = geoMain.uf || "";
            if (geoMain.enderecoFormatado) {
              item.enderecoGeocodificado = geoMain.enderecoFormatado;
            }
            if (!geoMain.fonte) {
              google.script.run.withSuccessHandler(function() {
                if (typeof carregarStatsGeocodificacao === 'function') carregarStatsGeocodificacao();
              }).registrarConsumoGeocodificacao(item.enderecoPrincipal, "Principal", "Google (Client)", true, item.mandado);
            }
          }
        } catch (e) { console.warn("Erro ao geocodificar principal", e); }
      }

      // Geocodificação dos Endereços Secundários (se forem válidos e houver geocoder)
      var secArray = [];
      if (item.secundariosText) {
        var a = item.secundariosText.split('||');
        for (var j = 0; j < a.length; j++) {
          var x = a[j].trim();
          if (x) {
            var geoSec = null;
            // Somente geocodifica se a validação passar (não estiver em endInvalidos)
            var ehSecundarioValido = endInvalidos.indexOf("SECUNDÁRIO: " + x) === -1;

            if (ehSecundarioValido) {
              try {
                var methodSec = window.geoMethodSelecionado || 'Hibrido';
                var progressoSec = " " + (i + 1) + "/" + loteFiltrado.length;

                if (methodSec === 'Google') {
                  if (geocoder) geoSec = await geocodeEndereco(geocoder, x);
                  if (!geoSec) {
                    geoSec = await new Promise(function (resolve) {
                      google.script.run.withSuccessHandler(resolve).withFailureHandler(function () { resolve(null); }).geocodificarHibrido(x, "Google", item.mandado);
                    });
                  }
                } else if (methodSec === 'Mapbox') {
                  btn.innerText = 'SEC Mapbox' + progressoSec;
                  geoSec = await new Promise(function (resolve) {
                    google.script.run.withSuccessHandler(function (res) {
                      console.log("[MAPBOX ONLY SEC] " + x + " ->", res);
                      resolve(res);
                    }).withFailureHandler(function () { resolve(null); }).geocodificarHibrido(x, "Mapbox", item.mandado);
                  });
                } else {
                  // Híbrido
                  if (geocoder) geoSec = await geocodeEndereco(geocoder, x);
                  if (!geoSec) {
                    btn.innerText = 'SEC Híbrido' + progressoSec;
                    geoSec = await new Promise(function (resolve) {
                      google.script.run.withSuccessHandler(function (res) {
                        console.log("[HÍBRIDO BACKEND SEC] " + x + " ->", res);
                        resolve(res);
                      }).withFailureHandler(function () { resolve(null); }).geocodificarHibrido(x, "Hibrido", item.mandado);
                    });
                  }
                }
              } catch (e) { console.warn("Erro ao geocodificar secundário", e); }
            }
            if (geoSec) {
              secArray.push({
                endereco: x,
                lat: geoSec.lat,
                lng: geoSec.lng,
                uf: geoSec.uf || "",
                cpi: geoSec.cpi || "",
                batalhao: geoSec.batalhao || "",
                cia: geoSec.cia || "",
                delegacia: geoSec.delegacia || "",
                cidade: geoSec.cidade || ""
              });
              if (!geoSec.fonte) {
                google.script.run.registrarConsumoGeocodificacao(x, "Secundario", "Google (Client)", true, item.mandado);
              }
            } else {
              secArray.push({ endereco: x, lat: null, lng: null, uf: "", cpi: "", batalhao: "", cia: "", delegacia: "", cidade: "" });
            }
          }
        }
      }
      item.secundarios = secArray;
    }

    // ── FASE 2: SALVAMENTO EM SUB-LOTES ──
    const TAMANHO_SUBLOTE = 50;
    var totalSalvos = 0;
    var totalErros = 0;
    var mensagemFinalErros = [];

    // Fatiar o lote geocodificado em pacotes de TAMANHO_SUBLOTE
    var subLotes = [];
    for (var sl = 0; sl < loteFiltrado.length; sl += TAMANHO_SUBLOTE) {
      subLotes.push(loteFiltrado.slice(sl, sl + TAMANHO_SUBLOTE));
    }

    console.log("[SUB-LOTE] Total de mandados: " + loteFiltrado.length + ". Dividido em " + subLotes.length + " sub-lote(s) de até " + TAMANHO_SUBLOTE + ".");

    for (var slIdx = 0; slIdx < subLotes.length; slIdx++) {
      var subLoteAtual = subLotes[slIdx];
      var numSubLote = slIdx + 1;

      // Atualizar progresso visual
      if (overlay) {
        var pctSave = Math.round(50 + ((slIdx / subLotes.length) * 50)); // Salvamento = 50% a 100%
        overlaySub.innerHTML = "Salvando pacote <strong>" + numSubLote + "</strong> de <strong>" + subLotes.length + "</strong> (" + subLoteAtual.length + " mandados)...";
        overlayBarra.style.width = pctSave + "%";
        overlayPercent.innerText = pctSave + "%";
      }
      btn.innerText = 'SALVANDO PACOTE ' + numSubLote + '/' + subLotes.length + '...';

      try {
        var resSublote = await new Promise(function(resolve, reject) {
          google.script.run
            .withSuccessHandler(function(res) { resolve(res); })
            .withFailureHandler(function(err) { reject(err); })
            .cadastrarMandadosEmLote(subLoteAtual);
        });

        if (resSublote && resSublote.sucesso) {
          totalSalvos += subLoteAtual.length;
          console.log("[SUB-LOTE] Pacote " + numSubLote + "/" + subLotes.length + " salvo com sucesso. (" + subLoteAtual.length + " mandados)");
        } else {
          totalErros += subLoteAtual.length;
          var msgErr = (resSublote && resSublote.mensagem) ? resSublote.mensagem : "Erro desconhecido";
          mensagemFinalErros.push("Pacote " + numSubLote + ": " + msgErr);
          console.error("[SUB-LOTE] Pacote " + numSubLote + " falhou: " + msgErr);
        }
      } catch (errSublote) {
        totalErros += subLoteAtual.length;
        mensagemFinalErros.push("Pacote " + numSubLote + ": " + errSublote.message);
        console.error("[SUB-LOTE] Exceção no pacote " + numSubLote + ":", errSublote.message);
      }

      // Pausa entre sub-lotes para não sobrecarregar o servidor
      if (slIdx < subLotes.length - 1) {
        await new Promise(function(resolve) { setTimeout(resolve, 500); });
      }
    }

    // ── FASE 3: RESULTADO FINAL ──
    if (overlay) {
      overlayBarra.style.width = "100%";
      overlayPercent.innerText = "100%";
      overlaySub.innerHTML = "Importação concluída!";
    }

    // Pausa breve antes de fechar para o usuário ver 100%
    await new Promise(function(resolve) { setTimeout(resolve, 800); });

    if (overlay) overlay.style.display = 'none';
    btn.disabled = false;

    if (totalSalvos > 0) {
      document.getElementById('view-revisao-importacao').style.display = 'none';
      var fab = document.getElementById('btnAdminNovo');
      var isAdmin = document.getElementById('sidebarPerfilEl') && document.getElementById('sidebarPerfilEl').textContent === 'Admin';
      if (fab && isAdmin) fab.style.display = 'flex';

      var msgFinal = "✅ " + totalSalvos + " mandado(s) salvo(s) com sucesso!";
      if (totalErros > 0) {
        msgFinal += "\n\n⚠️ " + totalErros + " mandado(s) com falha:\n" + mensagemFinalErros.join("\n");
      }
      chamarAlertaTatico("RESULTADO DA IMPORTAÇÃO", msgFinal, "OK");
      filaImportacao = [];
      sincronizarBD();
      google.script.run.withSuccessHandler(function(hLogs) {
        window.geocodificacaoConsumoLogs = hLogs || [];
        if (typeof carregarStatsGeocodificacao === 'function') carregarStatsGeocodificacao();
      }).obterHistoricoConsumo();
    } else {
      var msgErro = "❌ Nenhum mandado foi salvo.";
      if (mensagemFinalErros.length > 0) {
        msgErro += "\n\n" + mensagemFinalErros.join("\n");
      }
      chamarAlertaTatico("ERRO NA IMPORTAÇÃO", msgErro, "OK");
      btn.innerText = 'CONFIRMAR IMPORTAÇÃO (' + filaImportacao.length + ')';
    }
  }

  function confirmarExclusaoMandado() {
    var nome = document.getElementById('editNome').value || 'alvo selecionado';

    var mandadoNum = document.getElementById('editMandadoNum').value;
    if (!idLinha && !mandadoNum) {

      return;
    }

    var modalEditar = document.getElementById('modalEditarMandado');
    if (modalEditar) modalEditar.style.display = 'none';

    var msgHtml = 'Você está prestes a EXCLUIR permanentemente o mandado de:<br><br><b style="color:var(--brand-red);font-size:14px;letter-spacing:0.5px;">' + nome + '</b><br><br>Esta ação NÃO pode ser desfeita. Confirma?';

    chamarAlertaTatico("⚠️ ATENÇÃO!", msgHtml, "CONFIRMAR", function (confirma) {
      if (!confirma) {
        if (modalEditar) modalEditar.style.display = 'flex';
        return;
      }

      var btn = document.getElementById('btnExcluirMandado');
      if (btn) {
        btn.innerText = 'EXCLUINDO...';
        btn.disabled = true;
      }

      google.script.run.withSuccessHandler(function (res) {
        if (btn) {
          btn.innerHTML = '<span class="material-symbols-outlined" style="font-size:14px;vertical-align:middle;">delete_forever</span> EXCLUIR REGISTRO PERMANENTEMENTE';
          btn.disabled = false;
        }
        if (res.sucesso) {
          fecharModalEditar();
          chamarAlertaTatico("EXCLUÍDO", res.mensagem, "OK");
          // Atualização local instantânea antes mesmo da resposta em tempo real
          if (window.dadosMandados && Array.isArray(window.dadosMandados)) {
            window.dadosMandados = window.dadosMandados.filter(function(m) {
              return String(m.mandado || '').trim() !== String(mandadoNum || '').trim() && String(m.idLinha || '') !== String(idLinha || '');
            });
            if (typeof window.processarDados === 'function') {
              window.processarDados(window.dadosMandados);
            }
          }
          sincronizarBD();
        } else {
          if (modalEditar) modalEditar.style.display = 'flex';
          chamarAlertaTatico("ERRO", res.mensagem, "OK");
        }
      }).withFailureHandler(function (erro) {
        if (btn) {
          btn.innerHTML = '<span class="material-symbols-outlined" style="font-size:14px;vertical-align:middle;">delete_forever</span> EXCLUIR REGISTRO PERMANENTEMENTE';
          btn.disabled = false;
        }
        if (modalEditar) modalEditar.style.display = 'flex';
        chamarAlertaTatico("FALHA", "Erro ao excluir: " + erro.message, "OK");
      }).excluirMandado(parseInt(idLinha) || 0, mandadoNum);
    });

  function hexToRgba(hex, alpha) {
    if (!hex || !hex.startsWith('#') || hex.length !== 7) return hex;
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return 'rgba(' + r + ', ' + g + ', ' + b + ', ' + alpha + ')';
  }

  function processarUploadCSV() {
    const inputCsv = document.getElementById('inputCsvBNMP');
    const file = inputCsv.files[0];
    if (!file) return;

    document.getElementById('btnProcessarCsv').disabled = true;
    document.getElementById('btnProcessarCsv').innerHTML = 'PROCESSANDO...';

    const reader = new FileReader();
    reader.onload = function (e) {
      const texto = e.target.result;
      const linhas = texto.split(/\r?\n/);
      const matriz = [];

      // Parser super simples para CSV
      linhas.forEach(linha => {
        if (!linha.trim()) return;
        // Ponto e vírgula ou vírgula
        const delimitador = linha.includes(';') ? ';' : ',';
        // Split ignorando delimitadores dentro de aspas
        const valores = linha.split(new RegExp(delimitador + '(?=(?:(?:[^"]*"){2})*[^"]*$)'));
        matriz.push(valores.map(v => v.replace(/^"|"$/g, '').trim()));
      });

      if (matriz.length < 2) {
        chamarAlertaTatico('ERRO', 'CSV inválido ou vazio.', 'OK');
        document.getElementById('btnProcessarCsv').disabled = false;
        document.getElementById('btnProcessarCsv').innerHTML = 'CRUZAR DADOS';
        return;
      }

      google.script.run.withSuccessHandler(function (res) {
        if (res.sucesso) {
          const msg = res.mensagem + '<br><br><b>Pela Cruzada:</b><br>- ' + res.pendentes + ' Pendentes em ambos<br>- ' + res.baixados + ' Baixados no BNMP (Não encontrados no CSV)';
          document.getElementById('resultadoConferencia').innerHTML = msg;
          document.getElementById('resultadoConferencia').style.display = 'block';
          chamarAlertaTatico('SUCESSO', res.mensagem, 'OK');
        } else {
          chamarAlertaTatico('ERRO', res.mensagem, 'OK');
        }
        document.getElementById('btnProcessarCsv').disabled = false;
        document.getElementById('btnProcessarCsv').innerHTML = 'CRUZAR DADOS';
      }).processarCruzamentoCSV(matriz);
    };
    reader.readAsText(file, "UTF-8");
  }

  // Helper: calcular dias restantes a partir de uma string dd/mm/yyyy
  function calcularDiasRestantes(dataStr) {
    if (!dataStr) return null;
    const parts = dataStr.split('/');
    if (parts.length !== 3) return null;
    const dataVal = new Date(parseInt(parts[2]), parseInt(parts[1]) - 1, parseInt(parts[0]));
    if (isNaN(dataVal.getTime())) return null;
    const hoje = new Date();
    hoje.setHours(0, 0, 0, 0);
    const diff = dataVal.getTime() - hoje.getTime();
    return Math.ceil(diff / (1000 * 60 * 60 * 24));
  }

  // Helper: formatar dias restantes em anos, meses e dias
  function formatarDiasRestantes(dias) {
    if (dias === null || dias === undefined) return '';
    const valorAbs = Math.abs(dias);
    const anos = Math.floor(valorAbs / 365);
    const meses = Math.floor((valorAbs % 365) / 30);
    const d = valorAbs % 30;
    let parts = [];
    if (anos > 0) parts.push(anos + (anos === 1 ? ' ano' : ' anos'));
    if (meses > 0) parts.push(meses + (meses === 1 ? ' mês' : ' meses'));
    if (d > 0 || parts.length === 0) parts.push(d + (d === 1 ? ' dia' : ' dias'));
    return parts.join(', ');
  }

  var _chartInstances = {};

  function popularComandosGraficos() {
    if (!window.dadosMandados) return;
    const selectCPI = document.getElementById('filtroComandoGraficos');
    if (!selectCPI) return;

    const cpisSet = new Set();
    const cpmsSet = new Set();

    // Combina dadosMandados e poligonosInstancias para garantir 100% dos CPIs e CPAs
    const fonte = (window.dadosMandados || []).concat(typeof poligonosInstancias !== 'undefined' ? poligonosInstancias : []);

    fonte.forEach(function (d) {
      let rawCpi = (d.cpi || d.cpiArea || d.comando || '').trim();
      if (!rawCpi) return;
      let cpi = rawCpi.replace(/^CPM-/i, '').replace(/CPM-CPA/gi, 'CPA');
      if (/CPA|CPAM|METROPOLITAN/i.test(cpi) || /CPA|CPAM|METROPOLITAN/i.test(rawCpi)) {
        cpmsSet.add(cpi);
      } else if (/CPI/i.test(cpi) || /CPI/i.test(rawCpi)) {
        cpisSet.add(cpi);
      }
    });

    const sortCpiLocal = (a, b) => {
      const numA = parseInt(a.replace(/\D/g, '')) || 0;
      const numB = parseInt(b.replace(/\D/g, '')) || 0;
      return numA !== numB ? numA - numB : a.localeCompare(b);
    };

    const valAtual = selectCPI.value || 'TODOS';
    selectCPI.innerHTML = '<option value="TODOS">Todos Comandos</option>';

    // Optgroup CPI (Interior)
    if (cpisSet.size > 0) {
      const grpCPI = document.createElement('optgroup');
      grpCPI.label = 'CPI - Interior';
      grpCPI.style.color = '#ff6b6b';
      [...cpisSet].sort(sortCpiLocal).forEach(c => {
        const opt = document.createElement('option');
        opt.value = c; opt.textContent = c;
        opt.style.color = '#ffffff';
        opt.style.background = '#252538';
        grpCPI.appendChild(opt);
      });
      selectCPI.appendChild(grpCPI);
    }

    // Optgroup CPA (Metropolitano)
    if (cpmsSet.size > 0) {
      const grpCPM = document.createElement('optgroup');
      grpCPM.label = 'CPA - Metropolitano';
      grpCPM.style.color = '#60a5fa';
      [...cpmsSet].sort(sortCpiLocal).forEach(c => {
        const opt = document.createElement('option');
        opt.value = c; opt.textContent = c;
        opt.style.color = '#ffffff';
        opt.style.background = '#252538';
        grpCPM.appendChild(opt);
      });
      selectCPI.appendChild(grpCPM);
    }

    if ([...selectCPI.options].some(o => o.value === valAtual)) {
      selectCPI.value = valAtual;
    } else if (window._cpiGpsEncontrado && [...selectCPI.options].some(o => o.value === window._cpiGpsEncontrado)) {
      selectCPI.value = window._cpiGpsEncontrado;
    }
  }

  function popularBpmGraficos() {
    if (!window.dadosMandados) return;
    const selectBPM = document.getElementById('filtroBpmGraficos');
    if (!selectBPM) return;
    const valAtual = selectBPM.value || 'TODOS';

    const selectCPI = document.getElementById('filtroComandoGraficos');
    const cpiSelecionado = selectCPI ? selectCPI.value : 'TODOS';

    const normalize = s => (s || '').replace(/^CPM-/i, '').replace(/CPM-CPA/gi, 'CPA').replace(/[\s\/-]+/g, '').toUpperCase();
    const cpiNorm = normalize(cpiSelecionado);
    const relationalMap = buildRelationalAreaMap();
    const batalhoesSet = new Set();

    if (cpiSelecionado !== 'TODOS' && relationalMap.cpiToBpm[cpiNorm]) {
      relationalMap.cpiToBpm[cpiNorm].forEach(b => batalhoesSet.add(b));
    } else {
      const fonte = (window.dadosMandados || []).concat(typeof poligonosInstancias !== 'undefined' ? poligonosInstancias : []);
      fonte.forEach(d => {
        const dCpi = normalize(d.cpi || d.cpiArea || d.comando);
        if (cpiSelecionado !== 'TODOS' && dCpi !== cpiNorm) return;
        const b = (d.batalhao || d.bpmArea || '').trim();
        if (b) batalhoesSet.add(b);
      });
    }

    const ordenados = [...batalhoesSet].sort((a, b) => {
      const isBpmiA = /BPM\/I/i.test(a);
      const isBpmiB = /BPM\/I/i.test(b);
      if (isBpmiA !== isBpmiB) return isBpmiA ? -1 : 1;
      const numA = parseInt(a.replace(/\D/g, '')) || 0;
      const numB = parseInt(b.replace(/\D/g, '')) || 0;
      return numA !== numB ? numA - numB : a.localeCompare(b);
    });

    let html = '<option value="TODOS">Todos Batalhões</option>';
    ordenados.forEach(b => {
      html += '<option value="' + b + '">' + b + '</option>';
    });
    selectBPM.innerHTML = html;
    if ([...selectBPM.options].some(o => o.value === valAtual)) selectBPM.value = valAtual;
  }

  function popularCiaGraficos() {
    if (!window.dadosMandados) return;
    const selectCia = document.getElementById('filtroCiaGraficos');
    if (!selectCia) return;
    const valAtual = selectCia.value || 'TODOS';

    const selectCPI = document.getElementById('filtroComandoGraficos');
    const cpiSelecionado = selectCPI ? selectCPI.value : 'TODOS';
    const selectBpm = document.getElementById('filtroBpmGraficos');
    const bpmSelecionado = selectBpm ? selectBpm.value : 'TODOS';

    const normalize = s => (s || '').replace(/^CPM-/i, '').replace(/CPM-CPA/gi, 'CPA').replace(/[\s\/-]+/g, '').toUpperCase();
    const cpiNorm = normalize(cpiSelecionado);
    const bpmNorm = normalize(bpmSelecionado);
    const relationalMap = buildRelationalAreaMap();
    const ciasSet = new Set();

    if (bpmSelecionado !== 'TODOS' && relationalMap.bpmToCia[bpmNorm]) {
      relationalMap.bpmToCia[bpmNorm].forEach(c => ciasSet.add(c));
    } else {
      const fonte = (window.dadosMandados || []).concat(typeof poligonosInstancias !== 'undefined' ? poligonosInstancias : []);
      fonte.forEach(d => {
        const dCpi = normalize(d.cpi || d.cpiArea || d.comando);
        const dBpm = normalize(d.batalhao || d.bpmArea);
        if (cpiSelecionado !== 'TODOS' && dCpi !== cpiNorm) return;
        if (bpmSelecionado !== 'TODOS' && dBpm !== bpmNorm) return;
        const c = (d.cia || d.ciaArea || '').trim();
        if (c) ciasSet.add(c);
      });
    }

    let html = '<option value="TODOS">Todas Cias</option>';
    [...ciasSet].sort().forEach(c => {
      html += '<option value="' + c + '">' + c + '</option>';
    });
    selectCia.innerHTML = html;
    if ([...selectCia.options].some(o => o.value === valAtual)) selectCia.value = valAtual;
  }

  function renderizarGraficosComFiltro(diasFiltro, diasFiltroCapturas) {
    if (!dadosMandados || dadosMandados.length === 0) return;

    var hoje = new Date();
    var dadosFiltradosGerais = dadosMandados.filter(function (d) { return !d._isSecundarioClone; });

    // Obter filtros geográficos específicos da área
    var selComando = document.getElementById('filtroComandoGraficos');
    var valComando = selComando ? selComando.value : 'TODOS';

    var selCia = document.getElementById('filtroCiaGraficos');

  window.extrairListaCrimes = function (d) {
    let crimes = new Set();
    if (d && d.infoProcessuais) {
      let infoLimpa = (d.infoProcessuais || '')
        .replace(/\|\s*(?:Motivo|S[íi]ntese)\s*:[^|]*/gi, '')
        .replace(/(?:Motivo|S[íi]ntese)\s*:[^|]*/gi, '');

      if (typeof classificarCrime === 'function') {
        let crInfo = classificarCrime(infoLimpa);
        if (crInfo) {
          if (crInfo.nome && crInfo.nome !== 'Outros' && crInfo.nome !== 'NÃO CLASSIFICADO' && crInfo.nome !== 'NÃO IDENTIFICADO') {
            crimes.add(crInfo.nome);
          }
          if (crInfo.todosCrimes && Array.isArray(crInfo.todosCrimes)) {
            crInfo.todosCrimes.forEach(function (c) {
              if (c.nome && c.nome !== 'Outros' && c.nome !== 'NÃO CLASSIFICADO' && c.nome !== 'NÃO IDENTIFICADO') {
                crimes.add(c.nome);
              }
            });
          }
        }
      }

      if (crimes.size === 0) {
        let matchArt = infoLimpa.match(/\|\s*Artigo\s*:\s*([\d\w\s/.-]+?)(?=\s*\||$)/i);
        if (matchArt) {
          let artVal = matchArt[1].trim();
          if (artVal && artVal !== '-' && artVal !== 'N/A' && /^\d+/.test(artVal)) {
            crimes.add('Art. ' + artVal);
          }
        }
      }
    }
    if (crimes.size === 0) crimes.add('Outros');
    return Array.from(crimes);
  };

  window.atualizarApenasRadar = function (dados) {
    const radarTrack = document.getElementById('radarCarouselTrack');
    const radarDots = document.getElementById('radarCarouselDots');

    let latAtual = null;

    dados.forEach(function (d) {
      if (latAtual !== null && lngAtual !== null && !d.semEndereco && d.lat && d.lng) {
        if (typeof calcularDistanciaHaversine === 'function') {
          d._distanciaKm = calcularDistanciaHaversine(latAtual, lngAtual, d.lat, d.lng);
        } else if (typeof calcularHaversine === 'function') {

        d._distanciaKm = 99999;

    let radarData = [];

        }
        if (gpsBtl && alvoBtl) {

      if (window.gpsAreaEncontrada) {

    // Ordenação estritamente por proximidade de distância
    radarData.sort(function (a, b) {

      if (distA !== distB) return distA - distB;

        let dataBnmpRadar = extras.emissao || 'Não consta';
        let statusColorClass = d.status === 'Procurado' ? 'status-procurado' : 'status-capturado';

        let alcunha = extras.alcunha || d.alcunha || '';

        let infoProcStr = d.infoProcessuais || '';

                      </div>

                    <!-- DISTÂNCIA GPS -->
                    <div style="background:rgba(0,0,0,0.4); padding:3px 6px; border-radius:6px; font-size:9.5px; font-weight:900; color:var(--text-primary); border:1px solid rgba(255,255,255,0.15); display:flex; align-items:center; gap:3px; white-space:nowrap;">
                      <span class="material-symbols-outlined" style="font-size:12px; color:var(--brand-red);">my_location</span>

                    </div>

                  <span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:${classCrime.cor}; flex-shrink:0;"></span>

    window.updateCoverflow = function () {
      const cards = radarTrack.querySelectorAll('.radar-card');
      const dots = radarDots ? radarDots.querySelectorAll('.radar-dot') : [];

      cards.forEach((card, i) => {
        const diff = i - window.radarActiveIndex;
        const absDiff = Math.abs(diff);

        if (absDiff > 3) {
          card.style.opacity = '0';
          card.style.pointerEvents = 'none';
          card.classList.remove('active');
        } else {
          card.style.pointerEvents = absDiff === 0 ? 'auto' : 'auto';
          const scale = 1 - absDiff * 0.15;
          const translateX = diff * 80;
          const zIndex = 100 - absDiff;
          const opacity = 1 - absDiff * 0.25;

          card.style.transform = `translateX(${translateX}px) scale(${scale})`;
          card.style.zIndex = zIndex;
          card.style.opacity = opacity;

          if (diff === 0) {
            card.classList.add('active');

  // ==========================================================
  // SWIPE DETECTOR FOR 3D RADAR CAROUSEL (Mobile + Desktop)
  // ==========================================================
  (function initRadarSwipeDetector() {
    let track = document.getElementById('radarCarouselTrack');
    // If track doesn't exist yet, try again shortly
    if (!track) {
      setTimeout(initRadarSwipeDetector, 500);
      return;
    }

    // Flag to avoid adding multiple listeners
    if (track.dataset.radarSwipeDetector) return;
    track.dataset.radarSwipeDetector = 'true';

    let startX = 0;
    let currentX = 0;
    let isDragging = false;
    let threshold = 40;

    function handleStart(x) {
      startX = x;
      currentX = x; // Correção: zerar a posição atual para evitar swipe falso em cliques
      isDragging = true;
    }

    function handleMove(x) {
      if (!isDragging) return;
      currentX = x;
    }


    let preventClickAfterSwipe = false;
    track.addEventListener('click', (e) => {
      if (preventClickAfterSwipe) {
        e.preventDefault();
        e.stopPropagation();
        preventClickAfterSwipe = false;
      }
    }, true);

    function handleEnd() {
      if (!isDragging) return;
      isDragging = false;
      let diff = currentX - startX;

      // if not a click, but a swipe
      if (Math.abs(diff) > threshold) {
        preventClickAfterSwipe = true;
        setTimeout(() => preventClickAfterSwipe = false, 300);
        if (diff > 0) {
          // Swiped Right -> Previous Card
          if (typeof window.mudarRadar === 'function') window.mudarRadar(-1);
        } else {
          // Swiped Left -> Next Card
          if (typeof window.mudarRadar === 'function') window.mudarRadar(1);
        }
      }
    }

    // Touch Events
    track.addEventListener('touchstart', (e) => {
      handleStart(e.touches[0].clientX);
    }, { passive: true });
    track.addEventListener('touchmove', (e) => {
      handleMove(e.touches[0].clientX);
    }, { passive: true });
    track.addEventListener('touchend', () => {
      handleEnd();
    });

    // Mouse Events (Desktop dragging support)
    track.addEventListener('mousedown', (e) => {
      handleStart(e.clientX);
    });
    track.addEventListener('mousemove', (e) => {
      handleMove(e.clientX);
    });
    window.addEventListener('mouseup', () => {
      handleEnd();
    });
  })();

  window.renderizarLeisGrouped = function (leis) {

    // Agrupar leis por Categoria
    const categorias = {};
    leis.forEach(lei => {
      const cat = lei.categoria || 'OUTROS';
      if (!categorias[cat]) {
        categorias[cat] = {
          categoria: cat,
          cor: lei.cor || '#6b7280',
          pinoTexto: lei.pinoTexto || cat.substring(0, 3).toUpperCase(),
          artigos: []
        };
      }
      categorias[cat].artigos.push(lei);
    });

    let html = '';

    // Iterar categorias ordenando por ordem alfabética da categoria
    Object.keys(categorias).sort().forEach(catKey => {
      const cat = categorias[catKey];

      // Ordenar artigos da categoria por Artigo, Paragrafo, Inciso
      cat.artigos.sort((a, b) => {
        const artA = parseFloat(a.artigo) || 999;
        const artB = parseFloat(b.artigo) || 999;
        return artA - artB;
      });

      let artigosHtml = '';
      cat.artigos.forEach(art => {
        const artInfo = [
          art.artigo ? 'Art. ' + art.artigo : '',
          art.paragrafo ? '§ ' + art.paragrafo : '',
          art.inciso ? 'Inc. ' + art.inciso : ''

  function removerAcentos(str) {
    if (!str) return '';
    return String(str)
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .toUpperCase();
  }

  window.limparBuscaLeisGroup = function () {
    const input = document.getElementById('buscaLeisGroup');
    if (input) {
      input.value = '';
      input.focus();
    }
    window.filtrarLeisGrouped();
  };

  window.filtrarLeisGrouped = function () {
    const input = document.getElementById('buscaLeisGroup');
    const btnLimpar = document.getElementById('btnLimparBuscaLeisGroup');
    const rawTerm = (input || {}).value || '';

    if (btnLimpar) {
      btnLimpar.style.display = rawTerm.trim().length > 0 ? 'flex' : 'none';
    }

    const query = removerAcentos(rawTerm.trim());

    if (!query) {
      window.renderizarLeisGrouped(window.listaLeisCompleta);
      return;
    }

    const queryDigits = query.replace(/\D/g, '');

    const filtradas = (window.listaLeisCompleta || []).filter(lei => {
      const cat = removerAcentos(lei.categoria || '');
      const pino = removerAcentos(lei.pinoTexto || '');
      const art = removerAcentos(lei.artigo || '');
      const numLei = removerAcentos(lei.numeroLei || '');
      const leiNome = removerAcentos(lei.leiNome || lei.nomeLei || '');
      const paragrafo = removerAcentos(lei.paragrafo || '');
      const inciso = removerAcentos(lei.inciso || '');
      const tipificacao = removerAcentos(lei.tipificacaoCompleta || '');
      const kw = removerAcentos(lei.palavrasChave || '');

      const artDigits = art.replace(/\D/g, '');
      const numLeiDigits = numLei.replace(/\D/g, '');

      const matchTextual = cat.includes(query) ||
        pino.includes(query) ||
        art.includes(query) ||
        numLei.includes(query) ||
        leiNome.includes(query) ||
        paragrafo.includes(query) ||
        inciso.includes(query) ||
        tipificacao.includes(query) ||
        kw.includes(query);

      if (matchTextual) return true;

      if (queryDigits.length > 0) {
        if (artDigits && (artDigits === queryDigits || artDigits.includes(queryDigits))) return true;
        if (numLeiDigits && (numLeiDigits === queryDigits || numLeiDigits.includes(queryDigits))) return true;
      }

      const tokens = query.split(/\s+/).filter(Boolean);
      if (tokens.length > 1) {
        const allTokensMatch = tokens.every(tok => {
          const tokDigits = tok.replace(/\D/g, '');
          if (tokDigits.length > 0 && (artDigits === tokDigits || numLeiDigits.includes(tokDigits))) return true;
          return cat.includes(tok) || pino.includes(tok) || art.includes(tok) || numLei.includes(tok) || leiNome.includes(tok) || paragrafo.includes(tok) || inciso.includes(tok) || tipificacao.includes(tok) || kw.includes(tok);
        });
        if (allTokensMatch) return true;
      }

      return false;
    });

    window.renderizarLeisGrouped(filtradas);
  };
