<script>
/* ================================================================
     MÓDULO 8: PARSER BNMP + CADASTRO
     ================================================================ */

  function ajustarSePrisaoCivil(dados) {
    if (!dados) return;
    var textoInfo = (dados.infoProcessuais || '').toUpperCase();
    var mEsp = textoInfo.match(/Espécie de prisão\s*:\s*([^|]+)/i);
    var espText = mEsp ? mEsp[1].trim().toUpperCase() : '';
    
    var eCivil = espText.indexOf("CIVIL") !== -1 || espText.indexOf("CÍVEL") !== -1 || espText.indexOf("ALIMENTO") !== -1 || espText.indexOf("PENSÃO") !== -1;
    if (eCivil) {
      var temLeiValida = dados.lei && dados.lei !== 'N/A' && dados.lei !== '-';
      var temArtigoValido = dados.artigo && dados.artigo !== 'N/A' && dados.artigo !== '-';
      
      if (!temLeiValida) {
        dados.lei = "13105";
      }
      if (!temArtigoValido) {
        dados.artigo = "528";
      }
      
      var partesInfo = dados.infoProcessuais.split(' | ');
      for (var i = 0; i < partesInfo.length; i++) {
        if (partesInfo[i].indexOf("Lei:") === 0) {
          var valLei = partesInfo[i].replace("Lei:", "").trim();
          if (!valLei || valLei === 'N/A' || valLei === '-') {
            partesInfo[i] = "Lei: 13105";
          }
        } else if (partesInfo[i].indexOf("Artigo:") === 0) {
          var valArt = partesInfo[i].replace("Artigo:", "").trim();
          if (!valArt || valArt === 'N/A' || valArt === '-') {
            partesInfo[i] = "Artigo: 528";
          }
        }
      }
      dados.infoProcessuais = partesInfo.join(' | ');
    }
  }

  // Função auxiliar para retornar uma Promise para a chamada do Gemini
  function analisarDocumentoComGeminiPromessa(texto) {
    console.log("[DEBUG FRONTEND] Disparando chamada google.script.run para analisarTextoComGemini. Tamanho do texto:", texto.length);
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(res => {
          console.log("[DEBUG FRONTEND] Retorno recebido de analisarTextoComGemini:", res);
          resolve(res);
        })
        .withFailureHandler(err => {
          console.error("[DEBUG FRONTEND] Erro recebido de analisarTextoComGemini:", err);
          resolve({ sucesso: false, mensagem: err.message });
        })
        .analisarTextoComGemini(texto);
    });
  }

  /* ================================================================
     MÓDULO DE PRÉ-CHECAGEM RIGOROSA DE DUPLICIDADE (0 consumo de IA)
     ================================================================ */
  function extrairNumeroMandadoBruto(textoBruto) {
    if (!textoBruto || typeof textoBruto !== 'string') return null;

    // 1. Procurar rótulo N°/Nº/N.º do Mandado/Documento/Processo
    const regexRotulo = /(?:N[°ºo\.]*\s*do\s*(?:Mandado|Documento|Processo)|Mandado\s*N[°ºo\.]*|Documento\s*N[°ºo\.]*|Mandado\s*:)\s*:?\s*([\d]{5,}[-\.\d]+)/i;
    const matchRotulo = textoBruto.match(regexRotulo);
    if (matchRotulo) {
      let mStr = matchRotulo[1].trim().replace(/[^\d\.\-]/g, '');
      if (mStr.length >= 7 && mStr.includes('-')) return mStr;
    }

    // 2. Procurar padrão CNJ completo de Mandado de Prisão BNMP: 7 dígitos - 2 dígitos . 4 dígitos ano . tribunal . foro ...
    const regexCNJ = /\b(\d{6,7}-\d{2}\.\d{4}\.\d\.\d{2}\.\d{4}(?:\.\d{2}\.\d{4}-\d{2})?)\b/;
    const matchCNJ = textoBruto.match(regexCNJ);
    if (matchCNJ) {
      return matchCNJ[1].trim();
    }

    // 3. Procurar qualquer número com hífen característico de mandado
    const regexGenerico = /\b(\d{5,15}-\d{2}(?:[\.\-]\d+)*)\b/;
    const matchGen = textoBruto.match(regexGenerico);
    if (matchGen) {
      return matchGen[1].trim();
    }

    return null;
  }

  function verificarMandadoJaExisteNoSistema(mandadoStr) {
    if (!mandadoStr) return null;

    const limpaDigitos = function(s) {
      return (s || '').toString().replace(/\D/g, '');
    };

    const targetDigitos = limpaDigitos(mandadoStr);
    const targetExact = mandadoStr.trim().toUpperCase();

    if (!targetDigitos && !targetExact) return null;

    const listaBase = (typeof dadosMandados !== 'undefined' && Array.isArray(dadosMandados)) ? dadosMandados : [];
    const listaFila = (typeof filaImportacao !== 'undefined' && Array.isArray(filaImportacao)) ? filaImportacao : [];

    // Verificação na Base Principal (banco de dados)
    const naBase = listaBase.find(function(d) {
      if (!d || !d.mandado) return false;
      var mExist = d.mandado.trim().toUpperCase();
      if (mExist === targetExact) return true;
      var dExist = limpaDigitos(d.mandado);
      if (targetDigitos.length >= 7 && dExist.length >= 7 && dExist === targetDigitos) return true;
      return false;
    });
    if (naBase) return { local: 'Banco de Dados', alvo: naBase };

    // Verificação na Fila de Revisão de Importação
    const naFila = listaFila.find(function(d) {
      if (!d || !d.mandado) return false;
      var mExist = d.mandado.trim().toUpperCase();
      if (mExist === targetExact) return true;
      var dExist = limpaDigitos(d.mandado);
      if (targetDigitos.length >= 7 && dExist.length >= 7 && dExist === targetDigitos) return true;
      return false;
    });
    if (naFila) return { local: 'Fila de Revisão', alvo: naFila };

    return null;
  }

  /* Função reutilizável de extração de dados a partir de texto bruto de PDF via Regex */
  function extrairDadosDeTextoPDF(textoBruto) {
    const texto = textoBruto;

    const isValid = function(val) { if (!val) return false; return !["", "n/a", "-", "não", "nao", "não informado", "nao informado", "não informada"].includes(val.trim().toLowerCase()); };

    const stopLabels = "(?:N° do Mandado\\s*:|N° do Documento\\s*:|Data de validade\\s*:|Nome da Pessoa\\s*:|Pessoa Procurada\\s*:|Nome\\s*:|Nome Social\\s*:|RJI\\s*:|Alcunha\\s*:|Data de Nascimento\\s*:|Sexo\\s*:|Cor\\s*:|RG\\s*:|CPF\\s*:|Natural de\\s*:|Filia[çc][ãa]o\\s*:|Nome da mãe\\s*:|Nome do pai\\s*:|Marcas e sinais\\s*:|Teor do Documento|Endereços|Telefones\\s*:|Informa[çc][õo]es Processuais|Nº do processo\\s*:|Órgão Judicial\\s*:|Espécie de|Tipo do Mandado Origin[áa]rio\\s*:|Tipifica[çc][ãa]o Penal|Lei\\s*:|Artigo\\s*:|Parágrafo\\s*:|Complemento\\s*:|Pena restante\\s*:|Regime Prisional\\s*:|Motivo\\s*:|Crime tentat|Violência Doméstica\\s*:|Identifica[çc][ãa]o biom[ée]trica|Síntese da|Advertências|Observaç[õo]es|Lavrado por\\s*:|MANDADO DE PRISÃO|$)";

    const extrairCurto = function(labelRegex) {
      const regex = new RegExp(labelRegex + '\\s*([\\s\\S]*?)(?=' + stopLabels + ')', 'i');
      const m = texto.match(regex);
      let res = m ? m[1].replace(/\n/g, ' ').replace(/\s{2,}/g, ' ').trim() : "N/A";
      return res.replace(/^\|/, '').replace(/\|$/, '').trim() || "N/A";
    };

    let mandado = extrairCurto('N[°ºo\\.]*\\s*do\\s*(?:Mandado|Documento)\\s*:?');
    var matchMandado = mandado.match(/[\d]{5,}-[\d\.\-]+/); 
    if (matchMandado) mandado = matchMandado[0];

    const matchVal = texto.match(/Data de validade\s*:\s*(\d{2}[\/\.]\d{2}[\/\.]\d{4})/i);
    const validade = matchVal ? matchVal[1].replace(/\./g, '/') : "N/A";
    let nome = extrairCurto('Nome da Pessoa\\s*:'); if (!isValid(nome)) nome = extrairCurto('Pessoa Procurada\\s*:'); if (!isValid(nome)) nome = extrairCurto('Nome\\s*:');
    let cpfBruto = extrairCurto('CPF\\s*:');
    var matchCpf = cpfBruto.match(/\d{3}\.\d{3}\.\d{3}-\d{2}/);
    const cpf = matchCpf ? matchCpf[0] : cpfBruto;
    let rg = extrairCurto('RG\\s*:').replace(/[\s-]+$/, '').trim();
    let matchNasc = texto.match(/(?:Data de Nascimento|Data de nasc\.)\s*:\s*(\d{2}[\/\.]\d{2}[\/\.]\d{4})/i);
    let nascimento = matchNasc ? matchNasc[1].replace(/\./g, '/') : "N/A";
    const sexo = extrairCurto('Sexo\\s*:'); const cor = extrairCurto('Cor\\s*:'); const naturalidade = extrairCurto('Natural de\\s*:');
    let filiacao = extrairCurto('Filia[çc][ãa]o\\s*:').replace(/BNMP\d*/ig, '').trim();
    if (!isValid(filiacao)) { let mae = extrairCurto('Nome da mãe\\s*:'); let pai = extrairCurto('Nome do pai\\s*:'); if (isValid(mae) || isValid(pai)) filiacao = (isValid(mae)?mae:"Não informado") + "(mãe) e " + (isValid(pai)?pai:"Não informado") + "(pai)"; }
    const rji = extrairCurto('RJI\\s*:'); const nomeSocial = extrairCurto('Nome Social\\s*:'); const alcunha = extrairCurto('Alcunha\\s*:'); const marcas = extrairCurto('Marcas e sinais\\s*:');
    const tituloMatch = texto.match(/MANDADO[^\n\r]*/i); let titulo = tituloMatch ? tituloMatch[0].trim() : "MANDADO DE PRISÃO";
    let emissao = "";
    const emissaoMatch1 = texto.match(/(?:Documento gerado em|Documento criado em):?\s*(\d{2}[\/\-]\d{2}[\/\-]\d{4})/i);
    const emissaoMatch2 = texto.match(/(?:[A-ZÀ-Ÿ\- ]+,\s*)?(\d{1,2})\s+de\s+([A-Za-zÀ-Ÿ]+)\s+de\s+(\d{4})/i);
    if (emissaoMatch1) {
      emissao = emissaoMatch1[1].replace(/-/g, '/');
    } else if (emissaoMatch2) {
      const mapMes = {"janeiro":"01","fevereiro":"02","março":"03","abril":"04","maio":"05","junho":"06","julho":"07","agosto":"08","setembro":"09","outubro":"10","novembro":"11","dezembro":"12"};
      let mNum = mapMes[emissaoMatch2[2].toLowerCase()] || "01";
      emissao = emissaoMatch2[1].padStart(2, '0') + "/" + mNum + "/" + emissaoMatch2[3];
    }
    const sinteseMatch = texto.match(/S[ií]ntese da [Dd]ecisão:?\s*([\s\S]*?)(?:Advertências|Observaç[õo]es?:|Outros Mandados|Documento assinado|Lavrado por|$)/i); const sintese = sinteseMatch ? sinteseMatch[1].trim().replace(/\n/g, ' ') : "";
    const obsMatch = texto.match(/Observaç[õo]es?:?\s*([\s\S]*?)(?:Lavrado por:|Documento assinado|Para confirmar)/i); const obsPdf = obsMatch ? obsMatch[1].trim().replace(/\n/g, ' ') : "";

    const endMatch = texto.match(/Endereços:?\s*([\s\S]*?)(?=Informa[çc][õo]es Processuais|Telefones:|S[ií]ntese|Outros Mandados|Advertências|Documento assinado|Lavrado por:?|Observaç[õo]es|CRIMINAIS -|DEPARTAMENTO|$)/i);
    let blocoEnd = endMatch ? endMatch[1].trim() : "N/A";

    blocoEnd = blocoEnd.replace(/CEP[:\s-]*\n+/gi, 'CEP ');
    const UFS_BRASIL = "AC|AL|AP|AM|BA|CE|DF|ES|GO|MA|MT|MS|MG|PA|PB|PR|PE|PI|RJ|RN|RS|RO|RR|SC|SP|SE|TO";
    const ufRegex = new RegExp('-\\s*(' + UFS_BRASIL + ')(?=\\s+[A-Z])', 'gi');
    blocoEnd = blocoEnd.replace(ufRegex, '- $1\n');

    var lixoEndereco = /Tribunal de Justi|Documento assinado|Para confirmar|DEPARTAMENTO DE|CRIMINAL DE|CRIMINAIS|RAJ DE|EXECU[ÇC][ÕO]ES|\d{7}-\d{2}\.\d{4}\.\d\.\d{2}\.\d{4}|e-mail:|telefone:|Nº do Mandado|Mandado de Pris|Mandado de Intern|Teor do Documento|Magistrado|Alcançado|competente.*conforme|jurisdição|TribunalÓrgão|portal\s*BNMP|QR\s*Code|a qualquer Autoridade|que PRENDA e RECOLHA|indicada e qualificada|à ordem e à disposição|unidade prisional|juízo expedidor|pessoa acima|CUMULATIVA DE|VARA CRIMINAL|VARA UNICA|VARA JUDICIAL|VEPEMA|Código Penal|Código de Processo|inimputável|MEDIDA DE SEGURANÇA|art\.\s*\d+|inc\.\s|fundamento no art|trânsito em julg|defesa da vítima|aplicando-lhe|absolver|condenar|sentenciado|pena privativa|regime prisional|condenação|Lei de Execução|medida de segurança|prazo mínimo|considerando o|Internação decorrente|Identificação biométrica|N° do Documento|tipificação|biométrica/i;
    let listaEndBruta = blocoEnd.split('\n').map(function(e) { return e.replace(/Telefone.*/gi, '').replace(/Logradouro:\s*/i, '').trim(); }).filter(function(e) { return e.length >= 5 && isValid(e) && !lixoEndereco.test(e); });
    
    var prefixosEnd = /^(Rua|R |R\.|Av |Av\.|Avenida|Estrada|Rodovia|Rod\.|Travessa|Tv\.|Alameda|Al\.|Praça|Pc\.|Largo|Beco|Viela|Servidão|LOCAL|FOLHA|QUADRA|LOCALIDADE|RUA|AVENIDA|ESTRADA|RODOVIA|TRAVESSA)/i;
    var listaEndJuntada = [];
    for (var ei = 0; ei < listaEndBruta.length; ei++) {
      var linhaEnd = listaEndBruta[ei];
      if (ei > 0 && !prefixosEnd.test(linhaEnd) && listaEndJuntada.length > 0) {
        listaEndJuntada[listaEndJuntada.length - 1] += ', ' + linhaEnd;
      } else {
        listaEndJuntada.push(linhaEnd);
      }
    }
    
    let listaEnd = listaEndJuntada.filter(function(e) { return e.length >= 10; });
    if(listaEnd.length === 0) listaEnd = ["Não informado"];
    const endPrincipal = listaEnd[0]; const endsSec = listaEnd.slice(1);

    let nProcesso = extrairCurto('Nº do processo\\s*:'); if (!isValid(nProcesso)) nProcesso = extrairCurto('N° processo\\s*:');
    const orgao = extrairCurto('Órgão Judicial\\s*:');
    let especie = extrairCurto('Espécie(?: de| da) (?:prisão|Internação)\\s*:'); if (!isValid(especie)) especie = extrairCurto('Espécie de prisão\\s*:');
    let lei = extrairCurto('Lei\\s*:'); let artigo = extrairCurto('Artigo\\s*:'); let paragrafo = extrairCurto('Parágrafo\\s*:'); let inciso = extrairCurto('Inciso\\s*:');

    // ── DETECÇÃO AUTOMÁTICA DE PRISÃO CIVIL / PENSÃO ALIMENTÍCIA (CPC / Lei 13105 / Art. 528) ──
    var isPrisaoCivil = (isValid(especie) && /civil|cível|alimento|pensão/i.test(especie)) || 
                        (isValid(titulo) && /civil|pensão/i.test(titulo)) || 
                        /MANDADO DE PRISÃO\s+CIVIL|prestação alimentícia|débito alimentar|execução de alimentos|artigo 528|Código de Processo Civil|FAMILIA SUCESSOES/i.test(texto);

    if (isPrisaoCivil) {
      if (!isValid(lei) || lei === 'N/A' || lei === '' || lei === '-') {
        lei = '13105';
      }
      if (!isValid(artigo) || artigo === 'N/A' || artigo === '' || artigo === '-') {
        artigo = '528';
      }
      if (!isValid(paragrafo) || paragrafo === 'N/A' || paragrafo === '' || paragrafo === '-') {
        var mPar3 = texto.match(/artigo\s*528[^\n\r]*§\s*(\d+)/i) || texto.match(/§\s*(\d+)[ºª]?\s+do\s+Código de Processo Civil/i) || texto.match(/§\s*(\d+)[ºª]?\b/i);
        if (mPar3) {
          paragrafo = mPar3[1];
        }
      }
    }
    
    // ── PROCESSAMENTO DO CAMPO "COMPLEMENTO" ──
    // Ex: "Art. 157 § 2º, II, V, VII c/c Art. 61 "caput", II, "h" ambos do(a) CP"
    var complemento = extrairCurto('Complemento\\s*:');
    var tipificacoesComplemento = [];
    
    if (isValid(complemento) && complemento.length > 3) {
      console.log('[PARSER] Complemento encontrado:', complemento);
      
      // Dividir por "c/c" para separar crimes concorrentes
      var partesCC = complemento.split(/\s+c\/c\s+/i);
      
      partesCC.forEach(function(parte, idx) {
        parte = parte.trim();
        // Remover "ambos do(a) CP/CPM/etc" e "do(a) CP" no final
        parte = parte.replace(/\s+ambos\s+d[oe]\(?a?\)?\s+\w+\.?$/i, '').trim();
        parte = parte.replace(/\s+d[oe]\(?a?\)?\s+\w+\.?$/i, '').trim();
        
        var tipif = { lei: '', artigo: '', paragrafo: '', inciso: '' };
        
        // Extrair artigo: Art. NNN ou art. NNN-A
        var mArt = parte.match(/art\.?\s*(\d+[A-Za-z-]*)/i);
        if (mArt) {
          tipif.artigo = mArt[1].trim();
          // Remover "Art. NNN" da parte para processar o resto
          parte = parte.replace(/art\.?\s*\d+[A-Za-z-]*/i, '').trim();
        }
        
        // Extrair parágrafo: § Nº ou "caput"
        var mPar = parte.match(/§\s*(\d+[ºª]?)/);
        if (mPar) {
          tipif.paragrafo = '§ ' + mPar[1].trim();
          parte = parte.replace(/§\s*\d+[ºª]?/, '').trim();
        } else if (/caput/i.test(parte)) {
          tipif.paragrafo = 'caput';
          parte = parte.replace(/"?caput"?/i, '').trim();
        }
        
        // Extrair incisos (romanos e/ou alíneas entre aspas): II, V, VII ou "h"
        var incisos = [];
        // Limpar vírgulas iniciais/finais
        parte = parte.replace(/^[,\s]+/, '').replace(/[,\s]+$/, '');
        
        // Encontrar números romanos e alíneas
        var tokens = parte.split(/\s*(?:,|\s+e\s+|\s+E\s+|\s+e\/ou\s+)\s*/);
        tokens.forEach(function(tk) {
          tk = tk.trim().replace(/^["']|["']$/g, ''); // Remove aspas
          if (!tk) return;
          // Número romano (I, II, III, IV, V, VI, VII, VIII, IX, X, etc.)
          if (/^[IVXLCDM]{1,5}$/i.test(tk)) {
            incisos.push(tk.toUpperCase());
          }
          // Alínea (letra entre aspas, ex: "h")
          else if (/^[a-z]$/i.test(tk)) {
            incisos.push('"' + tk.toLowerCase() + '"');
          }
        });
        
        tipif.inciso = incisos.join(', ');
        
        // Se é o primeiro crime (idx===0), usar a lei/artigo/paragrafo já extraídos se não encontrados no complemento
        if (idx === 0) {
          if (!tipif.artigo && isValid(artigo)) tipif.artigo = artigo;
          tipif.lei = isValid(lei) ? lei : '';
          if (!tipif.paragrafo && isValid(paragrafo)) tipif.paragrafo = '§ ' + paragrafo;
        } else {
          // Crimes subsequentes: mesma lei se não especificado
          tipif.lei = isValid(lei) ? lei : '';
        }
        
        tipificacoesComplemento.push(tipif);
      });
      
      // Aplicar incisos do primeiro crime ao campo principal
      if (tipificacoesComplemento.length > 0) {
        var primeiro = tipificacoesComplemento[0];
        if (primeiro.inciso && (!isValid(inciso) || inciso === 'N/A' || inciso === '-')) {
          inciso = primeiro.inciso;
        }
        if (primeiro.paragrafo && (!isValid(paragrafo) || paragrafo === 'N/A' || paragrafo === '-')) {
          paragrafo = primeiro.paragrafo;
        }
      }
      
      console.log('[PARSER] Tipificações do complemento:', JSON.stringify(tipificacoesComplemento));
    }
    
    // ── DETECÇÃO DE MÚLTIPLAS TIPIFICAÇÕES PENAIS ──
    // Exemplo de PDF: "Tipificação Penal: Lei: 2848, art. 121, § 2º, I\nLei: 2848, art. 121, § 2º, III\nLei: 2848, art. 121, § 2º, IV"
    var blocoTipificacao = '';
    var mTipif = texto.match(/Tipifica[çc][ãa]o Penal:?\s*([\s\S]*?)(?=Identifica[çc][ãa]o biom|Endereços|Pena restante|Regime Prisional|Motivo|Crime tentat|Violência|Lavrado por|Advertências|Observaç|Síntese da|$)/i);
    if (mTipif) blocoTipificacao = mTipif[1].trim();
    
    // Procurar todas as ocorrências de "Lei:" no bloco
    var tipificacoes = [];
    if (blocoTipificacao) {
      var linhasTipif = blocoTipificacao.split(/\n/).map(function(l){ return l.trim(); }).filter(function(l){ return l.length > 2; });
      
      var isInlineFormat = linhasTipif.some(function(l) { return /^Lei\s*:/i.test(l) && /art\.?/i.test(l); });

      if (isInlineFormat) {
        linhasTipif.forEach(function(linhaLei) {
          if (!/^Lei\s*:/i.test(linhaLei)) return;
          var t = { lei: '', artigo: '', paragrafo: '', inciso: '' };
          var resto = linhaLei.replace(/^Lei\s*:\s*/i, '').trim();
          
          var mInciso = resto.match(/,\s*([IVXLCDM]{1,5})\s*$/);
          if (mInciso) { t.inciso = mInciso[1].trim(); resto = resto.replace(/,\s*[IVXLCDM]{1,5}\s*$/, '').trim(); }
          
          var mPar = resto.match(/§\s*([^,]+)/);
          if (mPar) { t.paragrafo = '§ ' + mPar[1].trim(); resto = resto.replace(/,?\s*§\s*[^,]+/, '').trim(); }
          
          var mArt = resto.match(/art\.?\s*(\d+[A-Za-z-]*)/i);
          if (mArt) { t.artigo = mArt[1].trim(); resto = resto.replace(/,?\s*art\.?\s*\d+[A-Za-z-]*/i, '').trim(); }
          
          t.lei = resto.replace(/,\s*$/, '').trim();
          tipificacoes.push(t);
        });
      } else {
        // Formato Vertical (múltiplos Artigos para mesma Lei ou múltiplas Leis)
        var currentLei = '';
        var tObj = { lei: '', artigo: '', paragrafo: '', inciso: '' };
        
        linhasTipif.forEach(function(linha) {
          if (/^Lei\s*:/i.test(linha)) {
            if (tObj.artigo || tObj.lei) {
              tipificacoes.push(Object.assign({}, tObj));
              tObj = { lei: '', artigo: '', paragrafo: '', inciso: '' };
            }
            currentLei = linha.replace(/^Lei\s*:/i, '').trim();
            tObj.lei = currentLei;
          } else if (/^Artigo\s*:/i.test(linha)) {
            if (tObj.artigo) {
              tipificacoes.push(Object.assign({}, tObj));
              tObj = { lei: currentLei, artigo: '', paragrafo: '', inciso: '' };
            }
            tObj.artigo = linha.replace(/^Artigo\s*:/i, '').trim();
          } else if (/^Par[aá]grafo\s*:/i.test(linha)) {
            tObj.paragrafo = linha.replace(/^Par[aá]grafo\s*:/i, '').trim();
            if (!tObj.paragrafo.includes('§')) tObj.paragrafo = '§ ' + tObj.paragrafo;
          } else if (/^Inciso\s*:/i.test(linha)) {
            tObj.inciso = linha.replace(/^Inciso\s*:/i, '').trim();
          }
        });
        
        if (tObj.lei || tObj.artigo) {
          tipificacoes.push(Object.assign({}, tObj));
        }
      }
    }
    
    // Fallback: Se lei contém "art." embutido (formato antigo)
    if (lei && lei.match(/art\./i) && (!isValid(artigo) || artigo === 'N/A' || artigo === '')) {
      var partesLei = lei.split(/art\./i);
      lei = partesLei[0].replace(/,\s*$/, '').trim();
      var restoLei = partesLei[1].trim();
      if (restoLei.match(/§/i)) {
        var subPartes = restoLei.split(/§/i);
        artigo = subPartes[0].replace(/,\s*$/, '').trim();
        paragrafo = '§ ' + subPartes[1].trim();
      } else {
        artigo = restoLei;
      }
    }

    let pena = extrairCurto('Pena restante\\s*:'); if (!isValid(pena)) pena = extrairCurto('Prazo Mínimo da Internação\\s*:');
    const regime = extrairCurto('Regime Prisional\\s*:'); const motivo = extrairCurto('Motivo\\s*:'); const tentado = extrairCurto('Crime tentat[do]\\s*:'); const vd = extrairCurto('Violência Doméstica\\s*:');

    // --- CONSOLIDAÇÃO GLOBAL DAS TIPIFICAÇÕES ---
    // Recolher a principal, as extras e as do complemento
    var todasTipifBruto = [];
    if (isValid(lei) || isValid(artigo)) todasTipifBruto.push({ lei: lei, artigo: artigo, paragrafo: paragrafo, inciso: inciso });
    tipificacoes.forEach(function(t) { todasTipifBruto.push(t); });
    tipificacoesComplemento.forEach(function(t) { todasTipifBruto.push(t); });

    // Desmembrar artigos e parágrafos múltiplos em tipificações penais separadas
    var todasTipif = [];
    todasTipifBruto.forEach(function(t) {
      if (!t) return;
      var leiVal = t.lei;
      var artVal = t.artigo;
      var parVal = t.paragrafo;
      var incVal = t.inciso;

      var arts = (typeof extrairArtigosDesmembrados === 'function' && isValid(artVal)) ? extrairArtigosDesmembrados(artVal) : (isValid(artVal) ? [artVal] : []);
      if (arts.length === 0 && isValid(artVal)) arts = [artVal];

      arts.forEach(function(artSingle) {
        var pars = (typeof extrairParagrafosDesmembrados === 'function' && isValid(parVal)) ? extrairParagrafosDesmembrados(parVal) : (isValid(parVal) ? [parVal] : []);
        if (pars.length > 1) {
          pars.forEach(function(parSingle) {
            todasTipif.push({ lei: leiVal, artigo: artSingle, paragrafo: parSingle, inciso: incVal });
          });
        } else {
          todasTipif.push({ lei: leiVal, artigo: artSingle, paragrafo: parVal, inciso: incVal });
        }
      });
    });

    var mapTipif = {};
    var ordemTipif = [];
    todasTipif.forEach(function(t) {
      var l = isValid(t.lei) ? t.lei.trim().toLowerCase() : '';
      var a = isValid(t.artigo) ? t.artigo.trim().toLowerCase() : '';
      var key = l + '|' + a;
      if (key === '|') return; // Vazio
      
      if (!mapTipif[key]) {
        mapTipif[key] = { lei: t.lei, artigo: t.artigo, paragrafo: t.paragrafo, incisos: [] };
        ordemTipif.push(key);
      }
      
      // Se não tem parágrafo e esse tem (e não é falso), absorve
      if ((!isValid(mapTipif[key].paragrafo) || mapTipif[key].paragrafo === 'N/A') && isValid(t.paragrafo)) {
        mapTipif[key].paragrafo = t.paragrafo;
      }
      
      // Mesclar incisos únicos
      if (isValid(t.inciso)) {
        var incs = t.inciso.split(/[,|;]|\s+\be(?:\/ou)?\b\s+|\s+\bE(?:\/OU)?\b\s+/i).map(function(x) { return x.trim(); }).filter(function(x) { return x; });
        incs.forEach(function(inc) {
          if (mapTipif[key].incisos.indexOf(inc) === -1) {
            mapTipif[key].incisos.push(inc);
          }
        });
      }
    });

    var resultTipif = ordemTipif.map(function(k) { return mapTipif[k]; });
    
    // Atualiza as variáveis globais com o 1º crime consolidado
    if (resultTipif.length > 0) {
      lei = resultTipif[0].lei || lei;
      artigo = resultTipif[0].artigo || artigo;
      paragrafo = resultTipif[0].paragrafo || paragrafo;
      inciso = resultTipif[0].incisos.length > 0 ? resultTipif[0].incisos.join(', ') : 'N/A';
    }

    let infoProc = 'Nº do processo: ' + nProcesso + ' | Órgão Judicial: ' + orgao + ' | Espécie de prisão: ' + especie + ' | Lei: ' + lei + ' | Artigo: ' + artigo + ' | Parágrafo: ' + paragrafo + ' | Inciso: ' + inciso + ' | Pena restante: ' + pena + ' | Regime Prisional: ' + regime + ' | Motivo: ' + motivo + ' | Crime tentado: ' + tentado + ' | Violência Doméstica: ' + vd;
    
    // Anexar complemento bruto para referência
    if (isValid(complemento) && complemento.length > 3) {
      infoProc += ' | Complemento: ' + complemento;
    }
    
    // Anexar os OUTROS crimes consolidados (do 2º em diante)
    if (resultTipif.length > 1) {
      for (var i = 1; i < resultTipif.length; i++) {
        var tr = resultTipif[i];
        var trInc = tr.incisos.length > 0 ? tr.incisos.join(', ') : 'N/A';
        infoProc += ' | Lei: ' + (tr.lei||'N/A') + ' | Artigo: ' + (tr.artigo||'N/A') + ' | Parágrafo: ' + (tr.paragrafo||'N/A') + ' | Inciso: ' + trInc;
      }
    }

    return {
      sucesso: true,
      dados: {
        nome, cpf, mandado, validade, rg, naturalidade, nascimento, sexo, cor, filiacao,
        batalhao: "A DEFINIR (GEO)", infoProcessuais: infoProc,
        artigo: resultTipif.length > 0 ? resultTipif.map(function(t){ return t.artigo; }).filter(function(a){ return isValid(a); }).join(', ') || (artigo || "N/A") : (artigo || "N/A"),
        lei: resultTipif.length > 0 ? resultTipif[0].lei || (lei || "N/A") : (lei || "N/A"),
        enderecoPrincipal: endPrincipal, latPrincipal: null, lngPrincipal: null, secundarios: endsSec.map(function(s) { return {endereco: s, lat: null, lng: null}; }),
        extras: { titulo: titulo, emissao: emissao, nomeSocial: isValid(nomeSocial)?nomeSocial:"", rji: isValid(rji)?rji:"", alcunha: isValid(alcunha)?alcunha:"", marcas: isValid(marcas)?marcas.replace(/\n/g,' '):"", sintese: isValid(sintese)?sintese:"", obsPdf: isValid(obsPdf)?obsPdf:"" },
        tipoImportacao: "REGEX"
      }
    };
  }

  /* ================================================================
     MÓDULO 9: PROCESSAMENTO EM LOTE DE PDFs (Pré-checagem + Fila)
     ================================================================ */
  async function iniciarProcessamentoLotePdf(textosPdfs, useIA = true) {
    const totalInicial = textosPdfs.length;
    console.log("[DEBUG FRONTEND] processarLotePdf iniciado. Total inicial no lote:", totalInicial);

    // ── PRÉ-VERIFICAÇÃO DE DUPLICIDADE GLOBAL ANTES DE ENVIAR A QUALQUER PROCESSAMENTO ──
    const textosFiltradosParaProcessar = [];
    const listaDuplicados = [];

    for (let i = 0; i < textosPdfs.length; i++) {
      const itemOuTexto = textosPdfs[i];
      const textoBruto = (typeof itemOuTexto === 'object' && itemOuTexto.texto) ? itemOuTexto.texto : itemOuTexto;
      const fotoBase64Item = (typeof itemOuTexto === 'object' && itemOuTexto.fotoBase64) ? itemOuTexto.fotoBase64 : null;
      const mandadoExtraido = extrairNumeroMandadoBruto(textoBruto);

      let duplicado = null;
      if (mandadoExtraido) {
        duplicado = verificarMandadoJaExisteNoSistema(mandadoExtraido);
      }

      if (duplicado) {
        console.warn("[PRÉ-CHECK LOTE] Mandado ignorado antes do processamento (" + (useIA ? "IA" : "Regex") + "):", mandadoExtraido, "Local:", duplicado.local);
        listaDuplicados.push({
          index: i + 1,
          mandado: mandadoExtraido,
          nome: duplicado.alvo.nome || 'Alvo já cadastrado',
          local: duplicado.local
        });
      } else {
        textosFiltradosParaProcessar.push({
          indexOriginal: i + 1,
          mandadoEstimado: mandadoExtraido,
          texto: textoBruto,
          fotoBase64: fotoBase64Item
        });
      }
    }

    // Se TODOS os PDFs selecionados forem duplicados: 0 chamadas à IA / Regex!
    if (textosFiltradosParaProcessar.length === 0) {
      let detalheDuplicados = listaDuplicados.map(d => `• Doc ${d.index}: Mandado ${d.mandado} (${d.nome}) [${d.local}]`).join('\n');
      console.warn("[PRÉ-CHECK LOTE] Todos os PDFs selecionados já constam no sistema. Nenhuma chamada realizada.");
      return chamarAlertaTatico("⚠️ NENHUM MANDADO NOVO", "Todos os " + totalInicial + " PDFs selecionados já foram importados anteriormente ou constam na fila de revisão.\n\n" + (useIA ? "Nenhuma chamada à IA Gemini foi realizada.\n\n" : "") + detalheDuplicados, "OK");
    }

    // Se ALGUNS PDFs forem duplicados, avisa o usuário e processa apenas os novos
    if (listaDuplicados.length > 0) {
      console.info("[PRÉ-CHECK LOTE] Duplicados ignorados:", listaDuplicados.length, "Novos a processar:", textosFiltradosParaProcessar.length);
      chamarAlertaTatico("ℹ️ DUPLICIDADES IGNORADAS", listaDuplicados.length + " de " + totalInicial + " PDFs já constam no sistema e foram ignorados.\n\nProcessando apenas os " + textosFiltradosParaProcessar.length + " PDF(s) novo(s)...", "OK");
    }

    const total = textosFiltradosParaProcessar.length;
    let adicionados = 0;
    let concluidos = 0;

    const overlay = document.getElementById('loadingOverlayIA');
    const overlayTitulo = document.getElementById('overlayIATitulo');
    const overlaySub = document.getElementById('overlayIASub');
    const overlayBarra = document.getElementById('overlayIABarra');
    const overlayPercent = document.getElementById('overlayIAPercent');

    if (overlay) {
      overlayTitulo.innerText = useIA ? "Analisando Lote com IA" : "Processando Lote (Regex)";
      overlaySub.innerHTML = "Analisando: <strong>0</strong> de <strong>" + total + "</strong> arquivos novos...";
      overlayBarra.style.width = "0%";
      overlayPercent.innerText = "0%";
      overlay.style.display = 'flex';
    }

    function atualizarProgressoUI() {
      const pct = Math.round((concluidos / total) * 100);
      if (overlaySub) overlaySub.innerHTML = "Analisando: <strong>" + concluidos + "</strong> de <strong>" + total + "</strong> arquivos novos...";
      if (overlayBarra) overlayBarra.style.width = pct + "%";
      if (overlayPercent) overlayPercent.innerText = pct + "%";
    }

    const indicesParaProcessar = [...Array(total).keys()];
    let mensagensErroLote = [];
    const limiteConcorrencia = useIA ? 1 : 10;

    async function worker() {
      while (indicesParaProcessar.length > 0) {
        const idx = indicesParaProcessar.shift();
        const itemInfo = textosFiltradosParaProcessar[idx];
        const textoBruto = itemInfo.texto;

        try {
          let resposta;
          if (useIA) {
            await new Promise(resolve => setTimeout(resolve, 500));
            resposta = await analisarDocumentoComGeminiPromessa(textoBruto);
          } else {
            resposta = extrairDadosDeTextoPDF(textoBruto);
          }

          if (resposta.sucesso) {
            let dados = resposta.dados;
            if (dados.mandado && dados.mandado !== "N/A") {
              const dupPos = verificarMandadoJaExisteNoSistema(dados.mandado);
              if (dupPos) {
                mensagensErroLote.push(`- Doc ${itemInfo.indexOriginal}: Duplicado (Mandado ${dados.mandado})`);
                continue;
              }
            }
            if (itemInfo.fotoBase64 && (!dados.fotoBase64 || dados.fotoBase64 === "" || dados.fotoBase64 === "N/A")) {
              dados.fotoBase64 = itemInfo.fotoBase64;
            }
            dados.tipoImportacao = dados.tipoImportacao || (useIA ? "GEMINI" : "REGEX");
            ajustarSePrisaoCivil(dados);
            var txtSec = (dados.secundarios || []).map(function(s){return s.endereco;}).join(' || ');
            dados.secundariosText = txtSec;
            filaImportacao.push(dados);
            adicionados++;
          } else {
            mensagensErroLote.push(`- Doc ${itemInfo.indexOriginal}: ${resposta.mensagem}`);
          }
        } catch (erro) {
          mensagensErroLote.push(`- Doc ${itemInfo.indexOriginal}: Falha técnica.`);
        } finally {
          concluidos++;
          atualizarProgressoUI();
        }
      }
    }

    const workers = Array(Math.min(limiteConcorrencia, total)).fill(0).map(() => worker());
    await Promise.all(workers);

    if (overlay) overlay.style.display = 'none';
    if (adicionados > 0) {
      fecharModalSuperBloco();
      document.getElementById('view-revisao-importacao').style.display = 'flex';
      renderizarTabelaFilaRevisao();
    }
    if (mensagensErroLote.length > 0) chamarAlertaTatico("RESULTADO DO LOTE", `Sucesso: ${adicionados}. Ignorados/Erros: ${mensagensErroLote.length}`, "OK");
  }

      if (!arquivo || !arquivo.type.startsWith('image/')) return chamarAlertaTatico("FORMATO INVÁLIDO", "Selecione uma imagem.", "OK");
      const reader = new FileReader();
      reader.onload = function(e) {

          cropperInstancia = new Cropper(imagemCrop, { aspectRatio: 3/4, viewMode: 1, dragMode: 'move', guides: true, cropBoxMovable: true, cropBoxResizable: true, background: false });
        };
      };
      reader.readAsDataURL(arquivo);
    }

    if (btnConfirmarCrop) {
      btnConfirmarCrop.onclick = function() {
        if (!cropperInstancia) return;
        fotoBase64Temporaria = cropperInstancia.getCroppedCanvas({ width: 300, height: 400, fillColor: '#fff', imageSmoothingEnabled: true, imageSmoothingQuality: 'high' }).toDataURL('image/jpeg', 0.7);
        cropperInstancia.destroy(); cropperInstancia = null;
        telaRecorte.style.display = "none"; wrapperFicha.style.display = "flex"; btnProcessar.style.display = "block";
        if(previewFoto) { previewFoto.src = fotoBase64Temporaria; previewFoto.style.display = "block"; previewFoto.className = "pre-save"; if(areaTextoFoto) areaTextoFoto.style.display = "none"; }
      };
    }

    if (inputFoto) inputFoto.addEventListener('change', function(e) { if (e.target.files[0]) abrirRecorte(e.target.files[0]); });

    window.addEventListener('paste', function(e) {
      if (document.getElementById('modalSuperBloco').style.display !== 'flex') return;
      if (telaRecorte.style.display === 'flex') return;
      const items = (e.clipboardData || e.originalEvent.clipboardData).items;
      for (let i = 0; i < items.length; i++) {
        if (items[i].type.startsWith('image/')) { abrirRecorte(items[i].getAsFile()); e.preventDefault(); break; }
      }
    });
  })();

  (function() {

      iniciarProcessamentoLotePdf(textosArray, useIA);
    }
    
  async function extrairFotoDePaginaPdf(page) {
    try {
      const scale = 1.5;
      const viewport = page.getViewport({ scale: scale });
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = viewport.width;
      canvas.height = viewport.height;

      await page.render({ canvasContext: ctx, viewport: viewport }).promise;

      // Coordenadas milimétricas do "Zoom" na face (recorte bem fechado) para eliminar 100% de textos na borda
      const cropX = Math.floor(canvas.width * 0.055);
      const cropY = Math.floor(canvas.height * 0.202); // Meio-termo exato (0.195 deixava teto branco, 0.210 cortava a cabeça)
      const cropWidth = Math.floor(canvas.width * 0.115); 
      const cropHeight = Math.floor(canvas.height * 0.133); // Ajuste fino para encaixar o rosto e o queixo perfeitamente

      const imgData = ctx.getImageData(cropX, cropY, cropWidth, cropHeight);
      const pixels = imgData.data;

      let minLuma = 255;
      let maxLuma = 0;
      let pixelsComCor = 0;
      let totalAmostras = 0;

      for (let i = 0; i < pixels.length; i += 16) {
        const r = pixels[i];
        const g = pixels[i + 1];
        const b = pixels[i + 2];

        // Luminância
        const luma = 0.299 * r + 0.587 * g + 0.114 * b;
        if (luma < minLuma) minLuma = luma;
        if (luma > maxLuma) maxLuma = luma;

        // Saturação de cor (fotos humanas possuem variação entre R, G e B nos tons de pele/roupa/fundo)
        const maxVal = Math.max(r, g, b);
        const minVal = Math.min(r, g, b);
        if ((maxVal - minVal) > 14) {
          pixelsComCor++;
        }
        totalAmostras++;
      }

      // 1. Se a variação de brilho no recorte for mínima, a caixa está em branco
      if ((maxLuma - minLuma) <= 30) {
        console.log("[FOTO PDF] PDF sem foto (área biométrica totalmente em branco).");
        return null;
      }

      // 2. Se menos de 4% dos pixels tiverem qualquer tom colorido, é o ícone geométrico cinza padrão do BNMP
      const percentualCor = (pixelsComCor / totalAmostras) * 100;
      if (percentualCor < 4.0) {
        console.log("[FOTO PDF] Ícone geométrico placeholder cinza do BNMP detectado (" + percentualCor.toFixed(1) + "% cor). Desconsiderando.");
        return null;
      }

      // É UMA FOTO REAL DE PESSOA!
      const canvasFoto = document.createElement('canvas');
      canvasFoto.width = cropWidth;
      canvasFoto.height = cropHeight;
      const ctxFoto = canvasFoto.getContext('2d');
      ctxFoto.drawImage(canvas, cropX, cropY, cropWidth, cropHeight, 0, 0, cropWidth, cropHeight);
      const dataUrl = canvasFoto.toDataURL('image/jpeg', 0.85);
      console.log("[FOTO PDF] Foto real de pessoa recortada com sucesso! (" + percentualCor.toFixed(1) + "% cor, tam: " + dataUrl.length + ")");
      return dataUrl;
    } catch (e) {
      console.warn("[FOTO PDF] Erro ao extrair foto da página:", e);
      return null;
    }
  }

  if (inputPdfUploadCustom) {
    inputPdfUploadCustom.addEventListener('change', async function(e) {
      const files = e.target.files;
      if (!files || files.length === 0) return;

      loadingMsg.style.display = 'block';
      textArea.disabled = true;

      // Mostrar overlay de progresso durante a leitura dos PDFs
      const overlay = document.getElementById('loadingOverlayIA');
      const overlayTitulo = document.getElementById('overlayIATitulo');
      const overlaySub = document.getElementById('overlayIASub');
      const overlayBarra = document.getElementById('overlayIABarra');
      const overlayPercent = document.getElementById('overlayIAPercent');

      if (overlay && files.length > 5) {
        overlayTitulo.innerText = "Lendo PDFs";
        overlaySub.innerHTML = "Extraindo texto: <strong>0</strong> de <strong>" + files.length + "</strong> arquivos...";
        overlayBarra.style.width = "0%";
        overlayPercent.innerText = "0%";
        overlay.style.display = 'flex';
      }

      try {
        var textosLote = [];
        const LOTE_RESPIRO = 10; // A cada 10 PDFs, libera a main thread do navegador

        for (var f = 0; f < files.length; f++) {
          const file = files[f];
          const arrayBuffer = await file.arrayBuffer();
          const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
          var fullText = '';
          var fotoBase64 = null;

          for (var i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const content = await page.getTextContent();

            var lastY, text = '';
            for (var item of content.items) {
              if (lastY == item.transform[5] || !lastY) {
                text += item.str;
              } else {
                text += '\n' + item.str;
              }
              lastY = item.transform[5];
            }
            fullText += text + '\n';

            // Na página 1, tentar extrair a foto se houver
            if (i === 1 && !fotoBase64) {
              try {
                fotoBase64 = await extrairFotoDePaginaPdf(page);
              } catch (errFoto) {
                console.warn("[FOTO PDF] Falha na extração de foto da pág 1:", errFoto.message);
              }
            }
          }
          textosLote.push({
            texto: fullText.replace(/\s{2,}/g, ' '),
            fotoBase64: fotoBase64
          });

          // Atualizar progresso visual da leitura
          if (overlay && files.length > 5) {
            var pctLeitura = Math.round(((f + 1) / files.length) * 100);
            overlaySub.innerHTML = "Extraindo texto: <strong>" + (f + 1) + "</strong> de <strong>" + files.length + "</strong> arquivos...";
            overlayBarra.style.width = pctLeitura + "%";
            overlayPercent.innerText = pctLeitura + "%";
          }

          // PAUSA DE RENDERIZAÇÃO: A cada LOTE_RESPIRO PDFs, libera o navegador
          // para redesenhar a tela, atualizar a barra e liberar memória RAM
          if ((f + 1) % LOTE_RESPIRO === 0 && f < files.length - 1) {
            await new Promise(function(resolve) { setTimeout(resolve, 80); });
          }
        }

        // Esconder overlay de leitura antes de iniciar o processamento
        if (overlay && files.length > 5) {
          overlay.style.display = 'none';
        }

        setTimeout(function() { aplicarConfigsEProcessar(textosLote); }, 500);

      } catch (erro) {
        if (overlay) overlay.style.display = 'none';
        if (typeof chamarAlertaTatico === 'function') {
          chamarAlertaTatico("ERRO AO LER PDF", "Não foi possível extrair o texto: " + erro.message, "OK");
        } else {
          alert("Erro ao ler PDF: " + erro.message);
        }
      } finally {
        loadingMsg.style.display = 'none';
        textArea.disabled = false;
        inputPdfUploadCustom.value = '';
      }
    });
  }

    // ── BOTÃO ESPECIAL: VINCULAR FOTOS DE PDFs EXISTENTES ──

          overlayPercent.innerText = "0%";

        }

        try {
          var listaFotosExtraidas = [];
          for (var f = 0; f < files.length; f++) {
            const file = files[f];
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
            var fullText = '';
            var fotoBase64 = null;

            for (var i = 1; i <= pdf.numPages; i++) {
              const page = await pdf.getPage(i);
              const content = await page.getTextContent();
              var lastY, text = '';
              for (var item of content.items) {
                if (lastY == item.transform[5] || !lastY) text += item.str;
                else text += '\n' + item.str;
                lastY = item.transform[5];
              }
              fullText += text + '\n';

              if (i === 1 && !fotoBase64) {
                try { fotoBase64 = await extrairFotoDePaginaPdf(page); } catch (errF) { }
              }
            }

            const numMandado = extrairNumeroMandadoBruto(fullText);
            if (numMandado && fotoBase64) {
              listaFotosExtraidas.push({
                mandado: numMandado,
                fotoBase64: fotoBase64
              });
            }

            const pct = Math.round(((f + 1) / files.length) * 100);
            if (overlaySub) overlaySub.innerHTML = "Lendo e cortando fotos: <strong>" + (f + 1) + "</strong> de <strong>" + files.length + "</strong> PDFs...";
            if (overlayBarra) overlayBarra.style.width = pct + "%";
            if (overlayPercent) overlayPercent.innerText = pct + "%";
          }

          if (listaFotosExtraidas.length === 0) {
            if (overlay) overlay.style.display = 'none';
            return chamarAlertaTatico("⚠️ NENHUMA FOTO ENCONTRADA", "Nenhum dos PDFs selecionados contém foto biométrica válida extraível ou o número do mandado não foi identificado.", "OK");
          }

          if (overlaySub) overlaySub.innerHTML = "Enviando e vinculando <strong>" + listaFotosExtraidas.length + "</strong> fotos no Google Drive e Banco de Dados...";

          google.script.run.withSuccessHandler(function(res) {
            if (overlay) overlay.style.display = 'none';
            if (res.sucesso) {
              if (res.resultados && Array.isArray(res.resultados)) {
                res.resultados.forEach(function(itemRes) {
                  if (itemRes.sucesso && itemRes.fotoUrl) {
                    var mObj = window.dadosMandados ? window.dadosMandados.find(function(d) { return d.mandado === itemRes.mandado; }) : null;
                    if (mObj) {
                      mObj.foto = itemRes.fotoUrl;
                      mObj.fotoUrl = itemRes.fotoUrl;
                    }
                  }
                });
              }
              if (typeof window.processarDados === 'function' && window.dadosMandados) {
                window.processarDados(window.dadosMandados);
              }
              chamarAlertaTatico("📷 FOTOS VINCULADAS COM SUCESSO!", res.mensagem + "\n\nAs fotos foram salvas na pasta do Google Drive e vinculadas aos mandados correspondentes!", "OK");
            } else {
              chamarAlertaTatico("⚠️ FALHA AO VINCULAR", res.mensagem, "OK");
            }
          }).withFailureHandler(function(err) {
            if (overlay) overlay.style.display = 'none';
            chamarAlertaTatico("FALHA TÁTICA", "Erro no servidor ao vincular fotos: " + err.message, "OK");
          }).vincularFotosLotePdfDrive(listaFotosExtraidas);

        } catch (errGlobal) {
          if (overlay) overlay.style.display = 'none';
          chamarAlertaTatico("ERRO AO PROCESSAR PDFs", errGlobal.message, "OK");
        } finally {
          inputPdfVincularFotos.value = '';
        }
      });
    }

    // Tratamento de colagem de texto via botão novo
    window.processarTextoColadoCustom = function() {
      const texto = textArea.value;
      if(texto.length < 50) return chamarAlertaTatico("FALTA INFORMAÇÃO", "Cole o texto do PDF oficial antes de extrair.", "OK");
      aplicarConfigsEProcessar([texto]);
      textArea.value = '';
    };

  })();
