  /* ================================================================
     MÓDULO 6: POLÍGONOS DE ÁREAS (BPM/CIA) E CACHE LOCAL (INDEXEDDB)
     ================================================================ */
  window.poligonosInstancias = [];
  let poligonosLabels = [];
  let poligonosVisiveis = true;
  let poligonosCarregados = false;

  const dbName = "SentinelaDB";
  const storeName = "Poligonos";

  function lerCachePoligonos(versaoServidor, callbackSucesso, callbackFalha) {
    if (!window.indexedDB) { callbackFalha(); return; }
    let request;
    try {
      request = indexedDB.open(dbName, 2);
    } catch (e) {
      callbackFalha(); return;
    }
    request.onupgradeneeded = function (e) {
      let db = e.target.result;
      if (!db.objectStoreNames.contains("Poligonos")) db.createObjectStore("Poligonos", { keyPath: "id" });
      if (!db.objectStoreNames.contains("Mandados")) db.createObjectStore("Mandados", { keyPath: "id" });
    };
    request.onsuccess = function (e) {
      let db = e.target.result;
      if (!db.objectStoreNames.contains("Poligonos")) { callbackFalha(); return; }
      try {
        let transaction = db.transaction(["Poligonos"], "readonly");
        let store = transaction.objectStore("Poligonos");
        let getRequest = store.get("dados_mapa");
        getRequest.onsuccess = function () {
          if (getRequest.result && String(getRequest.result.versao) === String(versaoServidor)) {
            callbackSucesso(getRequest.result.dados);
          } else {
            callbackFalha();
          }
        };
        getRequest.onerror = callbackFalha;
      } catch (err) { callbackFalha(); }
    };
    request.onerror = callbackFalha;
  }

  function salvarCachePoligonos(versaoServidor, dados) {
    if (!window.indexedDB) return;
    let request;
    try {
      request = indexedDB.open(dbName, 2);
    } catch (e) { return; }
    request.onupgradeneeded = function (e) {
      let db = e.target.result;
      if (!db.objectStoreNames.contains("Poligonos")) db.createObjectStore("Poligonos", { keyPath: "id" });
      if (!db.objectStoreNames.contains("Mandados")) db.createObjectStore("Mandados", { keyPath: "id" });
    };
    request.onsuccess = function (e) {
      let db = e.target.result;
      try {
        let transaction = db.transaction(["Poligonos"], "readwrite");
        let store = transaction.objectStore("Poligonos");
        store.put({ id: "dados_mapa", versao: String(versaoServidor), dados: dados });
      } catch (err) { }
    };
  }

  function carregarPoligonos(versaoServidor) {
    if (poligonosCarregados) return;

    var versaoCachePoligono = versaoServidor || "0"; // Vindo da checagem central se disponível

    var failsafePoligonos = setTimeout(function () {
      if (!poligonosCarregados) {
        if (typeof filtrarNoMapa === 'function') filtrarNoMapa();
        fecharTelaDeCarregamento();
      }
    }, 30000);

    lerCachePoligonos(versaoCachePoligono, function (dadosCache) {
      // SUCESSO: Dados lidos do Cache e versão bate.
      clearTimeout(failsafePoligonos);
      console.log("Polígonos lidos do HD/IndexedDB em ms!");
      processarDadosPoligonos(dadosCache);
    }, function () {
      // FALHA: Cache vazio ou versão desatualizada
      console.log("Baixando polígonos atualizados do Servidor...");
      google.script.run.withSuccessHandler(function (dados) {
        clearTimeout(failsafePoligonos);
        if (!dados || dados.length === 0) {
          if (typeof filtrarNoMapa === 'function') filtrarNoMapa();
          fecharTelaDeCarregamento();
          return;
        }
        salvarCachePoligonos(versaoCachePoligono, dados);
        processarDadosPoligonos(dados);
      }).withFailureHandler(function (err) {
        clearTimeout(failsafePoligonos);
        if (typeof filtrarNoMapa === 'function') filtrarNoMapa();
        fecharTelaDeCarregamento();
      }).obterPoligonos();
    });
  }

  function processarDadosPoligonos(dados) {
    if (poligonosCarregados) return;
    poligonosCarregados = true;

    // Renderizar com callback — só monta filtros quando TODOS os lotes terminarem
    renderizarPoligonos(dados, function () {
      adicionarBotaoPoligonos();
      montarFiltrosCPI();
      montarFiltrosBatalhao(false);

      // SEMPRE aplicar filtros de polígono
      var cpiVal = document.getElementById('filtroCPI') ? document.getElementById('filtroCPI').value : 'TODOS';
      var bpmVal = document.getElementById('filtroBatalhao') ? document.getElementById('filtroBatalhao').value : 'TODOS';
      var ciaVal = document.getElementById('filtroCIA') ? document.getElementById('filtroCIA').value : 'TODOS';
      var dpVal = document.getElementById('filtroDP') ? document.getElementById('filtroDP').value : 'TODOS';
      aplicarFiltrosDePoligono(cpiVal, bpmVal, ciaVal, dpVal);

      // Re-renderizar pinos com filtros atualizados (agora os polígonos estão prontos)
      if (typeof filtrarNoMapa === 'function' && dadosMandados.length > 0) {
        filtrarNoMapa();
      }

      // Se a posição do patrulheiro já estiver disponível, calcula a área e aplica o filtro antes de fechar a tela
      if (posicaoPatrulheiro && !_areaGpsAplicada) {
        atualizarBadgeAreaGPS();
      } else if (_gpsResolvido && !posicaoPatrulheiro && !_areaGpsAplicada) {
        _tentarExibirSemGPS();
      } else {
        fecharTelaDeCarregamento();
      }
      console.log('[Sentinela v2.4] Polígonos carregados e filtros aplicados');
    });
  }

  function renderizarPoligonos(dados, onComplete) {
    // Limpar anteriores
    poligonosInstancias.forEach(function (p) { p.polygon.setMap(null); });
    poligonosInstancias = [];

    // Processar em lotes para não travar a UI
    var LOTE = 50;
    var i = 0;

    function processarLote() {
      var fim = Math.min(i + LOTE, dados.length);
      for (; i < fim; i++) {
        try {
          let item = dados[i];
          let geo = JSON.parse(item.geoJson);
          if (!geo || !geo.coordinates) continue;

          var allPaths = [];
          if (geo.type === "MultiPolygon") {
            geo.coordinates.forEach(function (polygonRings) {
              polygonRings.forEach(function (ring) {
                allPaths.push(ring.map(function (coord) {
                  return { lat: coord[1], lng: coord[0] };
                }));
              });
            });
          } else {
            geo.coordinates.forEach(function (ring) {
              allPaths.push(ring.map(function (coord) {
                return { lat: coord[1], lng: coord[0] };
              }));
            });
          }

          var corHex = item.cor || '#3388ff';

          var polygon = new google.maps.Polygon({
            paths: allPaths,
            strokeColor: corHex,
            strokeOpacity: 0.9,
            strokeWeight: 2,
            fillColor: corHex,
            fillOpacity: 0.25,
            map: null,
            clickable: true,
            zIndex: 1
          });

          // EVENTO DE CLIQUE PARA IDENTIFICAÇÃO (PERFORMANCE MAXIMIZADA)
          if (!window.infoWindowPoligono) {
            window.infoWindowPoligono = new google.maps.InfoWindow();
          }

          polygon.addListener('click', function (e) {
            if (window.infoWindowPoligono) window.infoWindowPoligono.close();
            if (window.infoWindowAtiva) window.infoWindowAtiva.close();

            let fCPI = (document.getElementById('filtroCPI') || {}).value || 'TODOS';
            let fBPM = (document.getElementById('filtroBatalhao') || {}).value || 'TODOS';
            let nomeMostrar = "";

            if (fCPI === 'TODOS') {
              nomeMostrar = item.cpi;
              if (!nomeMostrar) nomeMostrar = item.batalhao && item.batalhao.toUpperCase().includes('CPA') ? "CPA GERAL" : item.batalhao;
            } else if (fBPM === 'TODOS') {
              nomeMostrar = item.batalhao;
            } else {
              nomeMostrar = item.cia;
            }
            if (!nomeMostrar) nomeMostrar = "Área Indefinida";

            let pos = e.latLng;
            if (!pos) {
              let path = this.getPath();
              if (path && path.getLength() > 0) {
                pos = path.getAt(0);
              } else {
                return;
              }
            }

            // Ocultar balão no Mobile quando se trata de Comando / CPI / CPA (visão macro)
            // Revertido a pedido do usuário (ele queria remover apenas o ícone de anexo, não a opção de clicar)

            if (!window.infoWindowPoligono) {
              window.infoWindowPoligono = new google.maps.InfoWindow();
            }

            window.infoWindowPoligono.setContent(
              '<div style="display:flex; flex-direction:column; gap:6px; padding:10px 12px; font-family:var(--font-sans, sans-serif); min-width:160px; align-items:center;">' +
              '<div style="display:flex; justify-content:center; align-items:center; gap:6px; font-size:10px; font-weight:900; color:var(--brand-red); text-transform:uppercase; letter-spacing:1px; border-bottom:1px solid rgba(255,255,255,0.15); padding-bottom:6px; width:100%;">' +
              '<span class="material-symbols-outlined" style="font-size:14px; color:var(--brand-red);">map</span> ÁREA' +
              '</div>' +
              '<div style="font-size:14px; font-weight:900; color:#ffffff; letter-spacing:0.5px; text-transform:uppercase; margin-top:4px; white-space:nowrap; text-align:center; text-shadow:0 0 8px rgba(255,255,255,0.3);">' +
              nomeMostrar +
              '</div>' +
              '</div>'
            );
            window.infoWindowPoligono.setPosition(pos);
            window.infoWindowPoligono.open(mapaPrincipal);
          });

          poligonosInstancias.push({
            polygon: polygon,
            cpi: item.cpi || "",
            batalhao: item.batalhao || "",
            cia: item.cia || "",
            delegacia: item.delegacia || "",
            cidade: item.cidade || "",
            cor: corHex
          });
        } catch (e) {
          console.error("Erro ao renderizar polígono:", e);
        }
      }

      if (i < dados.length) {
        setTimeout(processarLote, 0);
      } else {
        // Todos os lotes terminaram — executar callback
        if (onComplete) onComplete();
      }
    }

    processarLote();
  }

  function togglePoligonos() {
    poligonosVisiveis = !poligonosVisiveis;
    aplicarFiltrosDePoligono(
      document.getElementById('filtroCPI') ? document.getElementById('filtroCPI').value : 'TODOS',
      document.getElementById('filtroBatalhao') ? document.getElementById('filtroBatalhao').value : 'TODOS',
      document.getElementById('filtroCIA') ? document.getElementById('filtroCIA').value : 'TODOS',
      document.getElementById('filtroDP') ? document.getElementById('filtroDP').value : 'TODOS'
    );
    var btn = document.getElementById('btnTogglePoligonos');
    if (btn) {
      var icon = btn.querySelector('span');
      if (poligonosVisiveis) {
        icon.style.color = 'var(--success)';
        icon.style.textShadow = '0 0 8px rgba(46, 204, 113, 0.4)';
      } else {
        icon.style.color = 'var(--text-secondary)';
        icon.style.textShadow = 'none';
      }
    }
  }

  // Paleta de cores VIBRANTES ampliada (70+ cores) para diferenciar TODOS os CPIs e CPA-Ms sem repetir
  const paletaAmplaCores = [
    '#F44336', '#9C27B0', '#3F51B5', '#03A9F4', '#009688', '#8BC34A', '#FFEB3B', '#FF9800', '#795548', '#607D8B',
    '#E91E63', '#673AB7', '#2196F3', '#00BCD4', '#4CAF50', '#CDDC39', '#FFC107', '#FF5722', '#9E9E9E', '#B71C1C',
    '#880E4F', '#4A148C', '#311B92', '#1A237E', '#0D47A1', '#01579B', '#006064', '#004D40', '#1B5E20', '#33691E',
    '#827717', '#F57F17', '#FF6F00', '#E65100', '#BF360C', '#3E2723', '#424242', '#263238', '#FF5252', '#FF4081',
    '#E040FB', '#7C4DFF', '#536DFE', '#40C4FF', '#18FFFF', '#64FFDA', '#69F0AE', '#B2FF59', '#EEFF41', '#FFFF00',
    '#FFD740', '#FFAB40', '#FF6E40', '#D50000', '#C51162', '#AA00FF', '#6200EA', '#304FFE', '#0091EA', '#00B8D4',
    '#00BFA5', '#00C853', '#64DD17', '#AEEA00', '#FFD600', '#FF6D00', '#DD2C00'
  ];

  function stringToColorHash(str) {
    let hash = 0;
    for (let i = 0; i < str.length; i++) {
      hash = str.charCodeAt(i) + ((hash << 5) - hash);
    }
    const c = (hash & 0x00FFFFFF).toString(16).toUpperCase();
    return '#' + '00000'.substring(0, 6 - c.length) + c;
  }

  function aplicarFiltrosDePoligono(filtroCPI, filtroBPM, filtroCIA, filtroDP) {
    let overlay = document.getElementById('mapStatusOverlay');
    let overlayText = document.getElementById('mapStatusText');

    if (poligonosLabels && poligonosLabels.length > 0) {
      poligonosLabels.forEach(function (l) { l.map = null; });
    }
    poligonosLabels = [];

    if (!poligonosVisiveis) {
      poligonosInstancias.forEach(function (p) { p.polygon.setMap(null); });
      if (overlay) overlay.style.display = 'none';
      return;
    }

    if (overlay && overlayText) {
      let parts = [];
      if (filtroCPI !== 'TODOS') parts.push(filtroCPI);
      if (filtroBPM !== 'TODOS') parts.push(filtroBPM);
      if (filtroCIA !== 'TODOS') parts.push(filtroCIA);

      const elDP = document.getElementById('filtroDP');
      if (elDP && elDP.value !== 'TODOS') parts.push(elDP.value);

      if (parts.length > 0) {
        overlayText.textContent = parts.join(' | ');
        overlay.style.display = 'flex';
      } else {
        overlay.style.display = 'none';
      }
    }

    let coresAtribuidas = {};
    let corIndex = 0;

    function obterCorDinamica(chave) {
      if (!chave || chave.trim() === "") chave = "SEM_DEFINICAO";
      if (!coresAtribuidas[chave]) {
        if (corIndex < paletaAmplaCores.length) {
          coresAtribuidas[chave] = paletaAmplaCores[corIndex];
          corIndex++;
        } else {
          coresAtribuidas[chave] = stringToColorHash(chave);
        }
      }
      return coresAtribuidas[chave];
    }

    poligonosInstancias.forEach(function (p) {
      let matchCPI = (filtroCPI === 'TODOS' || p.cpi === filtroCPI);
      let matchBPM = (filtroBPM === 'TODOS' || p.batalhao === filtroBPM);
      let matchCIA = (filtroCIA === 'TODOS' || p.cia === filtroCIA);
      let matchDP = (!filtroDP || filtroDP === 'TODOS' || p.delegacia === filtroDP);

      if (matchCPI && matchBPM && matchCIA && matchDP) {
        var corBase;

        if (filtroCPI === 'TODOS') {
          let macroAgrupamento = p.cpi;
          if (!macroAgrupamento) {
            if (p.batalhao && p.batalhao.toUpperCase().includes('CPA')) {
              macroAgrupamento = "CPA GERAL";
            } else {
              macroAgrupamento = p.batalhao || "OUTROS";
            }
          }
          corBase = obterCorDinamica(macroAgrupamento);

        } else if (filtroBPM === 'TODOS') {
          corBase = obterCorDinamica(p.batalhao || "BPM_NULO");
        } else if (filtroCIA === 'TODOS') {
          corBase = obterCorDinamica(p.cia || "CIA_NULA");
        } else {
          corBase = p.cor || '#3388ff';
        }

        if (p._corAtual !== corBase || p.polygon.getMap() !== mapaPrincipal) {
          p._corAtual = corBase;
          p.polygon.setOptions({
            fillColor: corBase,
            strokeColor: corBase,
            fillOpacity: 0.25,
            strokeOpacity: 0.9,
            strokeWeight: 2
          });
          p.polygon.setMap(mapaPrincipal);
        }
      } else {
        if (p.polygon.getMap() !== null) {
          p.polygon.setMap(null);
        }
      }
    });
  }

  function adicionarBotaoPoligonos() {
    if (document.getElementById('btnTogglePoligonos')) return;

    // Buscar o layersPanel (painel dentro do layersWrapper em LEFT_BOTTOM)
    var controls = mapaPrincipal.controls[google.maps.ControlPosition.LEFT_BOTTOM];
    if (controls && controls.getLength() > 0) {
      var layersWrapper = controls.getAt(0);
      // O layersPanel é o segundo filho do layersWrapper (primeiro é o btnLayers)
      var layersPanel = layersWrapper.querySelector('div');
      if (!layersPanel) return;

      var btnPoligonos = document.createElement('button');
      btnPoligonos.id = 'btnTogglePoligonos';
      btnPoligonos.innerHTML = '<span class="material-symbols-outlined" style="font-size:20px;color:var(--success);text-shadow:0 0 8px rgba(46, 204, 113, 0.4);">hexagon</span>';
      btnPoligonos.title = 'Áreas BPM/CIA';
      btnPoligonos.style.cssText = 'display:flex;align-items:center;justify-content:center;width:44px;height:38px;border:none;border-radius:99px;cursor:pointer;background:transparent;box-shadow:none;transition:all 0.3s;font-family:var(--font-sans);';
      btnPoligonos.onclick = togglePoligonos;

      layersPanel.appendChild(btnPoligonos);
    }
  }
</script>
