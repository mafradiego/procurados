<script>
/* ================================================================
     MÓDULO 4: CARD DE INTELIGÊNCIA (NEUMÓRFICO)
     ================================================================ */
  function montarCardInteligencia(alvo) {
    // Função helper para evitar XSS (Sanitização)
    const escapeHTML = function(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    };

    const btnCopiar = function(txt) {
      if (!txt || txt === "N/A") return "";
      const txtSeguro = escapeHTML(txt);
      return '<span class="icone-copiar" onclick="copiarDadoTatico(\'' + txtSeguro + '\', this)" title="Copiar"><span class="material-symbols-outlined" style="font-size:14px;">content_copy</span></span>';
    };

    let extras = {};
    try { extras = JSON.parse(alvo.dadosExtrasJSON || "{}"); } catch(e) {}

    const isValido = function(val) {
      if (!val) return false;
      const v = val.trim().toLowerCase();
      return !["", "n/a", "-", "não", "nao", "não informado", "nao informado", "não informada", "nao informada", "não consta", "nao consta"].includes(v);
    };

    // Classificar crime
    const crimeInfo = classificarCrime(alvo.infoProcessuais || '');

    // Dias restantes para validade
    const diasRestantes = calcularDiasRestantes(alvo.validade);
    let validadeClass = '';
    let validadeTexto = '';
    // Helper: converte dias para "X ano(s), Y mês(es) e Z dia(s)"
    const formatarDiasRestantes = function(dias) {
      if (dias <= 0) return Math.abs(dias) + ' dias';
      const anos = Math.floor(dias / 365);
      const meses = Math.floor((dias % 365) / 30);
      const d = dias % 30;
      let parts = [];
      if (anos > 0) parts.push(anos + (anos === 1 ? ' ano' : ' anos'));
      if (meses > 0) parts.push(meses + (meses === 1 ? ' mês' : ' meses'));
      if (d > 0 || parts.length === 0) parts.push(d + (d === 1 ? ' dia' : ' dias'));
      return parts.join(', ');
    };
    if (diasRestantes !== null) {
      const limVerde = parseInt(configsSistema.validade_verde_dias) || 91;
      const limAmarelo = parseInt(configsSistema.validade_amarelo_dias) || 90;
      const limLaranja = parseInt(configsSistema.validade_laranja_dias) || 30;
      const limVermelho = parseInt(configsSistema.validade_vermelho_dias) || 15;
      const textoFormatado = formatarDiasRestantes(diasRestantes);

      if (diasRestantes <= 0) { validadeClass = 'validade-vencido'; validadeTexto = '<span class="material-symbols-outlined" style="font-size:12px;vertical-align:middle;">warning</span> VENCIDO há ' + textoFormatado; }
      else if (diasRestantes <= limVermelho) { validadeClass = 'validade-vermelho'; validadeTexto = '<span class="material-symbols-outlined" style="font-size:12px;vertical-align:middle;">error</span> Faltam ' + textoFormatado; }
      else if (diasRestantes <= limLaranja) { validadeClass = 'validade-laranja'; validadeTexto = '<span class="material-symbols-outlined" style="font-size:12px;vertical-align:middle;">schedule</span> Faltam ' + textoFormatado; }
      else if (diasRestantes <= limAmarelo) { validadeClass = 'validade-amarelo'; validadeTexto = '<span class="material-symbols-outlined" style="font-size:12px;vertical-align:middle;">timer</span> Faltam ' + textoFormatado; }
      else { validadeClass = 'validade-verde'; validadeTexto = '<span class="material-symbols-outlined" style="font-size:12px;vertical-align:middle;">check_circle</span> ' + textoFormatado; }
    }

    // Tooltip helper
    const tooltip = function(texto) {
      const t = configsSistema['tooltip_' + texto] || texto;
      return '<span class="tooltip-trigger">?<span class="tooltip-balloon">' + t + '</span></span>';
    };

    // ── CONSTRUÇÃO E ORDENAÇÃO DOS ENDEREÇOS MAPEADOS DO CARD ──
    const montarAreaBadge = function(areaData) {
      if (!areaData) return '';
      if (areaData.cpi === "FORA DO ESTADO") {
        return '<div style="display:flex;margin-top:4px;"><span style="font-size:9px;font-weight:800;color:var(--danger);padding:3px 8px;background:rgba(255,59,48,0.15);border-radius:3px;border:1px solid rgba(255,59,48,0.3);">FORA DO ESTADO</span></div>';
      }
      let rawCpi = areaData.cpi || areaData.cpiArea || '';
      let limpoCpi = String(rawCpi).trim().replace(/^CPM-/i, '').replace(/CPM-CPA/gi, 'CPA');
      let rotuloCpi = (/CPA|CPAM/i.test(rawCpi) || /CPA|CPAM/i.test(limpoCpi)) ? 'CPA' : 'CPI';
      let cpiVal = (limpoCpi && limpoCpi !== 'N/A') ? limpoCpi : '';
      let btlVal = (areaData.batalhao || areaData.bpmArea || '').trim();
      if (btlVal === 'N/A') btlVal = '';
      let ciaVal = (areaData.cia || areaData.ciaArea || '').trim();
      if (ciaVal === 'N/A') ciaVal = '';

      let sLat = Number(areaData.lat || areaData.latitude || 0);
      let sLng = Number(areaData.lng || areaData.longitude || 0);

      if ((!cpiVal || !btlVal || !ciaVal) && !isNaN(sLat) && sLat !== 0 && !isNaN(sLng) && sLng !== 0) {
        if (typeof identificarAreaPorCoordenadas === 'function') {
          try {
            let areaLoc = identificarAreaPorCoordenadas(sLat, sLng);
            if (areaLoc) {
              if (!cpiVal && areaLoc.cpi) {
                rawCpi = areaLoc.cpi;
                limpoCpi = String(rawCpi).trim().replace(/^CPM-/i, '').replace(/CPM-CPA/gi, 'CPA');
                rotuloCpi = (/CPA|CPAM/i.test(rawCpi) || /CPA|CPAM/i.test(limpoCpi)) ? 'CPA' : 'CPI';
                cpiVal = limpoCpi;
              }
              if (!btlVal && areaLoc.batalhao) btlVal = areaLoc.batalhao;
              if (!ciaVal && areaLoc.cia) ciaVal = areaLoc.cia;
            }
          } catch(e) {}
        }
      }

      if (!cpiVal && !btlVal && !ciaVal) return '';

      let h = '<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;">';
      if (cpiVal) h += `<span style="font-size:9px;font-weight:900;color:#fca5a5;padding:2px 6px;background:rgba(239,68,68,0.15);border-radius:4px;border:1px solid rgba(239,68,68,0.5);">${rotuloCpi}: ${cpiVal}</span>`;
      if (btlVal) h += `<span style="font-size:9px;font-weight:900;color:#fde047;padding:2px 6px;background:rgba(251,191,36,0.15);border-radius:4px;border:1px solid rgba(251,191,36,0.5);">BTL: ${btlVal}</span>`;
      if (ciaVal) h += `<span style="font-size:9px;font-weight:900;color:#86efac;padding:2px 6px;background:rgba(34,197,94,0.15);border-radius:4px;border:1px solid rgba(34,197,94,0.5);">CIA: ${ciaVal}</span>`;
      h += '</div>';
      return h;
    };

    let todosEnderecosList = [];

    // 1. Endereço Principal
    let pLat = Number(alvo.latPrincipal);
    if (isNaN(pLat) || pLat === 0) pLat = (!alvo._isSecundarioClone ? Number(alvo.lat || 0) : 0);
    let pLng = Number(alvo.lngPrincipal);
    if (isNaN(pLng) || pLng === 0) pLng = (!alvo._isSecundarioClone ? Number(alvo.lng || 0) : 0);

    let pKm = 999999;
    if (posicaoPatrulheiro && !isNaN(pLat) && pLat !== 0 && !isNaN(pLng) && pLng !== 0) {
      pKm = calcularHaversine(posicaoPatrulheiro.lat, posicaoPatrulheiro.lng, pLat, pLng);
    }

    todosEnderecosList.push({
      isPrincipal: true,
      isClicked: !alvo._isSecundarioClone,
      rotulo: "Endereço Principal",
      endereco: alvo.enderecoPrincipal || "Não informado",
      lat: pLat,
      lng: pLng,
      km: pKm,
      areaData: { cpi: alvo.cpiArea || alvo.cpi, batalhao: alvo.batalhao || alvo.bpmArea, cia: alvo.ciaArea, lat: pLat, lng: pLng }
    });

    // 2. Endereços Secundários
    try {
      let rawSecCard = alvo.geodataSecundarios || alvo.secundarios || [];
      let listaSec = Array.isArray(rawSecCard) ? rawSecCard : (typeof rawSecCard === 'string' ? (function() { try { return JSON.parse(rawSecCard); } catch (e) { return []; } })() : []);
      
      const normEndStr = function(str) {
        if (!str) return "";
        return String(str).toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^\w\s]/gi, '').replace(/\s+/g, ' ').trim();
      };

      let endsVistosSet = new Set();
      if (alvo.enderecoPrincipal) endsVistosSet.add(normEndStr(alvo.enderecoPrincipal));

      let secCont = 1;
      listaSec.forEach(function(sec) {
        let sObj = (typeof sec === 'string') ? { endereco: sec } : (sec || {});
        let sEnd = sObj.endereco || sObj.texto || (typeof sec === 'string' ? sec : 'Endereço secundário');
        let sEndNorm = normEndStr(sEnd);

        let sLat = Number(sObj.lat || sObj.latitude || 0);
        let sLng = Number(sObj.lng || sObj.longitude || 0);

        let foiClicado = false;
        if (alvo._isSecundarioClone) {
          if (alvo._secundarioEnd && normEndStr(alvo._secundarioEnd) === sEndNorm) foiClicado = true;
          else if (!isNaN(sLat) && sLat !== 0 && sLat === Number(alvo.lat) && sLng === Number(alvo.lng)) foiClicado = true;
        }

        // Se o endereço for idêntico a um já exibido no card e NÃO for o clicado, ignorar duplicata
        if (sEndNorm && endsVistosSet.has(sEndNorm) && !foiClicado) return;
        if (sEndNorm) endsVistosSet.add(sEndNorm);

        let sKm = 999999;
        if (posicaoPatrulheiro && !isNaN(sLat) && sLat !== 0 && !isNaN(sLng) && sLng !== 0) {
          sKm = calcularHaversine(posicaoPatrulheiro.lat, posicaoPatrulheiro.lng, sLat, sLng);
        }

        todosEnderecosList.push({
          isPrincipal: false,
          isClicked: foiClicado,
          rotulo: 'Outro Endereço ' + secCont,
          endereco: sEnd,
          lat: sLat,
          lng: sLng,
          km: sKm,
          areaData: sObj
        });
        secCont++;
      });
    } catch(e) { console.error("Erro ao ler endereços secundários no card:", e); }

    // Ordenar endereços:
    // 1º: O pino que foi clicado no mapa/lista (isClicked === true)
    // 2º em diante: Ordenados por KM de distância (do mais próximo ao mais distante). Se empate, Principal primeiro.
    todosEnderecosList.sort(function(a, b) {
      if (a.isClicked && !b.isClicked) return -1;
      if (!a.isClicked && b.isClicked) return 1;
      if (a.km !== b.km) return a.km - b.km;
      if (a.isPrincipal && !b.isPrincipal) return -1;
      if (!a.isPrincipal && b.isPrincipal) return 1;
      return 0;
    });

    // Renderizar a lista unificada e destacada de endereços
    let htmlListaEnderecosCompleta = "";
    todosEnderecosList.forEach(function(item) {
      let isValCoord = !isNaN(item.lat) && item.lat !== 0 && !isNaN(item.lng) && item.lng !== 0;
      
      let kmBadgeHtml = '';
      if (item.km < 999999) {
        kmBadgeHtml = '<div class="km-badge" style="font-size:10px;padding:3px 8px;margin-left:auto;display:inline-flex;align-items:center;gap:3px;"><span class="material-symbols-outlined" style="font-size:13px;">near_me</span> ' + item.km.toFixed(1) + ' km</div>';
      }

      let areaHtml = montarAreaBadge(item.areaData);

      let btnRotaHtml = isValCoord ?
        '<button class="btn-rota" style="background:' + (item.isClicked ? '#f59e0b' : (item.isPrincipal ? '#ef4444' : '#3b82f6')) + ';color:#fff;border:none;padding:7px 12px;border-radius:6px;font-weight:800;display:inline-flex;align-items:center;gap:4px;cursor:pointer;font-size:11px;" onclick="abrirGpsNativo(' + item.lat + ', ' + item.lng + ')"><span class="material-symbols-outlined" style="font-size:15px;">directions_car</span> ROTA</button>' +
        '<button class="btn-rota" style="background:#FBBC04;color:#1a1a1a;border:none;padding:7px 12px;border-radius:6px;font-weight:800;display:inline-flex;align-items:center;gap:4px;cursor:pointer;font-size:11px;" onclick="abrirStreetView(' + item.lat + ', ' + item.lng + ')" title="Street View"><svg width="15" height="15" viewBox="0 0 24 24" fill="#1a1a1a"><path d="M12.56 14.33c-.34.27-.56.7-.56 1.17V21h7c1.1 0 2-.9 2-2v-5.98c-.94-.33-1.95-.52-3-.52-2.03 0-3.93.7-5.44 1.83zM12 6c1.93 0 3.5-1.57 3.5-3.5S13.93-1 12-1 8.5.57 8.5 2.5 10.07 6 12 6zm-1.44 8.33C9.07 12.93 7.14 12.23 5 12.23c-1.05 0-2.06.19-3 .52V19c0 1.1.9 2 2 2h7v-5.5c0-.47-.22-.9-.56-1.17l-.88-.67zM12 8c-1.66 0-3 1.34-3 3 0 .35.07.69.18 1.01L12 14.34l2.82-2.33c.11-.32.18-.66.18-1.01 0-1.66-1.34-3-3-3z"/></svg> STREET</button>' +
        '<button class="btn-rota" style="background:#10b981;color:#fff;border:none;padding:7px 12px;border-radius:6px;font-weight:800;display:inline-flex;align-items:center;gap:4px;cursor:pointer;font-size:11px;" onclick="focarPinoPorCoordenadas(' + item.lat + ', ' + item.lng + ', \'' + (alvo.mandado || '').replace(/'/g, "\\'") + '\')"><span class="material-symbols-outlined" style="font-size:15px;">my_location</span> VER NO MAPA</button>' : '';

      // Estilização tática dos cards:
      // 1. Pino Clicado: borda amarela de alerta com brilho e tag de evidência
      // 2. Endereço Principal: borda vermelha completa de destaque com tag clara
      // 3. Outros secundários: borda sutil
      let cardStyle = '';
      let badgeTag = '';

      if (item.isClicked && !item.isPrincipal) {
        cardStyle = 'background: linear-gradient(135deg, rgba(245, 158, 11, 0.16), rgba(245, 158, 11, 0.05)); border: 2px solid #f59e0b; border-radius: 12px; padding: 12px; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.25); margin-bottom: 10px; position:relative;';
        badgeTag = '<span style="background:#f59e0b;color:#1a1a1a;font-size:9px;font-weight:900;padding:3px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:0.5px;display:inline-flex;align-items:center;gap:4px;"><span class="material-symbols-outlined" style="font-size:13px;">location_searching</span> PINO CLICADO NO MAPA</span>';
      } else if (item.isPrincipal) {
        let borderCol = '#ef4444';
        let bgGradient = item.isClicked ? 
          'linear-gradient(135deg, rgba(239, 68, 68, 0.22), rgba(239, 68, 68, 0.08))' : 
          'linear-gradient(135deg, rgba(239, 68, 68, 0.15), rgba(239, 68, 68, 0.05))';
        cardStyle = 'background: ' + bgGradient + '; border: 2px solid ' + borderCol + '; border-radius: 12px; padding: 12px; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3); margin-bottom: 10px; position:relative;';
        badgeTag = '<span style="background:#ef4444;color:#ffffff;font-size:9px;font-weight:900;padding:3px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:0.5px;display:inline-flex;align-items:center;gap:4px;"><span class="material-symbols-outlined" style="font-size:13px;">home_pin</span> ENDEREÇO PRINCIPAL' + (item.isClicked ? ' (CLICADO)' : '') + '</span>';
      } else {
        cardStyle = 'background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 10px; padding: 10px; margin-bottom: 8px;';
        badgeTag = '<span style="background:rgba(255, 255, 255, 0.1);color:var(--text-secondary);font-size:9px;font-weight:800;padding:2px 6px;border-radius:4px;text-transform:uppercase;">' + item.rotulo + '</span>';
      }

      htmlListaEnderecosCompleta += '<div style="' + cardStyle + '">' +
        '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">' +
          badgeTag +
          kmBadgeHtml +
        '</div>' +
        '<div class="endereco-texto" style="font-size:12px;line-height:1.4;margin-bottom:6px;"><strong>' + (item.isPrincipal ? 'Endereço Principal:' : item.rotulo + ':') + '</strong> ' + item.endereco + btnCopiar(item.endereco) + '</div>' +
        areaHtml +
        '<div style="display:flex;gap:6px;margin-top:8px;">' + btnRotaHtml + '</div>' +
      '</div>';
    });

    // Validade formatada
    let strValidade = alvo.validade || "";
    let dataPura = strValidade.match(/(\d{2}[\/\.]\d{2}[\/\.]\d{4})/);
    dataPura = dataPura ? dataPura[1].replace(/\./g, '/') : strValidade;

    // Perfil
    var calcIdade = function(dataStr) {
      if (!dataStr || typeof dataStr !== 'string') return '';
      var s = dataStr.trim();
      if (!s || s === 'N/A' || s === '-' || s === 'Não informado' || s === 'Não consta') return '';
      var dia, mes, ano;
      var mBR = s.match(/^(\d{1,2})[\/\.](\d{1,2})[\/\.](\d{4})/);
      if (mBR) {
        dia = parseInt(mBR[1], 10);
        mes = parseInt(mBR[2], 10);
        ano = parseInt(mBR[3], 10);
      } else {
        var mISO = s.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
        if (mISO) {
          ano = parseInt(mISO[1], 10);
          mes = parseInt(mISO[2], 10);
          dia = parseInt(mISO[3], 10);
        }
      }
      if (!dia || !mes || !ano || isNaN(dia) || isNaN(mes) || isNaN(ano)) return '';
      var hoje = new Date();
      var id = hoje.getFullYear() - ano;
      var m = (hoje.getMonth() + 1) - mes;
      if (m < 0 || (m === 0 && hoje.getDate() < dia)) id--;
      return (id >= 0 && id < 130) ? ' <span style="color:#fbbf24; font-weight:800; font-size:11px;">(' + id + ' anos)</span>' : '';
    };

    let htmlPerfil = '';
    const addP = function(lbl, val) { if (isValido(val)) htmlPerfil += '<div style="margin:0;padding:2px 0;"><strong>' + lbl + ':</strong> ' + val + '</div>'; };
    addP("Nome Social", extras.nomeSocial); addP("RJI", extras.rji); addP("Alcunha", extras.alcunha);
    let strNasc = isValido(alvo.nascimento) ? (alvo.nascimento + calcIdade(alvo.nascimento)) : '';
    addP("Nasc", strNasc); addP("Sexo", alvo.sexo); addP("Cor", alvo.cor);
    addP("Natural", alvo.naturalidade); addP("Filiação", alvo.filiacao); addP("Marcas", extras.marcas);

    // Info Processual
    
    const infoRaw = alvo.infoProcessuais || "";
    const extP = function(txt, lbl) { const r = new RegExp(lbl + '\\s*([^|\\n]+)', 'i'); const m = txt.match(r); return m ? m[1].trim() : "N/A"; };
    const nProcesso = extP(infoRaw, '(?:Nº do processo|Processo):');
    const orgao = extP(infoRaw, 'Órgão Judicial:');
    let especie = extP(infoRaw, 'Espécie(?: de| da) (?:prisão|Internação):');
    if (especie === "N/A") especie = extP(infoRaw, 'Espécie de prisão:');

    // Parse multiple laws and multiple articles/paragraphs (desmembrados em listaCrimes)
    let crInfoGlobal = classificarCrime(infoRaw);
    let listaCrimes = (crInfoGlobal && crInfoGlobal.todosCrimes && crInfoGlobal.todosCrimes.length > 0)
      ? crInfoGlobal.todosCrimes
      : [];

    // Se por algum motivo todosCrimes não veio, criar fallback a partir de splitLeis
    if (listaCrimes.length === 0) {
      let splitLeis = infoRaw.split(/(?=Lei:)/gi);
      splitLeis.forEach(b => {
        if (b.trim().toLowerCase().startsWith('lei:')) {
          let cSub = classificarCrime(b);
          listaCrimes.push({
            lei: extP(b, 'Lei:'),
            artigo: extP(b, 'Artigo:'),
            paragrafo: extP(b, 'Parágrafo:'),
            inciso: extP(b, 'Inciso:'),
            nome: cSub.nome,
            cor: cSub.cor,
            tipificacaoCompleta: cSub.tipificacaoCompleta,
            leiNome: cSub.leiNome,
            naoClassificado: cSub.naoClassificado
          });
        }
      });
    }

    let htmlTipificacoes = '';
    let badgesHtml = '';
    
    listaCrimes.forEach((cItem, idx) => {
      let lei = cItem.lei || extP(infoRaw, 'Lei:');
      let artigo = cItem.artigo || extP(infoRaw, 'Artigo:');
      let paragrafo = cItem.paragrafo || extP(infoRaw, 'Parágrafo:');
      let inciso = cItem.inciso || extP(infoRaw, 'Inciso:');
      let espExtr = extP(infoRaw, 'Espécie de prisão:');

      // Se for Prisão Civil / Pensão Alimentícia (CPC 13105 / Art. 528)
      let isPensaoCivil = (artigo === '528') || 
                          (lei && (lei.toUpperCase().includes('PROCESSO CIVIL') || lei.toUpperCase().includes('13105') || lei.toUpperCase().includes('CPC'))) ||
                          (espExtr && (espExtr.toUpperCase().includes('CIVIL') || espExtr.toUpperCase().includes('CÍVEL') || espExtr.toUpperCase().includes('ALIMENTO')));

      if (isPensaoCivil) {
        lei = '13105';
        if (!isValido(artigo) || artigo === '-') artigo = '528';
      }

      if (lei !== "N/A" && lei.toLowerCase().includes("art")) {
        let mP = lei.match(/§\s*(.+)$/); if (mP && paragrafo === "N/A") paragrafo = mP[1].trim();
        let mA = lei.match(/art\.?\s*([^,§|]+)(?:,\s*([^,§|]+))?(?:,\s*([^,§|]+))?(?:,\s*([^,§|]+))?/i); 
        if (mA) {
           if (artigo === "N/A" && mA[1]) artigo = mA[1].trim();
           if (paragrafo === "N/A" && mA[2] && mA[2].trim() !== '') paragrafo = mA[2].trim();
           if (inciso === "N/A" && mA[3] && mA[3].trim() !== '') {
              if (mA[4] && mA[4].trim() !== '') { inciso = mA[3].trim() + ", " + mA[4].trim(); } 
              else { inciso = mA[3].trim(); }
           }
        }
        lei = lei.split(/(?:,|\s)\s*art\.?/i)[0].trim();
      }
      if (paragrafo !== "N/A" && paragrafo !== "-" && (inciso === "N/A" || inciso === "-")) {
        var mIncisoEmbutido = paragrafo.match(/^(?:§\s*)?(\d+[ºª°]?(?:-[A-Z])?|caput|c)[\s,]+([a-z]|[IVXLCDM]{1,5}(?:\s*,\s*[IVXLCDM]{1,5})*)$/i);
        if (mIncisoEmbutido) {
