<script>
/* ================================================================
     MÓDULO 1: VARIÁVEIS GLOBAIS E ESTADO
     ================================================================ */
  let mapaPrincipal;
  var dadosMandados = [];
  let listaMarcadores = [];
  let infoWindowAtiva = null;
  let usuarioLogado = null;
  let perfilUsuario = '';
  let dadosTemporariosCadastro = null;
  let pinosPreview = [];
  let fotoBase64Temporaria = null;
  let posicaoPatrulheiro = null;
  let watchPositionId = null;
  let configsSistema = {};
  let secundariosVisiveis = {}; // { mandado: { markers: [], polylines: [] } }
  let lastPendingCount = -1; // Para notificar novos cadastros (-1 indica estado inicial)
  let _gpsResolvido = false; // Indica se o GPS já respondeu (sucesso ou falha)
  let _dadosCarregados = false; // Indica se os mandados já foram carregados do servidor
  let _tabelaLeisCarregada = false; // Indica se a tabela de classificação de crimes foi carregada
  let _semGpsJaExibiu = false; // Evita chamadas duplicadas de _tentarExibirSemGPS
  let _areaGpsAplicada = false; // Indica que a área e polígono do GPS já foram aplicados no mapa

  // RASTREADOR DE ATIVIDADE (Heartbeat Controlado)
  let timestampUltimaAtividade = Date.now();
  
  document.addEventListener('mousemove', () => { timestampUltimaAtividade = Date.now(); }, { passive: true });
  document.addEventListener('keydown', () => { timestampUltimaAtividade = Date.now(); }, { passive: true });
  document.addEventListener('touchstart', () => { timestampUltimaAtividade = Date.now(); }, { passive: true });
  
  setInterval(() => {
    if (usuarioLogado && usuarioLogado.autorizado) {
      // Se houve movimento na tela nos últimos 15 segundos
      if ((Date.now() - timestampUltimaAtividade) < 15000) {
        google.script.run.registrarHeartbeat();
      }
    }
  }, 15000);

  /* ================================================================
     MÓDULO 2: AUTENTICAÇÃO E INICIALIZAÇÃO
     ================================================================ */
  function iniciarMapa() {
    const lblStatus = document.getElementById("txt-status-carregamento");
    if (lblStatus) lblStatus.innerText = "VERIFICANDO CREDENCIAIS...";

    // Carregar configs primeiro, depois verificar acesso
    google.script.run.withSuccessHandler(function(configs) {
      configsSistema = configs;
      aplicarConfigsDinamicas(configs);
      if (lblStatus) lblStatus.innerText = "VERIFICANDO PERMISSÕES DE ACESSO...";
      google.script.run.withSuccessHandler(avaliarAcessoSistema).verificarAcessoUsuario();
    }).obterConfiguracoesSimples();
  }
  window._iniciarMapaReal = iniciarMapa;

  function avaliarAcessoSistema(resposta) {
    const boxCarregando = document.getElementById("seg-estado-carregando");
    const telaSeguranca = document.getElementById("tela-seguranca");
    const lblStatus = document.getElementById("txt-status-carregamento");

    if (resposta.autorizado) {
      iniciarMonitoramentoSessaoAtiva();
      if (lblStatus) lblStatus.innerText = "CARREGANDO OS MANDADOS E O MAPA...";
      usuarioLogado = resposta;
      perfilUsuario = resposta.perfil || '';

      // Inicializar Firebase (após autenticação confirmada)
      if (typeof window.initFirebase === 'function') {
        try { window.initFirebase(); } catch(e) { console.warn('[Firebase] Init falhou:', e.message); }
      }

      // Nota: telaSeguranca será escondida apenas após o carregamento dos mandados no JS_Map.html

      // Atualizar sidebar
      var nomeEl = document.getElementById('sidebarNomeEl');
      var perfilEl = document.getElementById('sidebarPerfilEl');
      var emailEl = document.getElementById('sidebarEmailEl');

      if (nomeEl) nomeEl.textContent = resposta.nome || 'Operador';
      if (emailEl) {
        emailEl.textContent = resposta.email || '';
        emailEl.title = resposta.email || '';
      }

      if (perfilEl) {
        var perfText = (resposta.perfil || 'Operador').trim();
        perfilEl.textContent = perfText;
        var perfNorm = perfText.toLowerCase();

        if (perfNorm.includes('admin')) {
          perfilEl.style.color = '#fca5a5';
          perfilEl.style.background = 'rgba(239, 68, 68, 0.2)';
          perfilEl.style.border = '1px solid rgba(239, 68, 68, 0.6)';
          perfilEl.style.boxShadow = '0 0 8px rgba(239, 68, 68, 0.3)';
        } else if (perfNorm.includes('colaborador')) {
          perfilEl.style.color = '#93c5fd';
          perfilEl.style.background = 'rgba(59, 130, 246, 0.2)';
          perfilEl.style.border = '1px solid rgba(59, 130, 246, 0.6)';
          perfilEl.style.boxShadow = '0 0 8px rgba(59, 130, 246, 0.3)';
        } else if (perfNorm.includes('patrulheiro')) {
          perfilEl.style.color = '#6ee7b7';
          perfilEl.style.background = 'rgba(16, 185, 129, 0.2)';
          perfilEl.style.border = '1px solid rgba(16, 185, 129, 0.6)';
          perfilEl.style.boxShadow = '0 0 8px rgba(16, 185, 129, 0.3)';
        } else {
          perfilEl.style.color = '#fde047';
          perfilEl.style.background = 'rgba(245, 158, 11, 0.2)';
          perfilEl.style.border = '1px solid rgba(245, 158, 11, 0.6)';
          perfilEl.style.boxShadow = '0 0 8px rgba(245, 158, 11, 0.3)';
        }
      }

      if (resposta.fotoUrl) {
        document.getElementById('sidebarAvatarContainer').innerHTML =
          '<img src="' + resposta.fotoUrl + '" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" />';
      }

      // Controle de Botões de Importar PDF (Admin ou Colaborador)
      const perfilNormalizado = (resposta.perfil || "").trim().toLowerCase();
      window.perfilNormalizado = perfilNormalizado;
      if (perfilNormalizado === "admin") {
        let optSemEnd = document.getElementById("optSemEnderecoLista");
        if(optSemEnd) optSemEnd.style.display = "block";
      }
      if (perfilNormalizado !== "patrulheiro") {
        const btnNovo = document.getElementById("btnAdminNovo");
        if (btnNovo) btnNovo.style.display = "flex";
        document.querySelectorAll('.btn-importar-pdf-desktop').forEach(function(el) {
          el.style.display = 'flex';
        });
      } else {
        document.querySelectorAll('.btn-importar-pdf-desktop').forEach(function(el) {
          el.style.display = 'none';
        });
      }

      if (perfilNormalizado === "admin") {
        const btnMenu = document.getElementById("btnMenuAdmin");
        const btnAjustes = document.getElementById("btnMenuAjustes");
        const btnConferencia = document.getElementById("btnMenuConferencia");
        const btnAuditoria = document.getElementById("btnMenuAuditoria");
        if (btnMenu) btnMenu.style.display = "block";
        if (btnAjustes) btnAjustes.style.display = "block";
        if (btnConferencia) btnConferencia.style.display = "block";
        if (btnAuditoria) btnAuditoria.style.display = "block";

        // Badge auditoria: carregar em background após dados prontos (4s)
        setTimeout(function() { if (typeof carregarAuditoria === 'function') carregarAuditoria(); }, 4000);
        
        // Polling para novos cadastros de operadores (executar imediatamente e a cada 15 segundos)
        checarCadastrosPendentesAdmin();
        setInterval(checarCadastrosPendentesAdmin, 15000);
      }
      
      if (typeof mapaPrincipal === 'undefined' || !mapaPrincipal) {
        configurarEstruturaMapa();
      } else {
        // Mapa já existe, apenas sincronizar os dados
        const ts = document.getElementById("tela-seguranca");
        if (ts) {
          ts.style.opacity = "0";
          setTimeout(function() { ts.style.display = "none"; }, 500);
        }
        const iconeSinc = document.querySelector('button[title="Sincronizar"] span');
        if (iconeSinc) iconeSinc.style.animation = 'spin 1s linear infinite';
        google.script.run.withSuccessHandler(function(dados) {
          processarDados(dados);
          if (iconeSinc) iconeSinc.style.animation = 'none';
        }).obterDados();
      }
    }
    else if (resposta.status === "NAO_CADASTRADO") {
      pararPollingCredenciais();
      if (boxCarregando) boxCarregando.style.display = "none";
      document.getElementById("lbl-email-google").innerText = resposta.email;
      document.getElementById("seg-estado-cadastro").style.display = "block";
    }
    else {
      if (boxCarregando) boxCarregando.style.display = "none";
      if (resposta.status === "PENDENTE") {
        mostrarMensagemPendente({
          email: resposta.email || (document.getElementById("lbl-email-google") ? document.getElementById("lbl-email-google").innerText : "")
        });
      } else {
        pararPollingCredenciais();
        const iconeMsg = document.getElementById("msg-seg-icone");
        if (iconeMsg) {
          iconeMsg.innerText = "lock";
          iconeMsg.style.color = "var(--danger)";
          iconeMsg.style.animation = "none";
        }
        document.getElementById("msg-seg-titulo").innerText = "❌ ACESSO BLOQUEADO";
        document.getElementById("msg-seg-texto").innerText = resposta.motivo || "Seu acesso está bloqueado no sistema. Entre em contato com o administrador.";
        const boxInfo = document.getElementById("box-info-aguardando");
        if (boxInfo) boxInfo.style.display = "none";
        document.getElementById("seg-estado-mensagem").style.display = "block";
      }
    }
  }

  function reiniciarVerificacaoSeguranca() {
    pararPollingCredenciais();
    document.getElementById("seg-estado-mensagem").style.display = "none";
    document.getElementById("seg-estado-cadastro").style.display = "none";
    if (document.getElementById("seg-estado-whatsapp")) {
      document.getElementById("seg-estado-whatsapp").style.display = "none";
    }
    document.getElementById("seg-estado-carregando").style.display = "block";
    document.getElementById("tela-seguranca").style.display = "flex";
    google.script.run.withSuccessHandler(avaliarAcessoSistema)
      .withFailureHandler(function(erro) {
        chamarAlertaTatico("ERRO", "Não foi possível contactar o servidor: " + erro.message, "OK");
        document.getElementById("seg-estado-carregando").style.display = "none";
        document.getElementById("seg-estado-mensagem").style.display = "block";
      }).verificarAcessoUsuario();
  }

  /* ================================================================
     MÓDULO 7: OPERAÇÕES DE REDE E CADASTRO
     ================================================================ */
  function chamarAlertaTatico(titulo, mensagem, tipo, callback, isWide) {
    const modal = document.getElementById("modalAlertaTatico");
    document.getElementById("alerta-titulo").innerText = titulo;
    document.getElementById("alerta-mensagem").innerHTML = mensagem;
    const containerBotoes = document.getElementById("alerta-botoes");
    containerBotoes.innerHTML = "";
    const alertBox = modal.querySelector(".alert-modal-box");

    if (alertBox) {
      if (isWide) {
        alertBox.classList.add("wide");
      } else {
        alertBox.classList.remove("wide");
      }
    }

    if (tipo === "CONFIRMAR" || tipo === "EXCLUIR") {
      if (alertBox) alertBox.style.borderTopColor = tipo === "EXCLUIR" ? "var(--danger)" : "var(--warning)";
      const btnSim = document.createElement("button"); btnSim.className = "btn-alerta-sim";
      btnSim.innerText = tipo === "EXCLUIR" ? "EXCLUIR ENDEREÇO" : "SIM, CONFIRMAR";
      if (tipo === "EXCLUIR") btnSim.style.background = "var(--danger)";
      btnSim.onclick = function() { modal.style.display = "none"; if(callback) callback(true); };
      const btnNao = document.createElement("button"); btnNao.className = "btn-alerta-nao";
      btnNao.innerText = "CANCELAR";
      btnNao.onclick = function() { modal.style.display = "none"; if(callback) callback(false); };
      containerBotoes.appendChild(btnSim); containerBotoes.appendChild(btnNao);
    } else {
      if (alertBox) alertBox.style.borderTopColor = "var(--accent)";
      const btnOk = document.createElement("button"); btnOk.className = "btn-alerta-ok";
      btnOk.innerText = tipo || "CIENTE";
      btnOk.onclick = function() { modal.style.display = "none"; if(callback) callback(); };
      containerBotoes.appendChild(btnOk);
    }
    if (modal) {
      modal.style.zIndex = "9999999";
      modal.style.display = "flex";
    }
  }

  function enviarAtualizacao(mandado, btnElement) {
    btnElement.innerText = "Sincronizando..."; btnElement.disabled = true;
    const radios = document.getElementsByName("status_" + mandado);
    let novoStatus = "Procurado";
    for(let i=0;i<radios.length;i++) { if(radios[i].checked) { novoStatus = radios[i].value; break; } }
    const textarea = document.getElementById("obs_" + mandado);
    const novaObs = textarea ? textarea.value : "";

    google.script.run
      .withSuccessHandler(function(res) {
        chamarAlertaTatico("ATUALIZAÇÃO", res.mensagem, "OK");
        if(infoWindowAtiva) infoWindowAtiva.close();
        btnElement.innerText = "SALVAR INFORMAÇÕES";
        btnElement.disabled = false;
        if(textarea) textarea.value = "";
        const alvoLocal = dadosMandados.find(function(d) { return d.mandado === mandado; });
        if(alvoLocal) { alvoLocal.status = novoStatus; }
        filtrarNoMapa();
      })
      .withFailureHandler(function(err) {
        chamarAlertaTatico("ERRO", err.message, "OK");
        btnElement.innerText = "SALVAR INFORMAÇÕES";
        btnElement.disabled = false;
      })
      .atualizarRegistro(mandado, novoStatus, novaObs);
  }

  function conferirMandadoClick(mandado, btn) {
    btn.innerText = "⏳ Conferindo..."; btn.disabled = true;
    google.script.run.withSuccessHandler(function(res) {
      chamarAlertaTatico("CONFERÊNCIA", res.mensagem, "OK");
      btn.innerText = "✅ CONFERIDO"; btn.disabled = true;
      const alvo = dadosMandados.find(function(d) { return d.mandado === mandado; });
      if (alvo) {
        const hoje = new Date();
        const dia = hoje.getDate().toString().padStart(2,'0');
        const mes = (hoje.getMonth()+1).toString().padStart(2,'0');
        const ano = hoje.getFullYear();
        const hora = hoje.getHours().toString().padStart(2,'0');
        const min = hoje.getMinutes().toString().padStart(2,'0');
        const seg = hoje.getSeconds().toString().padStart(2,'0');
        alvo.dataConferencia = dia + '/' + mes + '/' + ano + ' ' + hora + ':' + min + ':' + seg;
      }
    }).conferirMandado(mandado);
  }

  function normalizarArea(txt) {
    if (!txt) return "";
  }

  function conferirMandadoClick(mandado, btn) {
    btn.innerText = "⏳ Conferindo..."; btn.disabled = true;
    google.script.run.withSuccessHandler(function(res) {
      chamarAlertaTatico("CONFERÊNCIA", res.mensagem, "OK");
      btn.innerText = "✅ CONFERIDO"; btn.disabled = true;
      const alvo = dadosMandados.find(function(d) { return d.mandado === mandado; });
      if (alvo) {
        const hoje = new Date();
        const dia = hoje.getDate().toString().padStart(2,'0');
        const mes = (hoje.getMonth()+1).toString().padStart(2,'0');
        const ano = hoje.getFullYear();
        const hora = hoje.getHours().toString().padStart(2,'0');
        const min = hoje.getMinutes().toString().padStart(2,'0');
        const seg = hoje.getSeconds().toString().padStart(2,'0');
        alvo.dataConferencia = dia + '/' + mes + '/' + ano + ' ' + hora + ':' + min + ':' + seg;
      }
    }).conferirMandado(mandado);
  }

  function normalizarArea(txt) {
    if (!txt) return "";
    return String(txt)
      .toLowerCase()
      .replace(/^cpm-/i, "")
      .replace(/cpm-cpa/gi, "cpa")
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "") // remove acentos
      .replace(/[^a-z0-9]/gi, "")      // deixa APENAS letras e números (remove º, ª, -, espaço, etc)
      .replace(/^0+/, "");             // remove zeros à esquerda (ex: "02" -> "2")
  }

  // Cache de resultados de containsLocation por coordenada + filtros ativos
  var _cachePoligono = {};
  var _ultimosFiltrosArea = '';

  var _filtrarNoMapaTimer = null;

  function filtrarNoMapa() {
    if (!window._sistemaPronto) {
      _executarFiltroInterno();
      return;
    }
    
    var loadingEl = document.getElementById('tela-seguranca');
    var txtEl = document.getElementById('txt-status-carregamento');
    var overlay = document.getElementById('mapStatusOverlay');
    
    if (loadingEl && txtEl) {
      loadingEl.style.display = 'flex';
      loadingEl.style.opacity = '1';
      txtEl.innerText = "Aplicando filtros e renderizando mapa...";
    }
    if (overlay) overlay.style.display = 'none';

    if (_filtrarNoMapaTimer) clearTimeout(_filtrarNoMapaTimer);
    _filtrarNoMapaTimer = setTimeout(function() {
      _executarFiltroInterno();
      if (loadingEl) {
        loadingEl.style.opacity = '0';
        setTimeout(function() { loadingEl.style.display = 'none'; }, 300);
      }
    }, 50);
  }

  function _executarFiltroInterno() {
    const termoNome = document.getElementById('filtroNome').value.toLowerCase();
    const filtroCPI = document.getElementById('filtroCPI').value;
    const filtroBPM = document.getElementById('filtroBatalhao').value;
    const filtroCIA = document.getElementById('filtroCIA').value;
    const elDP = document.getElementById('filtroDP');
    const filtroDP = elDP ? elDP.value : 'TODOS';
    
    // Filtros avançados (drawer)
    const elCrime = document.getElementById('filtroCrime');
    const filtroCrime = elCrime ? elCrime.value : 'TODOS';
    const elSexo = document.getElementById('filtroSexo');
    const filtroSexo = elSexo ? elSexo.value : 'TODOS';
    const elTipoMandado = document.getElementById('filtroTipoMandado');
    const filtroTipo = elTipoMandado ? elTipoMandado.value : 'TODOS';
    
    // Limpar cache de polígono se os filtros de área mudaram
    var chaveArea = filtroCPI + '|' + filtroBPM + '|' + filtroCIA + '|' + filtroDP;
    if (chaveArea !== _ultimosFiltrosArea) {
      _cachePoligono = {};
      _ultimosFiltrosArea = chaveArea;
    }

    const filtrados = [];
    dadosMandados.forEach(function(alvo) {
      if (termoNome) {
        const nomeAlvo = (alvo.nome || '').toLowerCase();
        const mandadoAlvo = (alvo.mandado || '').toLowerCase();
        const infoAlvo = (alvo.infoProcessuais || '').toLowerCase();
        const rgAlvo = (alvo.rg || '').toLowerCase();
        const cpfAlvo = (alvo.cpf || '').replace(/\D/g, '');
        const termoSemMascara = termoNome.replace(/\D/g, '');
        const apelidoAlvo = (alvo.apelido || alvo.cunha || (alvo.extras && alvo.extras.alcunha) || '').toLowerCase();

        let crimeMatch = false;
        if (typeof classificarCrime === 'function') {
          const crInfo = classificarCrime(alvo.infoProcessuais || '');
          if (crInfo) {
            if (crInfo.nome && crInfo.nome.toLowerCase().includes(termoNome)) crimeMatch = true;
            if (crInfo.artigo && String(crInfo.artigo).toLowerCase().includes(termoNome)) crimeMatch = true;
            if (crInfo.todosCrimes) {
              crInfo.todosCrimes.forEach(function(c) {
                if (c.nome && c.nome.toLowerCase().includes(termoNome)) crimeMatch = true;
                if (c.artigo && String(c.artigo).toLowerCase().includes(termoNome)) crimeMatch = true;
              });
            }
          }
        }

        const matchNome = nomeAlvo.includes(termoNome) ||
                          mandadoAlvo.includes(termoNome) ||
                          infoAlvo.includes(termoNome) ||
                          rgAlvo.includes(termoNome) ||
                          apelidoAlvo.includes(termoNome) ||
                          crimeMatch ||
                          (termoSemMascara && termoSemMascara.length >= 3 && cpfAlvo.includes(termoSemMascara));

        if (!matchNome) return;
      }
      
      // Filtro Crime
      var matchCrime = true;
      var crimeForcado = null;
      if (filtroCrime !== 'TODOS') {
        var crimeAlvo = classificarCrime(alvo.infoProcessuais || '');
        var fCrimeUp = filtroCrime.trim().toUpperCase();
        var isBuscandoNaoClassificado = fCrimeUp.includes('NÃO CLASSIFICADO') || fCrimeUp.includes('NAO CLASSIFICADO');

        function ehNaoClassificadoObj(obj) {
          if (!obj) return false;
          if (obj.naoClassificado === true) return true;
          var n = String(obj.nome || '').toUpperCase();
          return n.includes('NÃO CLASSIFICADO') || n.includes('NAO CLASSIFICADO') || n === 'OUTROS' || n === 'NÃO IDENTIFICADO' || n === 'NAO IDENTIFICADO';
        }

        function ehMesmoCrime(nome1, nome2) {
          if (!nome1 || !nome2) return false;
          var u1 = nome1.trim().toUpperCase();
          var u2 = nome2.trim().toUpperCase();
          return u1 === u2 || u1.indexOf(u2) !== -1 || u2.indexOf(u1) !== -1;
        }

        if (isBuscandoNaoClassificado) {
          if (ehNaoClassificadoObj(crimeAlvo)) {
            matchCrime = true;
            crimeForcado = crimeAlvo;
          } else if (crimeAlvo.todosCrimes && crimeAlvo.todosCrimes.length > 0) {
            let foundNC = crimeAlvo.todosCrimes.find(function(c) { return ehNaoClassificadoObj(c); });
            if (foundNC) {
              matchCrime = true;
              crimeForcado = foundNC;
            } else {
              matchCrime = false;
            }
          } else {
            matchCrime = false;
          }
        } else {
          if (ehMesmoCrime(crimeAlvo.nome, fCrimeUp)) {
            matchCrime = true;
          } else if (crimeAlvo.todosCrimes && crimeAlvo.todosCrimes.length > 0) {
            let found = crimeAlvo.todosCrimes.find(function(c) { return ehMesmoCrime(c.nome, fCrimeUp); });
            if (found) {
              matchCrime = true;
              crimeForcado = found;
            } else {
              matchCrime = false;
            }
          } else {
            matchCrime = false;
          }
        }
      }
      if (!matchCrime) return;

      // Filtro Sexo
      var matchSexo = true;
      if (filtroSexo !== 'TODOS') {
        var sAlvo = (alvo.sexo || '').trim().toUpperCase();
        if (filtroSexo === 'MASCULINO') {
          matchSexo = (sAlvo === 'M' || sAlvo === 'MASCULINO');
        } else if (filtroSexo === 'FEMININO') {
          matchSexo = (sAlvo === 'F' || sAlvo === 'FEMININO');
        } else {
          matchSexo = (sAlvo === filtroSexo);
        }
      }
      if (!matchSexo) return;

      // Filtro Tipo Mandado
      var matchTipo = true;
      if (filtroTipo !== 'TODOS') {
        var tituloMandado = '';
        try {
          var extras = alvo.dadosExtrasJSON || '{}';
          var parsed = JSON.parse(extras);
          tituloMandado = (parsed.titulo || '').toUpperCase();
        } catch(e) {}
        matchTipo = (tituloMandado === filtroTipo.toUpperCase());
      }
      if (!matchTipo) return;

      // Se passou nos demais filtros, processamos as ÁREAS
      const normFiltroCPI = normalizarArea(filtroCPI);
      const normFiltroBPM = normalizarArea(filtroBPM);
      const normFiltroCIA = normalizarArea(filtroCIA);
      const normFiltroDP = normalizarArea(filtroDP);

      let okCPI = (filtroCPI === 'TODOS' || normalizarArea(alvo.cpiArea) === normFiltroCPI || (alvo._geoCpi && alvo._geoCpi === normFiltroCPI) || alvo.semEndereco);
      let okBPM = (filtroBPM === 'TODOS' || normalizarArea(alvo.bpmArea) === normFiltroBPM || normalizarArea(alvo.batalhao) === normFiltroBPM || (alvo._geoBpm && alvo._geoBpm === normFiltroBPM) || alvo.semEndereco);
      let okCIA = (filtroCIA === 'TODOS' || normalizarArea(alvo.ciaArea) === normFiltroCIA || (alvo._geoCia && alvo._geoCia === normFiltroCIA) || alvo.semEndereco);
      let okDP = (filtroDP === 'TODOS' || normalizarArea(alvo.dpArea) === normFiltroDP || (alvo._geoDp && alvo._geoDp === normFiltroDP) || alvo.semEndereco);
      
      let temGooglePoligonos = (typeof google !== 'undefined' && google.maps && google.maps.geometry && google.maps.geometry.poly && window.poligonosInstancias && window.poligonosInstancias.length > 0);
      let filtroAtivo = (filtroCPI !== 'TODOS' || filtroBPM !== 'TODOS' || filtroCIA !== 'TODOS' || filtroDP !== 'TODOS');

      // Checagem geométrica para o endereço PRINCIPAL (apenas se a pré-indexação / check textual NÃO passou)
      let textMatchPrincipal = (okCPI && okBPM && okCIA && okDP);
      if (!textMatchPrincipal && filtroAtivo && temGooglePoligonos && alvo.lat && alvo.lng && !alvo.semEndereco && !window._geografiaIndexada) {
        var chavePonto = alvo.lat + ',' + alvo.lng;
        let principalDentroDoPoligono = false;
        
        // Usar cache se já verificamos este ponto
        if (_cachePoligono.hasOwnProperty(chavePonto)) {
          principalDentroDoPoligono = _cachePoligono[chavePonto];
        } else {
          try {
            const ptPrin = new google.maps.LatLng(Number(alvo.lat), Number(alvo.lng));
            for (let pIdx = 0; pIdx < window.poligonosInstancias.length; pIdx++) {
              const p = window.poligonosInstancias[pIdx];
              let matchP_CPI = (filtroCPI === 'TODOS' || normalizarArea(p.cpi) === normFiltroCPI);
              let matchP_BPM = (filtroBPM === 'TODOS' || normalizarArea(p.batalhao) === normFiltroBPM);
              let matchP_CIA = (filtroCIA === 'TODOS' || normalizarArea(p.cia) === normFiltroCIA);
              let matchP_DP = (filtroDP === 'TODOS' || normalizarArea(p.delegacia) === normFiltroDP);
              
              if (matchP_CPI && matchP_BPM && matchP_CIA && matchP_DP) {
                // Rejeição ultra-rápida por Bounding Box antes de containsLocation
                if (!p._boundsCalculado && p.polygon) {
                  try {
                    var b = new google.maps.LatLngBounds();
                    p.polygon.getPath().forEach(function(ll) { b.extend(ll); });
                    p._boundsCalculado = b;
                  } catch(eB) {}
                }
                if (p._boundsCalculado && !p._boundsCalculado.contains(ptPrin)) {
                  continue;
                }
                if (google.maps.geometry.poly.containsLocation(ptPrin, p.polygon)) {
                  principalDentroDoPoligono = true;
                  break;
                }
              }
            }
          } catch(ep) {}
          _cachePoligono[chavePonto] = principalDentroDoPoligono;
        }

        if (principalDentroDoPoligono) {
          okCPI = true; okBPM = true; okCIA = true; okDP = true;
        } else {
          okCPI = false; okBPM = false; okCIA = false; okDP = false;
        }
      }

      let adicionou = false;
      let pushedPrincipal = false;

      if (okCPI && okBPM && okCIA && okDP) {
        delete alvo._isSecundarioClone;
        alvo._crimeFiltradoForcado = crimeForcado;
        filtrados.push(alvo);
        adicionou = true;
        pushedPrincipal = true;
      }

      if (filtroCPI !== 'TODOS' || filtroBPM !== 'TODOS' || filtroCIA !== 'TODOS' || filtroDP !== 'TODOS') {
        try {
          let rawSecAuth = alvo.geodataSecundarios || alvo.secundarios || [];
          let listaSec = Array.isArray(rawSecAuth) ? rawSecAuth : (typeof rawSecAuth === 'string' ? (function() { try { return JSON.parse(rawSecAuth); } catch(e) { return []; } })() : []);
          for (let i = 0; i < listaSec.length; i++) {
            let sec = listaSec[i];
            
            let aCPI = normalizarArea(sec.cpi || sec._geoCpi || '');
            let aBPM = normalizarArea(sec.batalhao || sec._geoBpm || '');
            let aCIA = normalizarArea(sec.cia || sec._geoCia || '');
            let aDP = normalizarArea(sec.delegacia || sec.dpArea || sec._geoDp || '');

             let secOkCPI = true;
             let secOkBPM = true;
             let secOkCIA = true;
             let secOkDP = true;

             let estaDentroDoFiltroFisicamente = false;

             if (filtroAtivo && temGooglePoligonos && sec.lat && sec.lng) {
                var chaveSecPonto = sec.lat + ',' + sec.lng;
                if (_cachePoligono.hasOwnProperty(chaveSecPonto)) {
                  estaDentroDoFiltroFisicamente = _cachePoligono[chaveSecPonto];
                } else {
                  try {
                    const pt = new google.maps.LatLng(Number(sec.lat), Number(sec.lng));
                    for (let j = 0; j < window.poligonosInstancias.length; j++) {
                      const p = window.poligonosInstancias[j];
                      let matchCPI = (filtroCPI === 'TODOS' || normalizarArea(p.cpi) === normFiltroCPI);
                      let matchBPM = (filtroBPM === 'TODOS' || normalizarArea(p.batalhao) === normFiltroBPM);
                      let matchCIA = (filtroCIA === 'TODOS' || normalizarArea(p.cia) === normFiltroCIA);
                      let matchDP = (filtroDP === 'TODOS' || normalizarArea(p.delegacia) === normFiltroDP);
                      
                      if (matchCPI && matchBPM && matchCIA && matchDP) {
                        if (google.maps.geometry.poly.containsLocation(pt, p.polygon)) {
                          estaDentroDoFiltroFisicamente = true;
                          break;
                        }
                      }
                    }
                  } catch(ePoly) {}
                  _cachePoligono[chaveSecPonto] = estaDentroDoFiltroFisicamente;
                }
             }

             if (filtroAtivo) {
                if (temGooglePoligonos) {
                   if (!estaDentroDoFiltroFisicamente) {
                      secOkCPI = false;
                      secOkBPM = false;
                      secOkCIA = false;
                      secOkDP = false;
                   }
                } else {
                   // Fallback textual
                   if (filtroCPI !== 'TODOS') {
                      if (aCPI === "" || (aCPI !== normFiltroCPI && aCPI.indexOf(normFiltroCPI) === -1 && normFiltroCPI.indexOf(aCPI) === -1)) {
                         secOkCPI = false;
                      }
                   }
                   if (filtroBPM !== 'TODOS') {
                      if (aBPM === "" || (aBPM !== normFiltroBPM && aBPM.indexOf(normFiltroBPM) === -1 && normFiltroBPM.indexOf(aBPM) === -1)) {
                         secOkBPM = false;
                      }
                   }
                   if (filtroCIA !== 'TODOS') {
                      if (aCIA === "" || (aCIA !== normFiltroCIA && aCIA.indexOf(normFiltroCIA) === -1 && normFiltroCIA.indexOf(aCIA) === -1)) {
                         secOkCIA = false;
                      }
                   }
                   if (filtroDP !== 'TODOS') {
                      if (aDP === "" || (aDP !== normFiltroDP && aDP.indexOf(normFiltroDP) === -1 && normFiltroDP.indexOf(aDP) === -1)) {
                         secOkDP = false;
                      }
                   }
                }
             }

            if (secOkCPI && secOkBPM && secOkCIA && secOkDP) {
               if (sec.lat && sec.lng) {
                 if (!pushedPrincipal && alvo.lat && alvo.lng) {
                    delete alvo._isSecundarioClone;
                    alvo._crimeFiltradoForcado = crimeForcado;
                    filtrados.push(alvo);
                    pushedPrincipal = true;
                    adicionou = true;
                 }
                 delete alvo._isSecundarioClone;
                 var clone = Object.assign({}, alvo);
                 clone._crimeFiltradoForcado = crimeForcado;
                 clone._isSecundarioClone = true;
                 clone.latPrincipal = alvo.latPrincipal || alvo.lat;
                 clone.lngPrincipal = alvo.lngPrincipal || alvo.lng;
                 clone._secundarioEnd = sec.endereco;
                 clone.lat = Number(sec.lat);
                 clone.lng = Number(sec.lng);
                 clone.cpiSecundario = sec.cpi;
                 clone.bpmSecundario = sec.batalhao;
                 clone.ciaSecundario = sec.cia;
                 clone.dpSecundario = sec.delegacia || sec.dpArea;
                 filtrados.push(clone);
                 adicionou = true;
               }
            }
          }
        } catch(e) {}
      }

      if (!adicionou) {
         delete alvo._isSecundarioClone;
         delete alvo._crimeFiltradoForcado;
      }
    });
    
    window.dadosMandadosFiltrados = filtrados;
    
    renderizarPinos(filtrados);
    if (typeof aplicarFiltrosLista === 'function') aplicarFiltrosLista(); else if (typeof renderizarTabelaMandados === 'function') renderizarTabelaMandados(filtrados);
    if (typeof aplicarFiltrosDePoligono === 'function') aplicarFiltrosDePoligono(filtroCPI, filtroBPM, filtroCIA, filtroDP);
  }

  function copiarDadoTatico(texto, btnElement) {
    if (!texto || texto === "N/A") return;
    navigator.clipboard.writeText(texto).then(function() {
      btnElement.innerHTML = '<span class="material-symbols-outlined" style="color:var(--success)!important;font-size:14px;">check_circle</span>';
      setTimeout(function() { btnElement.innerHTML = '<span class="material-symbols-outlined" style="font-size:14px;">content_copy</span>'; }, 1500);
    }).catch(function() {
      const t = document.createElement("textarea"); t.value = texto;
      document.body.appendChild(t); t.select(); document.execCommand("copy"); document.body.removeChild(t);
      btnElement.innerHTML = '<span class="material-symbols-outlined" style="color:var(--success)!important;font-size:14px;">check_circle</span>';
      setTimeout(function() { btnElement.innerHTML = '<span class="material-symbols-outlined" style="font-size:14px;">content_copy</span>'; }, 1500);
    });
  }

  function geocodeEndereco(geocoder, endereco) {
    return new Promise(function(resolve) {
      geocoder.geocode({ 'address': endereco }, function(results, status) {
        if (status === 'OK' && results.length > 0) {
          var locType = results[0].geometry.location_type;
          if (locType === 'APPROXIMATE' || locType === 'GEOMETRIC_CENTER') {
            console.log("[GEO-CLIENTE] Rejeitado por ser impreciso (" + locType + "): " + endereco);
            resolve(null);
            return;
          }
          
          var uf = "";
          var comps = results[0].address_components;
          for (var i = 0; i < comps.length; i++) {
            if (comps[i].types.includes("administrative_area_level_1")) {
              uf = comps[i].short_name;
              break;
            }
          }
          resolve({ 
            lat: results[0].geometry.location.lat(), 
            lng: results[0].geometry.location.lng(),
            uf: uf,
            enderecoFormatado: results[0].formatted_address
          });
        }
        else resolve(null);
      });
    });
  }

    function removerToast() {
      toast.style.transform = "translateY(20px) scale(0.96)";

      setTimeout(function() { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 350);

    if (acaoCallback) {
      toast.onclick = function() {
        removerToast();
        acaoCallback();

    container.appendChild(toast);

    requestAnimationFrame(function() {
      toast.style.transform = "translateY(0) scale(1)";

    setTimeout(function() {

  function checarCadastrosPendentesAdmin() {
    google.script.run.withSuccessHandler(function(usuarios) {
      if (!usuarios) return;
      const pendentesAtual = usuarios.filter(function(u) { return u.status === 'PENDENTE'; }).length;
      
      if (lastPendingCount !== -1 && pendentesAtual > lastPendingCount) {
        const diferenca = pendentesAtual - lastPendingCount;
        exibirToastNotificacao(
          "SOLICITAÇÃO DE ACESSO",
          diferenca + " novo(s) operador(es) pendente(s) aguardando aprovação.",
          "NOVO_USUARIO",
          function() {
            if (typeof alternarVisaoTatica === 'function') {
              alternarVisaoTatica('usuarios');
            } else if (typeof alternarVisaoGlobal === 'function') {
              alternarVisaoGlobal('usuarios');
            }
            carregarListaUsuarios();
          },
          8000
        );
      }

      lastPendingCount = pendentesAtual;
      atualizarBadgesPendentes(pendentesAtual);
    }).obterTodosUsuarios();
  }

  function carregarUsuariosGrade() {
    const cAuth = document.getElementById('containerTropaAutorizada');
    const cPend = document.getElementById('containerTropaPendente');
    const cBloq = document.getElementById('containerTropaBloqueada');
    
    const loadingHtml = '<div style="padding:32px;text-align:center;color:var(--text-muted);font-size:13px;background:var(--bg-surface);border-radius:var(--radius-md);"><span class="material-symbols-outlined" style="font-size:32px;opacity:0.5;animation:spin 1s linear infinite;margin-bottom:8px;">refresh</span><p>Carregando...</p></div>';
    
    if (cAuth) cAuth.innerHTML = loadingHtml;
    if (cPend) cPend.innerHTML = '';
    if (cBloq) cBloq.innerHTML = '';

    google.script.run.withSuccessHandler(function(usuarios) {
      if (!usuarios) return;
      window.listaUsuariosAdmin = usuarios;
      renderListaAdmin();
      renderListaConexao();
    }).obterTodosUsuarios();
  }
  
  // Variável para armazenar o ID do Polling e não encavalar
  window.pollingConexaoAtivo = null;
  
  // Observador de aba para ligar/desligar o Polling seletivamente
  function iniciarPollingConexao() {
    if (!window.pollingConexaoAtivo) {
      window.pollingConexaoAtivo = setInterval(() => {
        const viewAdmin = document.getElementById('view-usuarios');
        // Só rodar o ping invisível de 30s se o usuário for Admin e a tela estiver aberta
        if (viewAdmin && viewAdmin.style.display !== 'none') {
          google.script.run.withSuccessHandler(function(usuarios) {
            if (usuarios) {
              window.listaUsuariosAdmin = usuarios;
              renderListaConexao();
            }
          }).obterTodosUsuarios();
        }
      }, 30000); // 30 segundos
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', iniciarPollingConexao);
  } else {
    iniciarPollingConexao();
  }
  
  function selecionarFiltroPerfil(btn) {
    document.querySelectorAll('.filtro-perfil-btn').forEach(b => b.classList.remove('neu-btn-accent'));

  function renderListaAdmin() {
    const cAuth = document.getElementById('containerTropaAutorizada');
    const cPend = document.getElementById('containerTropaPendente');
    const cBloq = document.getElementById('containerTropaBloqueada');
    if (!cAuth || !cPend || !cBloq) return;
    
    const badgeVersaoMain = document.getElementById('badgeVersao');
    const badgeVersaoAdmin = document.getElementById('badgeVersaoAdmin');
    if (badgeVersaoMain && badgeVersaoAdmin) {
      badgeVersaoAdmin.textContent = badgeVersaoMain.textContent;
    }
    
    let usuarios = window.listaUsuariosAdmin || [];
    const pendentesTotais = usuarios.filter(u => u.status === 'PENDENTE');
    atualizarBadgesPendentes(pendentesTotais.length);
    
    const textoBusca = (document.getElementById('filtroTextoAdmin') ? document.getElementById('filtroTextoAdmin').value.trim().toLowerCase() : '');
    
    // Filtrar não excluídos, texto e perfil
    let filtrados = usuarios.filter(function(u) {
      if (u.status === 'EXCLUIDO') return false;
      
      if (window.filtroPerfilAdmin === 'Pendente') {
        if (u.status !== 'PENDENTE') return false;
      } else if (window.filtroPerfilAdmin === 'Bloqueado') {
        if (u.status !== 'BLOQUEADO' && u.status !== 'INATIVO' && u.status !== 'REPROVADO') return false;
      } else if (window.filtroPerfilAdmin !== 'Todos') {
        if (u.perfil !== window.filtroPerfilAdmin) return false;
      }
      
      if (textoBusca !== '') {
        const tEmail = (u.email || '').toLowerCase();
        const tNome = (u.nome || '').toLowerCase();
        const tPerfil = (u.perfil || '').toLowerCase();
        if (!tEmail.includes(textoBusca) && !tNome.includes(textoBusca) && !tPerfil.includes(textoBusca)) {
          return false;
        }
      }
      return true;
    });

    const arrCadastrados = filtrados.filter(u => u.status === 'ATIVO');
    const arrPendentes = filtrados.filter(u => u.status === 'PENDENTE');
    const arrBloqueados = filtrados.filter(u => u.status === 'BLOQUEADO' || u.status === 'INATIVO' || u.status === 'REPROVADO');

    if (arrCadastrados.length === 0) {
      cAuth.innerHTML = '<div style="padding:24px;text-align:center;color:var(--text-muted);font-size:13px;background:var(--bg-surface);border-radius:var(--radius-md);">Nenhum agente cadastrado encontrado.</div>';
    } else {
      cAuth.innerHTML = arrCadastrados.map(gerarHtmlCard).join('');
    }

    if (arrPendentes.length === 0) {
      cPend.innerHTML = '<div style="padding:24px;text-align:center;color:var(--text-muted);font-size:13px;background:var(--bg-surface);border-radius:var(--radius-md);">Não há cadastros pendentes.</div>';
    } else {
      cPend.innerHTML = arrPendentes.map(gerarHtmlCard).join('');
    }

    if (arrBloqueados.length === 0) {
      cBloq.innerHTML = '<div style="padding:24px;text-align:center;color:var(--text-muted);font-size:13px;background:var(--bg-surface);border-radius:var(--radius-md);">Nenhum agente bloqueado.</div>';
    } else {
      cBloq.innerHTML = arrBloqueados.map(gerarHtmlCard).join('');
    }

    // Removido da renderListaAdmin e repassado para o polling:
    // renderListaConexao() cuidará da Coluna 2

    // Ocultar seções vazias ou não relacionadas ao filtro
    const secaoCad = document.getElementById('secao-agentes-cadastrados');
    const secaoPen = document.getElementById('secao-agentes-pendentes');
    const secaoBlo = document.getElementById('secao-agentes-bloqueados');
    
    if (window.filtroPerfilAdmin === 'Pendente') {
      if(secaoCad) secaoCad.style.display = 'none';
      if(secaoPen) secaoPen.style.display = 'block';
      if(secaoBlo) secaoBlo.style.display = 'none';
    } else if (window.filtroPerfilAdmin === 'Bloqueado') {
      if(secaoCad) secaoCad.style.display = 'none';
      if(secaoPen) secaoPen.style.display = 'none';
      if(secaoBlo) secaoBlo.style.display = 'block';
    } else if (window.filtroPerfilAdmin !== 'Todos') {
      if(secaoCad) secaoCad.style.display = 'block';
      if(secaoPen) secaoPen.style.display = 'none';
      if(secaoBlo) secaoBlo.style.display = 'none';
    } else {
      if(secaoCad) secaoCad.style.display = 'block';
      if(secaoPen) secaoPen.style.display = 'block';
      if(secaoBlo) secaoBlo.style.display = 'block';
    }
  }

  function selecionarFiltroConexao(btn) {
    document.querySelectorAll('.filtro-conexao-btn').forEach(b => {
      b.classList.remove('neu-btn-accent');
      if(b.getAttribute('data-conexao') === 'Todos') { b.style.color = 'var(--text-secondary)'; b.style.borderColor = 'rgba(255,255,255,0.1)'; b.style.background = 'transparent'; }
      if(b.getAttribute('data-conexao') === 'Online') { b.style.color = 'var(--success)'; b.style.borderColor = 'rgba(16,185,129,0.3)'; b.style.background = 'transparent'; }
      if(b.getAttribute('data-conexao') === 'Offline') { b.style.color = 'var(--text-muted)'; b.style.borderColor = 'rgba(255,255,255,0.1)'; b.style.background = 'transparent'; }
    });
    
    if(btn.getAttribute('data-conexao') === 'Todos') {
      btn.classList.add('neu-btn-accent');
      btn.style.color = ''; btn.style.borderColor = ''; btn.style.background = '';
    } else if (btn.getAttribute('data-conexao') === 'Online') {
      btn.style.color = '#fff'; btn.style.borderColor = 'var(--success)'; btn.style.background = 'rgba(16,185,129,0.2)';
    } else if (btn.getAttribute('data-conexao') === 'Offline') {

  function renderListaConexao() {
    const cConex = document.getElementById('containerTropaConexao');
    if (!cConex) return;
    
    let usuarios = window.listaUsuariosAdmin || [];
    let arrCadastrados = usuarios.filter(u => u.status === 'ATIVO');
    
    // Aplicar Filtro de Busca Local (Conexão)
    const textoBuscaConexao = (document.getElementById('filtroTextoConexao') ? document.getElementById('filtroTextoConexao').value.trim().toLowerCase() : '');
    if (textoBuscaConexao !== '') {
      arrCadastrados = arrCadastrados.filter(u => {
        const tEmail = (u.email || '').toLowerCase();
        const tNome = (u.nome || '').toLowerCase();
        return tEmail.includes(textoBuscaConexao) || tNome.includes(textoBuscaConexao);
      });
    }

    function parseDataBr(str) {
      if (!str || str === 'Nunca') return 0;
      const parts = str.split(' ');
      if(parts.length < 2) return 0;
      const d = parts[0].split('/');
      const t = parts[1].split(':');
      if(d.length<3 || t.length<3) return 0;
      return new Date(d[2], d[1]-1, d[0], t[0], t[1], t[2]).getTime();
    }
    
    const agora = new Date().getTime();
    const arrOnline = arrCadastrados.filter(u => u.isOnline !== undefined ? u.isOnline : !(u.ultimoLogin || '').includes('Offline'));
    const arrOffline = arrCadastrados.filter(u => u.isOnline !== undefined ? !u.isOnline : (u.ultimoLogin || '').includes('Offline'));
    
    // Filtro Online / Offline Buttons
    const filtroStatus = window.filtroConexaoAdmin || 'Todos';

    let htmlConexao = '';
    if ((filtroStatus === 'Todos' || filtroStatus === 'Online') && arrOnline.length > 0) {
      htmlConexao += '<div style="font-size:10px;font-weight:900;color:var(--success);margin-top:4px;letter-spacing:0.5px;">ONLINE AGORA (' + arrOnline.length + ')</div>';
      htmlConexao += arrOnline.map(u => gerarHtmlConexao(u, true)).join('');
    }
    if ((filtroStatus === 'Todos' || filtroStatus === 'Offline') && arrOffline.length > 0) {
      htmlConexao += '<div style="font-size:10px;font-weight:900;color:var(--text-muted);margin-top:12px;letter-spacing:0.5px;">OFFLINE (' + arrOffline.length + ')</div>';
      htmlConexao += arrOffline.map(u => gerarHtmlConexao(u, false)).join('');
    }
    if (htmlConexao === '') htmlConexao = '<div style="font-size:11px;color:var(--text-muted);text-align:center;padding:16px;">Nenhum usuário encontrado.</div>';
    
    cConex.innerHTML = htmlConexao;
  }

      avatarHtml = `<img src="${op.fotoUrl}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" />`;
    } else {
      avatarHtml = `<span class="material-symbols-outlined" style="font-size:24px;color:var(--text-muted);">shield_person</span>`;
    }
    
    let dataFormatada = "Data Desconhecida";
    if (op.dataCadastro && op.dataCadastro !== "Desconhecida" && op.dataCadastro.trim() !== "") {
       // O formato esperado que vem de Seguranca.gs é "dd/MM/yyyy HH:mm:ss"
       dataFormatada = op.dataCadastro; 
    }
    
    return `
    <div class="card-operador" style="display:flex;align-items:center;justify-content:space-between;padding:16px;background:var(--bg-surface);border:var(--glass-border);border-radius:var(--radius-md);box-shadow:var(--neu-raised-sm);gap:16px;flex-wrap:wrap;transition:var(--transition);">
      <!-- Lado Esquerdo: Avatar + Info -->
      <div style="display:flex;align-items:center;gap:14px;flex:1;min-width:240px;">
        <div style="width:48px;height:48px;border-radius:50%;overflow:hidden;background:var(--bg-depressed);border:1px solid rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          ${avatarHtml}
        </div>
        <div style="display:flex;flex-direction:column;gap:2px;overflow:hidden;text-align:left;">
          <div style="font-weight:800;font-size:14px;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="${op.email}">
            ${op.email}
          </div>
          <div style="font-size:11px;color:var(--text-secondary);font-weight:600;">
            ${op.nome !== 'Nome a Definir' ? op.nome : 'Sem Nome de Guerra'} · <span style="color:var(--text-muted);">${op.unidade !== 'Unidade a Definir' ? op.unidade : 'Sem Unidade'}</span>
          </div>
          <div style="font-size:10px;color:var(--text-muted);font-weight:500;margin-top:2px;line-height:1.4;">
            Cadastrado em: <span style="color:var(--text-secondary);">${dataFormatada}</span><br>
            Último Acesso: <span style="color:var(--text-secondary);">${op.ultimoLogin || 'Nunca'}</span><br>
            Acessos Registrados: <span style="color:var(--text-secondary);">${op.qtdAcessos || 0}</span>
          </div>
          <div style="display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap;">
            <span style="font-size:9px;font-weight:900;padding:2px 8px;border-radius:99px;text-transform:uppercase;${estiloSeloPatente}">${perfilExibido}</span>
            ${statusSeloHtml}
          </div>
        </div>
      </div>
      <!-- Lado Direito: Ações (Botões de Perfil + Revogar) -->
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px;">
        <div style="display:flex;background:var(--bg-depressed);border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border);">
          <button style="border:none;background:${op.perfil==='Patrulheiro'?'var(--accent)':'transparent'};color:${op.perfil==='Patrulheiro'?'white':'var(--text-secondary)'};font-size:9px;font-weight:800;padding:6px 10px;cursor:pointer;text-transform:uppercase;transition:all 0.2s;" onclick="mudarPerfilGkDirect('${emailSeg}', 'Patrulheiro', this)">PTRL</button>
          <button style="border:none;border-left:1px solid var(--border);border-right:1px solid var(--border);background:${op.perfil==='Colaborador'?'var(--accent)':'transparent'};color:${op.perfil==='Colaborador'?'white':'var(--text-secondary)'};font-size:9px;font-weight:800;padding:6px 10px;cursor:pointer;text-transform:uppercase;transition:all 0.2s;" onclick="mudarPerfilGkDirect('${emailSeg}', 'Colaborador', this)">COLAB</button>
          <button style="border:none;background:${op.perfil==='Admin'?'var(--accent)':'transparent'};color:${op.perfil==='Admin'?'white':'var(--text-secondary)'};font-size:9px;font-weight:800;padding:6px 10px;cursor:pointer;text-transform:uppercase;transition:all 0.2s;" onclick="mudarPerfilGkDirect('${emailSeg}', 'Admin', this)">ADM</button>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          ${botoesHtml}
          <button class="neu-btn" style="padding:8px 12px;font-size:10px;height:36px;color:var(--danger);border-color:rgba(239,68,68,0.2);box-shadow:none;margin:0;display:flex;align-items:center;gap:4px;" onclick="excluirUsuarioDefinitivoGK('${emailSeg}', this)" title="Excluir Acesso Definitivamente">
            <span class="material-symbols-outlined" style="font-size:16px;">delete</span> EXCLUIR
          </button>
        </div>
      </div>
    </div>`;
  }

  function acionarBotaoUsuario(email, acao, btnElement) {
    if (acao === 'EXCLUIDO') {
      chamarAlertaTatico("ATENÇÃO PERIGO", "Tem certeza que deseja EXCLUIR este operador permanentemente? O acesso será revogado em definitivo.", "CONFIRMAR", function(confirma) {
        if(confirma) executarAcaoRede(email, acao, btnElement);
      });
    } else if (acao === 'REPROVADO' || acao === 'BLOQUEADO') {
      chamarAlertaTatico("ATENÇÃO", "Deseja " + acao.toLowerCase() + " o acesso deste operador?", "CONFIRMAR", function(confirma) {
        if(confirma) executarAcaoRede(email, acao, btnElement);
      });
    } else {
      executarAcaoRede(email, acao, btnElement);
    }
  }

  function executarAcaoRede(email, acao, btnElement) {
    var txtOriginal = btnElement.innerHTML;
    btnElement.innerHTML = '<span class="material-symbols-outlined" style="font-size:14px;vertical-align:middle;animation:spin 1s linear infinite">sync</span> AGUARDE';
    btnElement.disabled = true;
    var card = btnElement.closest('.card-operador');
    if(card) card.style.opacity = "0.6";

    let statusFinal = acao;
    if (acao === 'DESBLOQUEADO') statusFinal = 'ATIVO';

    google.script.run.withSuccessHandler(function(res) {
      if (res.sucesso) { 
        carregarUsuariosGrade();
      } else { 
        chamarAlertaTatico("FALHA", res.mensagem, "OK"); 
        if(card) card.style.opacity = "1"; 
        btnElement.innerHTML = txtOriginal;
        btnElement.disabled = false;
      }
    }).alterarStatusOperador(email, statusFinal);
  }

  function aprovarTodosPendentes() {
    chamarAlertaTatico("APROVAR TODOS", "Deseja realmente aprovar TODOS os operadores pendentes?", "CONFIRMAR", function(confirma) {
      if (confirma) {
        google.script.run.withSuccessHandler(function(res) {
          if (res.sucesso) {
            chamarAlertaTatico("SUCESSO", res.mensagem, "OK");
            carregarUsuariosGrade();
          } else {
            chamarAlertaTatico("ERRO", res.mensagem, "OK");
          }
        }).aprovarTodosUsuariosPendentes();
      }
    });
  }

  function processarDecisaoAdmin(email, decisao, botao) {
    var card = botao.closest('.card-operador'); 
    card.style.opacity = "0.3"; 
    botao.disabled = true;
    google.script.run.withSuccessHandler(function(res) {
      if (res.sucesso) { 
        chamarAlertaTatico("OK", "Operador: " + decisao, "OK"); 
        carregarUsuariosGrade();
      } else { 
        chamarAlertaTatico("FALHA", res.mensagem, "OK"); 
        card.style.opacity = "1"; 
        botao.disabled = false;
      }
    }).alterarStatusOperador(email, decisao);
  }
</script>

<!-- GATEKEEPER SCRIPTS -->
<script>
  function selecionarNovaPatente(btn) {
    // Remove estilos ativos de todos
    document.querySelectorAll('.patente-btn').forEach(b => {
      b.style.background = 'transparent';
      if(b.getAttribute('data-val') === 'Patrulheiro') { b.style.color = 'var(--text-secondary)'; b.style.borderColor = 'var(--border)'; }
      if(b.getAttribute('data-val') === 'Colaborador') { b.style.color = 'var(--text-secondary)'; b.style.borderColor = 'var(--border)'; }
      if(b.getAttribute('data-val') === 'Admin') { b.style.color = 'var(--text-secondary)'; b.style.borderColor = 'var(--border)'; }
    });
    
    // Adiciona estilo ativo no selecionado
    const val = btn.getAttribute('data-val');
    if (val === 'Patrulheiro') {
      btn.style.background = 'rgba(59,130,246,0.1)'; btn.style.color = '#3b82f6'; btn.style.borderColor = 'rgba(59,130,246,0.4)';
    } else if (val === 'Colaborador') {
      btn.style.background = 'rgba(245,158,11,0.1)'; btn.style.color = '#f59e0b'; btn.style.borderColor = 'rgba(245,158,11,0.4)';
    } else if (val === 'Admin') {
      btn.style.background = 'rgba(16,185,129,0.1)'; btn.style.color = '#10b981'; btn.style.borderColor = 'rgba(16,185,129,0.4)';
    }
    document.getElementById('gk_novo_perfil').value = val;
  }

  function addUsuarioGatekeeper(btn) {
    const email = document.getElementById('gk_novo_email').value.trim();
    const nome = document.getElementById('gk_novo_nome').value.trim();
    const perfil = document.getElementById('gk_novo_perfil').value;
    
    if (!email) {
      chamarAlertaTatico("ATENÇÃO", "E-mail é obrigatório.", "OK");
      return;
    }
    if (!nome) {
      chamarAlertaTatico("ATENÇÃO", "Nome de guerra é obrigatório.", "OK");
      return;
    }

    const txtOriginal = btn.innerHTML;
    btn.innerHTML = '<span class="material-symbols-outlined" style="font-size:18px;animation:spin 1s linear infinite;">refresh</span> ADICIONANDO NO BANCO DE DADOS...';
    btn.disabled = true;

    google.script.run.withSuccessHandler(function(resp) {
      btn.innerHTML = txtOriginal;
      btn.disabled = false;
      if (resp.sucesso) {
        chamarAlertaTatico("SUCESSO", resp.mensagem, "OK");
        
        // Limpar dados do formulário
        document.getElementById('gk_novo_email').value = '';
        document.getElementById('gk_novo_nome').value = '';
        document.getElementById('gk_novo_perfil').value = 'Patrulheiro';
        document.querySelectorAll('.patente-btn').forEach(b => {
          b.style.background = 'transparent'; b.style.color = 'var(--text-secondary)'; b.style.borderColor = 'var(--border)';
          if (b.getAttribute('data-val') === 'Patrulheiro') {
            b.style.background = 'rgba(59,130,246,0.1)'; b.style.color = '#3b82f6'; b.style.borderColor = 'rgba(59,130,246,0.4)';
          }
        });
        
        carregarListaUsuarios();
      } else {
        chamarAlertaTatico("FALHA", resp.mensagem, "OK");
      }
    }).adicionarUsuarioDireto(email, perfil, nome);
  }

  function mudarPerfilGkDirect(email, novoPerfil, btn) {
    const txtOrig = btn.innerHTML;
    btn.innerHTML = '<span class="material-symbols-outlined" style="font-size:12px;animation:spin 1s linear infinite;">refresh</span>';
    btn.disabled = true;
    
    google.script.run.withSuccessHandler(function(resp) {
      if(resp.sucesso) {
        chamarAlertaTatico("SUCESSO", resp.mensagem, "OK");
        carregarListaUsuarios();
      } else {
        btn.innerHTML = txtOrig;
        btn.disabled = false;
        chamarAlertaTatico("FALHA", resp.mensagem, "OK");
      }
    }).alterarPerfilUsuario(email, novoPerfil);
  }

  function excluirUsuarioDefinitivoGK(email, btn) {
    chamarAlertaTatico(
      "CONFIRMAR EXCLUSÃO DE ACESSO",
      "Tem certeza que deseja <b>EXCLUIR</b> instantaneamente o acesso de <b style='color:var(--accent);'>" + email + "</b>?<br><br>A exclusão será definitiva e revogará o acesso do usuário no sistema.",
      "CONFIRMAR",
      function(confirma) {
        if (!confirma) return;
        
        const txtOriginal = btn.innerHTML;
        btn.innerHTML = '<span class="material-symbols-outlined" style="font-size:14px;animation:spin 1s linear infinite;">refresh</span>';
        btn.disabled = true;

        google.script.run.withSuccessHandler(function(resp) {
          if(resp.sucesso) {
            chamarAlertaTatico("SUCESSO", resp.mensagem, "OK");
            carregarListaUsuarios();
          } else {
            btn.innerHTML = txtOriginal;
            btn.disabled = false;
            chamarAlertaTatico("FALHA", resp.mensagem, "OK");
          }
        }).excluirUsuarioDefinitivo(email);
      }
    );
  }
</script>
