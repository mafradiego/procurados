<script>
/* ================================================================
     MÓDULO DE AUDITORIA DE INCONSISTÊNCIAS
     Versão: v3.9.67
     Novidades:
       - Validação de formato do nº do Mandado
       - Validação de formato do nº do Processo
       - Validação de tamanho do Título do Mandado
     ================================================================ */

  // Cache dos dados de auditoria
  var _auditoriaCache = [];
  var _auditoriaFiltroAtivo = 'todos';

  /* ── Constantes de validação de formato ─────────────────────────── */

  // Nº Mandado padrão: 2000467-10.2019.8.08.0024.27.0007-08  (exatamente 36 chars)
  var _REGEX_MANDADO  = /^\d{7}-\d{2}\.\d{4}\.\d{1,2}\.\d{2}\.\d{4}\.\d{2}\.\d{4}-\d{2}$/;
  var _LEN_MANDADO_MIN = 36;
  var _LEN_MANDADO_MAX = 36;

  // Nº Processo padrão: 0001370-15.2017.8.26.0294  (exatamente 25 chars)
  var _REGEX_PROCESSO  = /^\d{7}-\d{2}\.\d{4}\.\d{1,2}\.\d{2}\.\d{4}$/;
  var _LEN_PROCESSO_MIN = 25;
  var _LEN_PROCESSO_MAX = 25;

  // Título: mínimo "Mandado de Prisão" (17), máximo "Mandado de Internação Recaptura" (31)
  var _LEN_TITULO_MIN = 17;
  var _LEN_TITULO_MAX = 31;

  /* ── Helper: extrair campo do infoProcessuais ────────────────────── */
  var _extP = function(txt, lbl) {
    var r = new RegExp(lbl + '\\s*([^|\\n]+)', 'i');
    var m = (txt || '').match(r);
    return m ? m[1].trim() : '';
  };

  /* ── Helper: obter título do mandado ────────────────────────────── */
  function _obterTitulo(d) {
    // 1º tenta dadosExtrasJSON.titulo
    try {
      var ext = JSON.parse(d.dadosExtrasJSON || '{}');
      if (ext.titulo && ext.titulo.trim()) return ext.titulo.trim();
    } catch(e) {}
    // 2º tenta d.titulo direto (alias)
    if (d.titulo && d.titulo.trim()) return d.titulo.trim();
    // 3º tenta extrair do infoProcessuais (Espécie de prisão ou Tipo:)
    var raw = d.infoProcessuais || '';
    var esp = _extP(raw, 'Espécie de pris[aã]o:') || _extP(raw, 'Tipo:');
    if (esp && esp.toLowerCase() !== 'n/a' && esp.trim()) return esp.trim();
    return '';
  }

  /* ── Helper: obter número do processo ───────────────────────────── */
  function _obterNumeroProcesso(d) {
    var raw = d.infoProcessuais || '';
    // Extrai "Nº do processo: XXXX"
    var p = _extP(raw, 'N[º°]? do processo:') || _extP(raw, 'Processo:');
    if (p) return p;
    // Fallback: procura padrão numérico CNJ embutido
    var m = raw.match(/\d{7}-\d{2}\.\d{4}\.\d{1,2}\.\d{2}\.\d{4}/);
    return m ? m[0] : '';
  }

  /* ── Helpers de detecção de inconsistências ─────────────────────── */

  function _isAtivo(d) {
    if (!d || !d.status) return false;
    var s = String(d.status).trim().toUpperCase();
    return s !== 'CAPTURADO';
  }

  function _semTipificacao(d) {
    if (!_isAtivo(d)) return false;
    var ci = (typeof classificarCrime === 'function') ? classificarCrime(d.infoProcessuais || '') : null;
    if (!ci) return true;
    var isNC = ci.naoClassificado === true || ci.nome === 'NÃO CLASSIFICADO' || ci.nome === 'Não Classificado' || ci.nome === 'Outros';
    if (isNC) return true;
    if (ci.todosCrimes && Array.isArray(ci.todosCrimes)) {
      for (var i = 0; i < ci.todosCrimes.length; i++) {
        var c = ci.todosCrimes[i];
        if (c.naoClassificado === true || c.nome === 'NÃO CLASSIFICADO' || c.nome === 'Não Classificado' || c.nome === 'Outros' || !c.tipificacaoCompleta) {
          return true;
        }
      }
    }
    return false;
  }

  function _semLeiArtigo(d) {
    if (!_isAtivo(d)) return false;
    var raw = d.infoProcessuais || '';
    if (!raw || raw.trim().length < 5) return true;
    var lei    = _extP(raw, 'Lei:');
    var artigo = _extP(raw, 'Artigo:');
    var invalidos = ['', 'n/a', '-', 'não informado', 'nao informado', 'vide info proc.'];
    var semLei = !lei || invalidos.includes((lei || '').trim().toLowerCase());
    var semArtigo = !artigo || invalidos.includes((artigo || '').trim().toLowerCase());
    if (semLei || semArtigo) return true;

    var ci = (typeof classificarCrime === 'function') ? classificarCrime(raw) : null;
    if (ci && (ci.naoClassificado === true || ci.nome === 'NÃO CLASSIFICADO' || ci.nome === 'Não Classificado' || ci.nome === 'Outros')) return true;

    return false;
  }

  function _semEndereco(d) {
    return d && _isAtivo(d) && (d.semEndereco === true || !d.enderecoPrincipal || d.enderecoPrincipal.trim() === '');
  }

  function _enderecoSemCoordenadas(d) {
    if (!_isAtivo(d)) return false;
    if (d.semEndereco) return false;
    var end = (d.enderecoPrincipal || '').trim();
    if (!end) return false;
    var lat = parseFloat(d.lat);
    var lng = parseFloat(d.lng);
    return isNaN(lat) || isNaN(lng) || Math.abs(lat) < 0.1 || Math.abs(lng) < 0.1;
  }

  function _semCidade(d) {
    if (!_isAtivo(d)) return false;
    if (d.semEndereco) return false;
    var end = (d.enderecoPrincipal || '').trim();
    if (!end) return false;
    var temCidade = d.cidade && d.cidade.trim().length > 2;
    var virgulas = (end.match(/,/g) || []).length;
    return !temCidade && virgulas < 2;
  }

  /* ── NOVAS verificações de formato ──────────────────────────────── */

  function _mandadoFormatoInvalido(d) {
    if (!_isAtivo(d)) return false;
    var num = (d.mandado || '').trim();
    if (!num) return false; // sem mandado → já pega em outra categoria
    var tamanhoOk = num.length >= _LEN_MANDADO_MIN && num.length <= _LEN_MANDADO_MAX;
    var formatoOk = _REGEX_MANDADO.test(num);
    return !tamanhoOk || !formatoOk;
  }

  function _processoFormatoInvalido(d) {
    if (!_isAtivo(d)) return false;
    var num = _obterNumeroProcesso(d).trim();
    if (!num) return false; // sem processo cadastrado → não penaliza aqui (já falta lei/artigo)
    var tamanhoOk = num.length >= _LEN_PROCESSO_MIN && num.length <= _LEN_PROCESSO_MAX;
    var formatoOk = _REGEX_PROCESSO.test(num);
    return !tamanhoOk || !formatoOk;
  }

  function _tituloFormatoInvalido(d) {
    if (!_isAtivo(d)) return false;
    var titulo = _obterTitulo(d);
    if (!titulo) return false; // título não preenchido → outro problema
    var len = titulo.length;
    return len < _LEN_TITULO_MIN || len > _LEN_TITULO_MAX;
  }

  function _usouFallback(d) {
    if (!_isAtivo(d)) return false;
    var raw = d.infoProcessuais || '';
    var artigo = _extP(raw, 'Artigo:');
    // Se o artigo é "Vide Info Proc." significa que o parser não extraiu corretamente
    if (artigo && artigo.toLowerCase().includes('vide info')) return true;
    // Se classificarCrime existe, verificar se usou fallback (tabela de leis não bateu)
    if (typeof classificarCrime === 'function' && window._tabelaLeis && window._tabelaLeis.length > 0) {
      var ci = classificarCrime(raw);
      // Se o crime foi classificado mas não tem tipificacaoCompleta, significa que usou o fallback hardcoded
      if (ci && !ci.naoClassificado && !ci.tipificacaoCompleta && ci.nome !== 'Outros') return true;
    }
    return false;
  }

  // v4.9.85: Detecta inconsistência de cidade/UF inserida pela validação pré-geocodificação
  function _enderecoSemCidadeUF(d) {
    if (!_isAtivo(d)) return false;
    var obs = (d.observacoes || '').toUpperCase();
    if (obs.includes('INCONSISTÊNCIA CIDADE') || obs.includes('INCONSISTÊNCIA: ENDEREÇO')) return true;
    // Verificar se o endereço tem pino na sede por falta de cidade
    if (obs.includes('CIDADE NÃO COBERTA NA TABELA CIDADES')) return true;
    return false;
  }

  function _getInconsistencias(d) {
    var cats = [];
    if (_semTipificacao(d))          cats.push('tipificacao');
    if (_semLeiArtigo(d))            cats.push('lei');
    if (_usouFallback(d))            cats.push('tipificacao-fallback');
    if (_mandadoFormatoInvalido(d))  cats.push('fmt-mandado');
    if (_processoFormatoInvalido(d)) cats.push('fmt-processo');
    if (_tituloFormatoInvalido(d))   cats.push('fmt-titulo');
    return cats;
  }

  /* ── Carregar e renderizar ─────────────────────────────────────── */

  function carregarAuditoria() {
    if (typeof _buildCidadesDatalist === 'function') _buildCidadesDatalist();
    var loading  = document.getElementById('auditoria-loading');
    var lista    = document.getElementById('auditoria-lista');
    var vazio    = document.getElementById('auditoria-vazio');
    var resumo   = document.getElementById('auditoria-resumo');
    var filtros  = document.getElementById('auditoria-filtros');
    var iconReload = document.getElementById('iconReloadAuditoria');

    if (iconReload) { iconReload.classList.add('spin-anim'); }

    if (loading)  { loading.style.display = 'flex'; }
    if (lista)    { lista.style.display = 'none'; lista.innerHTML = ''; }
    if (vazio)    { vazio.style.display = 'none'; }
    if (resumo)   { resumo.style.display = 'none'; }
    if (filtros)  { filtros.style.display = 'none'; }

    if (!(typeof dadosMandados !== 'undefined' ? dadosMandados : null) || !Array.isArray(dadosMandados) || dadosMandados.length === 0) {
      if (loading) loading.innerHTML = '<span class="material-symbols-outlined" style="font-size:48px;opacity:0.4;">error_outline</span><div style="font-size:13px;font-weight:700;color:#ef4444;">Banco de dados não carregado ainda. Aguarde e tente novamente.</div>';
      return;
    }

    setTimeout(function() { _processarAuditoria(); }, 60);
  }

  function _processarAuditoria() {
    var iconReload = document.getElementById('iconReloadAuditoria');
    if (iconReload) { iconReload.classList.remove('spin-anim'); }

    var cntTip = 0, cntLei = 0, cntFmtM = 0, cntFmtP = 0, cntFmtT = 0, cntFallback = 0;
    _auditoriaCache = [];

    dadosMandados.forEach(function(d) {
      var cats = _getInconsistencias(d);
      if (cats.length === 0) return;
      _auditoriaCache.push({ d: d, cats: cats });
      if (cats.includes('tipificacao'))          cntTip++;
      if (cats.includes('lei'))                   cntLei++;
      if (cats.includes('tipificacao-fallback'))   cntFallback++;
      if (cats.includes('fmt-mandado'))           cntFmtM++;
      if (cats.includes('fmt-processo'))          cntFmtP++;
      if (cats.includes('fmt-titulo'))            cntFmtT++;
    });

    var _s = function(id, v) { var el = document.getElementById(id); if(el) el.textContent = v; };
    _s('cnt-sem-tipificacao', cntTip);
    _s('cnt-sem-lei',         cntLei);
    _s('cnt-tipif-fallback',  cntFallback);
    _s('cnt-fmt-mandado',     cntFmtM);
    _s('cnt-fmt-processo',    cntFmtP);
    _s('cnt-fmt-titulo',      cntFmtT);
    _s('cnt-total-auditoria', _auditoriaCache.length);

    // Atualizar badges das categorias de filtro
    _s('badge-cat-todos',               _auditoriaCache.length);
    _s('badge-cat-tipificacao',         cntTip);
    _s('badge-cat-lei',                 cntLei);
    _s('badge-cat-tipificacao-fallback', cntFallback);
    _s('badge-cat-fmt-mandado',         cntFmtM);
    _s('badge-cat-fmt-processo',        cntFmtP);
    _s('badge-cat-fmt-titulo',          cntFmtT);

    var badge = document.getElementById('badgeAuditoriaNav');
    if (badge) {
      badge.textContent = _auditoriaCache.length;
      badge.style.display = _auditoriaCache.length > 0 ? 'flex' : 'none';
    }

    var loading = document.getElementById('auditoria-loading');
    if (loading) loading.style.display = 'none';

    var resumo  = document.getElementById('auditoria-resumo');
    var filtros = document.getElementById('auditoria-filtros');
    if (resumo)  resumo.style.display  = 'grid';
    if (filtros) filtros.style.display = 'flex';

    if (_auditoriaCache.length === 0) {
      var vazio = document.getElementById('auditoria-vazio');
      if (vazio) vazio.style.display = 'block';
      return;
    }

    var prevFilter = (typeof _auditoriaFiltroAtivo !== 'undefined' && _auditoriaFiltroAtivo) ? _auditoriaFiltroAtivo : 'todos';
    _auditoriaFiltroAtivo = prevFilter;

    filtrarAuditoria(prevFilter);
  }

  function removerAcentosAuditoria(str) {
    if (!str) return '';
    return String(str)
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .toUpperCase();
  }

  function limparBuscaAuditoria() {
    var input = document.getElementById('buscaAuditoriaInput');
    if (input) { input.value = ''; input.focus(); }
    filtrarAuditoria(_auditoriaFiltroAtivo);
  }

  function filtrarAuditoriaSearch() {
    filtrarAuditoria(_auditoriaFiltroAtivo);
  }

  function filtrarAuditoria(cat, btn) {
    _auditoriaFiltroAtivo = cat || 'todos';
    document.querySelectorAll('.audit-filter-btn').forEach(function(b) {
      b.classList.remove('active'); b.style.opacity = '0.6';
    });
    var btnAtivo = btn || document.querySelector('.audit-filter-btn[data-cat="' + _auditoriaFiltroAtivo + '"]');
    if (btnAtivo) { btnAtivo.classList.add('active'); btnAtivo.style.opacity = '1'; }

    var inputBusca = document.getElementById('buscaAuditoriaInput');
    var btnLimpar = document.getElementById('btnLimparBuscaAuditoria');
    var rawSearch = (inputBusca || {}).value || '';
    if (btnLimpar) btnLimpar.style.display = rawSearch.trim().length > 0 ? 'flex' : 'none';

    var query = removerAcentosAuditoria(rawSearch.trim());

    var filtrados = _auditoriaCache.filter(function(item) {
      var catOk = (_auditoriaFiltroAtivo === 'todos' || item.cats.includes(_auditoriaFiltroAtivo));
      if (!catOk) return false;
      if (!query) return true;

      var nomeNorm = removerAcentosAuditoria(item.d.nome || '');
      var mandadoNorm = removerAcentosAuditoria(item.d.mandado || '');
      var cpfNorm = removerAcentosAuditoria(item.d.cpf || '');
      return nomeNorm.includes(query) || mandadoNorm.includes(query) || cpfNorm.includes(query);
    });

    _renderizarAuditoria(filtrados);
  }

  function _renderizarAuditoria(itens) {
    var lista = document.getElementById('auditoria-lista');
    if (!lista) return;
    lista.innerHTML = '';
    lista.style.display = 'flex';

    if (itens.length === 0) {
      lista.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-muted);font-size:13px;font-weight:700;">Nenhum mandado encontrado.</div>';
      return;
    }

    itens.forEach(function(item) {
      var d    = item.d;
      var cats = item.cats;

      var catColors = {
        tipificacao:             { cor: '#ef4444', label: '⚠ Lei não cadastrada' },
        lei:                     { cor: '#f59e0b', label: '⚠ Sem Lei/Artigo' },
        'tipificacao-fallback':   { cor: '#f97316', label: '⚠ Artigo não vinculado' },
        endereco:                { cor: '#8b5cf6', label: '⚠ Sem Endereço' },
        cidade:                  { cor: '#3b82f6', label: '⚠ Sem Cidade' },
        'cidade-uf':             { cor: '#e11d48', label: '⚠ Cidade/UF Inválida' },
        'fmt-mandado':           { cor: '#f43f5e', label: '⚠ Nº do Mandado Inválido' },
        'fmt-processo':          { cor: '#fb923c', label: '⚠ Nº Processo Inválido' },
        'fmt-titulo':            { cor: '#a78bfa', label: '⚠ Título Inválido' }
      };
      var badgesHtml = cats.map(function(c) {
        var info = catColors[c] || { cor: '#6b7280', label: c };
        return '<span style="font-size:9px;font-weight:800;padding:2px 8px;background:' + info.cor + '22;border:1px solid ' + info.cor + '55;color:' + info.cor + ';border-radius:99px;">' + info.label + '</span>';
      }).join('');

      var raw          = d.infoProcessuais || '';
      var ci           = (typeof classificarCrime === 'function') ? classificarCrime(raw) : null;
      var leiAtual     = '';
      var artigoAtual  = '';

      // Tenta encontrar o crime específico que está sem tipificação / não cadastrado
      if (ci && ci.todosCrimes && Array.isArray(ci.todosCrimes) && ci.todosCrimes.length > 0) {
        var crimeErrado = ci.todosCrimes.find(function(c) {
          return c.naoClassificado === true || c.nome === 'NÃO CLASSIFICADO' || c.nome === 'Não Classificado' || c.nome === 'Outros' || !c.tipificacaoCompleta;
        });
        if (crimeErrado) {
          leiAtual = crimeErrado.lei || '';
          artigoAtual = crimeErrado.artigo || '';
        } else {
          leiAtual = ci.todosCrimes[0].lei || '';
          artigoAtual = ci.todosCrimes[0].artigo || '';
        }
      }

      if (!leiAtual) leiAtual = _extP(raw, 'Lei:') || '';
      if (!artigoAtual) artigoAtual = _extP(raw, 'Artigo:') || '';

      var endAtual     = d.enderecoPrincipal || '';
      var numMandado   = (d.mandado || '').trim();
      var numProcesso  = _obterNumeroProcesso(d);
      var tituloAtual  = _obterTitulo(d);

      // Dicas de validação para exibir no card
      var dicaMandado  = cats.includes('fmt-mandado')
        ? '<div style="font-size:9px;color:#f43f5e;margin-top:2px;">Formato esperado: <code>0001370-15.2017.8.26.0294.10.0002-05</code> (' + _LEN_MANDADO_MIN + '–' + _LEN_MANDADO_MAX + ' chars). Atual: ' + numMandado.length + ' chars.</div>' : '';
      var dicaProcesso = cats.includes('fmt-processo')
        ? '<div style="font-size:9px;color:#fb923c;margin-top:2px;">Formato esperado: <code>0001370-15.2017.8.26.0294</code> (' + _LEN_PROCESSO_MIN + '–' + _LEN_PROCESSO_MAX + ' chars). Atual: ' + numProcesso.length + ' chars.</div>' : '';
      var dicaTitulo   = cats.includes('fmt-titulo')
        ? '<div style="font-size:9px;color:#a78bfa;margin-top:2px;">Tamanho esperado: ' + _LEN_TITULO_MIN + '–' + _LEN_TITULO_MAX + ' chars (ex: "Mandado de Prisão" … "Mandado de Internação Recaptura"). Atual: <b>' + tituloAtual.length + '</b> chars.</div>' : '';

      // Montar SOMENTE os campos que necessitam de correção para esta inconsistência
      var bodyFieldsHtml = '';
      if (cats.includes('fmt-mandado')) {
        bodyFieldsHtml += _buildEditFieldExtra('Nº Mandado', 'mand-' + d.mandado, numMandado, '#f43f5e', dicaMandado);
      }
      if (cats.includes('fmt-processo')) {
        bodyFieldsHtml += _buildEditFieldExtra('Nº Processo (de infoProcessuais)', 'proc-num-' + d.mandado, numProcesso, '#fb923c', dicaProcesso);
      }
      if (cats.includes('fmt-titulo')) {
        bodyFieldsHtml += _buildEditFieldExtra('Título do Mandado (dadosExtras.titulo)', 'tit-' + d.mandado, tituloAtual, '#a78bfa', dicaTitulo);
      }
      if (cats.includes('lei') || cats.includes('tipificacao') || cats.includes('tipificacao-fallback')) {
        bodyFieldsHtml += _buildProcessualGrid(d.mandado, raw);
      }
      if (cats.includes('endereco') || cats.includes('cidade') || cats.includes('cidade-uf')) {
        bodyFieldsHtml += _buildAddressGrid(d.mandado, endAtual, d.cidade || '', cats);
      }

      // Se nenhum campo específico for montado por exceção, exibe campos padrão
      if (!bodyFieldsHtml) {
        bodyFieldsHtml += _buildEditFieldExtra('Nº Mandado', 'mand-' + d.mandado, numMandado, '#334155', dicaMandado);
        bodyFieldsHtml += _buildProcessualGrid(d.mandado, raw);
        bodyFieldsHtml += _buildAddressGrid(d.mandado, endAtual, d.cidade || '', cats);
      }

      var card = document.createElement('div');
      card.className = 'audit-card card-operador';
      card.setAttribute('data-mandado', d.mandado);
      card.style.cssText = 'background:var(--bg-surface);border:var(--glass-border);border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--neu-raised-sm);transition:var(--transition);';

      card.innerHTML = '\
        <div style="padding:14px 16px;display:flex;align-items:flex-start;gap:14px;cursor:pointer;" onclick="_toggleAuditCard(this.closest(\'.audit-card\'))">\
          <div style="flex:1;min-width:0;">\
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;">\
              <span style="font-size:13px;font-weight:900;color:var(--text-primary);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px;">' + (d.nome || 'Nome não informado') + '</span>\
              <span onclick="event.stopPropagation(); navigator.clipboard.writeText(\'' + _esc(d.nome) + '\'); this.innerText=\'check\'; setTimeout(()=>this.innerText=\'content_copy\', 1000);" class="material-symbols-outlined" style="font-size:14px;color:var(--text-muted);cursor:pointer;" title="Copiar Nome">content_copy</span>\
              ' + badgesHtml + '\
            </div>\
            <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;">\
              <span style="font-size:10px;color:var(--text-muted);font-family:monospace;">Mandado: ' + (numMandado || '-') + '</span>\
              <span onclick="event.stopPropagation(); navigator.clipboard.writeText(\'' + _esc(numMandado) + '\'); this.innerText=\'check\'; setTimeout(()=>this.innerText=\'content_copy\', 1000);" class="material-symbols-outlined" style="font-size:14px;color:var(--text-muted);cursor:pointer;" title="Copiar Mandado">content_copy</span>\
              <span style="font-size:10px;color:var(--text-muted);">CPF: ' + (d.cpf || '-') + '</span>\
              <span style="font-size:10px;color:var(--text-muted);">Validade: ' + (d.validade || '-') + '</span>\
            </div>\
          </div>\
          <span class="material-symbols-outlined audit-chevron" style="font-size:20px;color:var(--text-muted);flex-shrink:0;transition:transform 0.2s;">expand_more</span>\
        </div>\
        <div class="audit-card-body" style="display:none;padding:0 16px 16px;border-top:1px solid var(--border);">\
          <div style="padding-top:14px;display:flex;flex-direction:column;gap:14px;">\
            ' + bodyFieldsHtml + '\
            <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:4px;">\

  function _obterCamposProcessuaisAgrupados(raw) {
    var partes = (raw || '').split(/[|\n]/);
    var gerais = [];
    var crimes = [];
    var crimeAtual = null;

    partes.forEach(function(p) {
      p = p.trim();
      if (!p) return;
      var colonIdx = p.indexOf(':');
      if (colonIdx > 0) {
        var key = p.substring(0, colonIdx).trim();
        var val = p.substring(colonIdx + 1).trim();
        var kLower = key.toLowerCase();

        if (kLower === 'lei' || kLower === 'lei:') {
          if (crimeAtual && (crimeAtual.lei || crimeAtual.artigo)) {
            crimes.push(crimeAtual);
          }
          crimeAtual = { lei: val, artigo: '', paragrafo: '', inciso: '', campos: [{ key: key, val: val }] };
        } else if (crimeAtual) {
          if (kLower === 'artigo') crimeAtual.artigo = val;
          if (kLower === 'parágrafo' || kLower === 'paragrafo') crimeAtual.paragrafo = val;
          if (kLower === 'inciso') crimeAtual.inciso = val;
          crimeAtual.campos.push({ key: key, val: val });
        } else {
          gerais.push({ key: key, val: val });
        }
      } else {
        gerais.push({ key: 'Obs', val: p });
      }
    });

    if (crimeAtual && (crimeAtual.lei || crimeAtual.artigo)) {
      crimes.push(crimeAtual);
    }

    return { gerais: gerais, crimes: crimes, avulsos: [] };
  }

  function _salvarAuditoria(mandado) {
    var leiEl      = document.getElementById('lei-'      + mandado);
    var artEl      = document.getElementById('art-'      + mandado);
    var procEl     = document.getElementById('proc-'     + mandado);
    var logradouroEl = document.getElementById('logradouro-' + mandado);
    var numeroEl     = document.getElementById('numero-'     + mandado);
    var bairroEl     = document.getElementById('bairro-'     + mandado);
    var cidadeEl     = document.getElementById('cidade-'     + mandado);
    var ufEl         = document.getElementById('uf-'         + mandado);
    
    var mandEl     = document.getElementById('mand-'     + mandado);
    var procNumEl  = document.getElementById('proc-num-' + mandado);
    var titEl      = document.getElementById('tit-'      + mandado);

    var lei        = leiEl     ? leiEl.value.trim()     : '';
    var artigo     = artEl     ? artEl.value.trim()     : '';

    if (!lei) {
      var inpLei = document.querySelector('.audit-proc-field[data-mandado="' + mandado + '"][data-key="Lei"], .audit-proc-field[data-mandado="' + mandado + '"][data-key="lei"]');
      if (inpLei) lei = inpLei.value.trim();
    }
    if (!artigo) {
      var inpArt = document.querySelector('.audit-proc-field[data-mandado="' + mandado + '"][data-key="Artigo"], .audit-proc-field[data-mandado="' + mandado + '"][data-key="artigo"]');
      if (inpArt) artigo = inpArt.value.trim();
    }
    
    // Reconstruir Info Processual dos inputs do Grid
    var inputs = document.querySelectorAll('.audit-proc-field[data-mandado="' + mandado + '"]');
    var procParts = [];
    inputs.forEach(function(inp) {
      var key = inp.getAttribute('data-key');
      var val = inp.value.trim();
      if (key && val) {
        procParts.push(key + ': ' + val);
      }
    });

    var avulsosEl = document.querySelector('.audit-proc-avulsos[data-mandado="' + mandado + '"]');
    if (avulsosEl && avulsosEl.value.trim()) {
      var avPartes = avulsosEl.value.split('\n').map(function(s) { return s.trim(); }).filter(function(s) { return s; });
      avPartes.forEach(function(av) {
        procParts.push(av);
      });
    }

    // Garantir que Lei e Artigo editados estejam na infoProc
    var temLei = procParts.some(function(p) { return p.toLowerCase().indexOf('lei:') === 0 || p.toLowerCase().indexOf('lei :') === 0; });
    var temArt = procParts.some(function(p) { return p.toLowerCase().indexOf('artigo:') === 0 || p.toLowerCase().indexOf('artigo :') === 0; });
    
    if (lei && !temLei) procParts.push('Lei: ' + lei);
    if (artigo && !temArt) procParts.push('Artigo: ' + artigo);

    var infoProc   = procParts.join(' | ');
    
    var logradouro = logradouroEl ? logradouroEl.value.trim() : '';
    var numero     = numeroEl     ? numeroEl.value.trim()     : '';
    var bairro     = bairroEl     ? bairroEl.value.trim()     : '';
    var cidade     = cidadeEl     ? cidadeEl.value.trim().toUpperCase() : '';
    var uf         = ufEl         ? ufEl.value.trim().toUpperCase()     : '';

    var endereco = '';
    var partes = [];
    if (logradouro) partes.push(logradouro);
    if (numero) {
      if (partes.length > 0) partes[partes.length - 1] += ', ' + numero;
      else partes.push(numero);
    }
    if (bairro) {
      if (partes.length > 0) partes[partes.length - 1] += ' - ' + bairro;
      else partes.push(bairro);
    }
    if (cidade) {
      var cidStr = cidade;
      if (uf) cidStr += ' - ' + uf;
      partes.push(cidStr);
    }
    endereco = partes.join(', ');
    var novoMandado= mandEl    ? mandEl.value.trim()    : '';
    var novoProc   = procNumEl ? procNumEl.value.trim() : '';
    var novoTitulo = titEl     ? titEl.value.trim()     : '';

    if (!lei && !artigo && !infoProc && !endereco && !cidade && !novoMandado && !novoProc && !novoTitulo) {
      return chamarAlertaTatico('ATENÇÃO', 'Preencha ao menos um campo antes de salvar.', 'OK');
    }

    var payload = {
      mandado: mandado,
      novoNumeroMandado: novoMandado !== mandado ? novoMandado : '',
      novoNumeroProcesso: novoProc,
      novoTitulo: novoTitulo,
      lei: lei,
      artigo: artigo,
      infoProcessuais: infoProc,
      enderecoPrincipal: endereco,
      cidade: cidade
    };

    var btn = event && event.target ? event.target.closest('button') : null;
    if (btn) { btn.disabled = true; btn.textContent = 'Salvando...'; }

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(resp) {
          if (btn) { btn.disabled = false; btn.innerHTML = '<span class="material-symbols-outlined" style="font-size:15px;">save</span>SALVAR CORREÇÃO'; }
          if (resp && resp.sucesso) {
            chamarAlertaTatico('SALVO', 'Correção aplicada com sucesso no banco de dados.', 'OK');
            _removerCardAuditoria(mandado);
            if ((typeof dadosMandados !== 'undefined' ? dadosMandados : null)) {
              var idx = dadosMandados.findIndex(function(x) { return x.mandado === mandado; });
              if (idx >= 0) {
                if (resp.infoProcessuais) dadosMandados[idx].infoProcessuais = resp.infoProcessuais;
                else if (infoProc) dadosMandados[idx].infoProcessuais = infoProc;
                
                if (endereco) dadosMandados[idx].enderecoPrincipal = endereco;
                if (cidade)   dadosMandados[idx].cidade = cidade;
                if (lei)      dadosMandados[idx].lei = lei;
                if (artigo)   dadosMandados[idx].artigo = artigo;
                

                if (resp.lat !== undefined) dadosMandados[idx].lat = resp.lat;
                if (resp.lng !== undefined) dadosMandados[idx].lng = resp.lng;
                if (resp.lat && resp.lng) {
                  dadosMandados[idx].semEndereco = false;
                } else {
                  dadosMandados[idx].semEndereco = true;
                }
                if (resp.batalhao) dadosMandados[idx].batalhao = resp.batalhao;
                if (resp.cpi) dadosMandados[idx].cpi = resp.cpi;
                if (resp.bpmArea) dadosMandados[idx].bpmArea = resp.bpmArea;
                if (resp.ciaArea) dadosMandados[idx].ciaArea = resp.ciaArea;
                if (resp.dpArea) dadosMandados[idx].dpArea = resp.dpArea;
              }
            }
          } else {
            chamarAlertaTatico('ERRO', (resp && resp.mensagem) ? resp.mensagem : 'Falha ao salvar.', 'OK');
          }
        })
        .withFailureHandler(function(err) {
          if (btn) { btn.disabled = false; btn.innerHTML = '<span class="material-symbols-outlined" style="font-size:15px;">save</span>SALVAR CORREÇÃO'; }
          chamarAlertaTatico('ERRO DE REDE', 'Falha na comunicação: ' + err.message, 'OK');
        })
        .corrigirInconsistenciaMandado(payload);
    } else {
      setTimeout(function() {
        if (btn) { btn.disabled = false; btn.innerHTML = '<span class="material-symbols-outlined" style="font-size:15px;">save</span>SALVAR CORREÇÃO'; }
        chamarAlertaTatico('MOCK OK', 'Salvo localmente (modo teste).', 'OK');
        _removerCardAuditoria(mandado);
      }, 600);
    }
  }

  function _marcarRevisado(mandado) { _removerCardAuditoria(mandado); }

  function _removerCardAuditoria(mandado) {
    var card = document.querySelector('.audit-card[data-mandado="' + mandado + '"]');
    if (card) {
      card.style.transition = 'opacity 0.3s, transform 0.3s';
      card.style.opacity = '0';
      card.style.transform = 'translateX(20px)';
      setTimeout(function() { if (card.parentNode) card.parentNode.removeChild(card); }, 300);
    }

    _auditoriaCache = _auditoriaCache.filter(function(item) { return item.d.mandado !== mandado; });

    var badge = document.getElementById('badgeAuditoriaNav');
    if (badge) {
      badge.textContent = _auditoriaCache.length;
      badge.style.display = _auditoriaCache.length > 0 ? 'flex' : 'none';
    }

    // Recalcular contadores
    var cnt = { tipificacao:0, lei:0, 'tipificacao-fallback':0, 'fmt-mandado':0, 'fmt-processo':0, 'fmt-titulo':0 };
    _auditoriaCache.forEach(function(it) {
      it.cats.forEach(function(c) { if (cnt[c] !== undefined) cnt[c]++; });
    });
    var _s = function(id, v) { var el = document.getElementById(id); if(el) el.textContent = v; };
    _s('cnt-sem-tipificacao', cnt.tipificacao);
    _s('cnt-sem-lei',         cnt.lei);
    _s('cnt-tipif-fallback',  cnt['tipificacao-fallback']);
    _s('cnt-fmt-mandado',     cnt['fmt-mandado']);
    _s('cnt-fmt-processo',    cnt['fmt-processo']);
    _s('cnt-fmt-titulo',      cnt['fmt-titulo']);
    _s('cnt-total-auditoria', _auditoriaCache.length);

    var lista = document.getElementById('auditoria-lista');
    if (lista && lista.children.length === 0) {
      lista.style.display = 'none';
      var vazio = document.getElementById('auditoria-vazio');
      if (vazio) vazio.style.display = 'block';
    }
  }

  // Expor globais
  window.carregarAuditoria = carregarAuditoria;
  window.filtrarAuditoria  = filtrarAuditoria;
  window._toggleAuditCard  = _toggleAuditCard;
  window._salvarAuditoria  = _salvarAuditoria;
  window._marcarRevisado   = _marcarRevisado;
  window._processarAuditoria = _processarAuditoria;

</script>
